/* ═══════ Búsqueda ═══════ */
async function buscar(q, city) {
  city = city || CORDOBA;
  const local = esLocal(city);
  q = q.trim();
  let m;
  if ((m = q.match(/^(-?\d+(?:\.\d+)?)\s*[,; ]\s*(-?\d+(?:\.\d+)?)$/))) {
    let a = parseFloat(m[1]), b = parseFloat(m[2]);
    if (Math.abs(a) > Math.abs(b)) { const t = a; a = b; b = t; } // lat ~ -31, lon ~ -64
    return { go: { lat: a, lon: b } };
  }
  // Salta: matrícula catastral (número de catastro) o nomenclatura de 14 caracteres de IDESA
  if (provDe(city) === 'salta') {
    const F = fuenteCat(city);
    const ir = function (fs) { const p = interiorPoint(fs[0].geometry); return { go: { lat: p[1], lon: p[0] } }; };
    if (/^\d{1,7}$/.test(q)) {
      const cql = 'catastro=' + parseInt(q, 10) + (city.cpua ? " AND departa='01'" : '');
      const fs = await wfs(F.par, cql, { base: F.base, count: 8 });
      if (!fs.length) return { error: 'No encontré la matrícula ' + q + (city.cpua ? ' en el departamento Capital.' : ' en el catastro provincial.') };
      if (fs.length === 1 || city.cpua) return ir(fs);
      return { list: fs.map(function (f) { const p = interiorPoint(f.geometry); return { label: 'Matrícula ' + q + ' · Depto. ' + S_(f.properties.departa) + ' · ' + S_(f.properties.vinculacio), lat: p[1], lon: p[0] }; }) };
    }
    if (/^[0-9A-Z]{14}$/i.test(q.replace(/[\s-]/g, ''))) {
      const fs = await wfs(F.par, "vinculacio='" + q.replace(/[\s-]/g, '').toUpperCase() + "'", { base: F.base, count: 1 });
      if (!fs.length) return { error: 'No encontré la nomenclatura ' + q + ' en el catastro provincial.' };
      return ir(fs);
    }
  }
  let prov = null;
  // La nomenclatura corta (04-02-065-002) solo se puede completar en Córdoba capital; en el interior va la provincial de 16 dígitos
  if (provDe(city) !== 'cordoba') { /* sin nomenclatura de Córdoba */ }
  else if (!local && /^\d{1,2}\s*-\s*\d{1,2}\s*-\s*\d{1,3}\s*-\s*\d{1,3}$/.test(q)) prov = nomProv(q.replace(/\s/g, ''));
  else if (/^\d{16}$/.test(q)) prov = q;
  const enCba = provDe(city) === 'cordoba';
  if (prov) {
    let fs = await wfs('parcelas', "Nomenclatura='" + prov + "'", { count: 1 });
    const mcp = local ? muniCiudad(city) : null;
    if (!fs.length && mcp && mcp.parcelas && mcp.parcelas.nom) fs = await wfs(mcp.parcelas.l, mcp.parcelas.nom + "='" + prov + "'", { count: 1 }).catch(function () { return []; });
    if (!fs.length) return { error: 'No encontré la parcela ' + q + ' en el parcelario provincial' + (mcp && mcp.parcelas ? ' ni en el municipal' : '') + '.' };
    const p = interiorPoint(fs[0].geometry); return { go: { lat: p[1], lon: p[0] } };
  }
  if (enCba && /^\d{10,13}$/.test(q)) {
    const fs = await wfs('parcelas', 'Nro_Cuenta=' + q, { count: 1 });
    if (!fs.length) return { error: 'No encontré la cuenta ' + q + '.' };
    const p = interiorPoint(fs[0].geometry); return { go: { lat: p[1], lon: p[0] } };
  }
  // dirección: Georef (datos.gob.ar); si no encuentra, reintenta sin las primeras palabras del nombre
  // (Georef guarda algunos nombres recortados, p. ej. "OSPO TREJO Y SANABRIA") y, al final, OpenStreetMap
  const out = [];
  const lejos = function (lat, lon) { return Math.hypot((lat - city.c[0]) * 111, (lon - city.c[1]) * 94) > 25; };
  async function georef(txt, sinLoc) {
    try {
      const zona = local ? (sinLoc ? '' : '&localidad_censal=' + encodeURIComponent(city.georefLoc || city.nombre)) : '&departamento=Capital';
      const u = 'https://apis.datos.gob.ar/georef/api/direcciones?direccion=' + encodeURIComponent(txt) + '&provincia=' + encodeURIComponent(provInfo(provDe(city)).georef) + zona + '&max=6';
      const j = await (await fetch(u)).json();
      (j.direcciones || []).forEach(function (d) { if (d.ubicacion && d.ubicacion.lat != null && !(local && lejos(d.ubicacion.lat, d.ubicacion.lon))) out.push({ label: d.nomenclatura, lat: d.ubicacion.lat, lon: d.ubicacion.lon, addr: true }); });
    } catch (e) { }
  }
  await georef(q);
  // Georef nombra algunas localidades distinto: sin filtro de localidad, quedándose con lo que cae cerca
  if (!out.length && local) await georef(q, true);
  const mNum = q.match(/^(.*?)[\s,]+(\d{1,5})\s*$/);
  if (!out.length && mNum) {
    const words = mNum[1].replace(/^(av(enida)?|bv|bulevar|calle|pje|pasaje)\.?\s+/i, '').split(/\s+/).filter(Boolean);
    for (let k = 1; k < words.length && !out.length; k++) await georef(words.slice(k).join(' ') + ' ' + mNum[2]);
  }
  if (!out.length) {
    try {
      const vb = local ? [city.c[1] - 0.15, city.c[0] + 0.12, city.c[1] + 0.15, city.c[0] - 0.12].map(function (x) { return x.toFixed(4); }).join(',') : '-64.36,-31.28,-64.04,-31.56';
      const u = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&countrycodes=ar&viewbox=' + vb + '&bounded=1&q=' + encodeURIComponent(q);
      const j = await (await fetch(u)).json();
      j.forEach(function (d) {
        const house = d.type === 'house' || d.addresstype === 'building' || d.category === 'building';
        out.push({ label: d.display_name.split(', Pedanía')[0] + (mNum && !house ? ' · sin altura' : ''), lat: parseFloat(d.lat), lon: parseFloat(d.lon), approx: !!mNum && !house });
      });
    } catch (e) { }
  }
  if (!out.length) return { error: local ? 'No encontré "' + q + '" en ' + city.nombre + '. Probá con calle y altura, ' + (enCba ? 'la nomenclatura provincial de 16 dígitos, la cuenta' : 'la matrícula catastral') + ' o tocá el lote en el mapa.' : 'No encontré "' + q + '". Probá con calle y altura (ej. "Obispo Trejo 300"), nomenclatura (04-02-065-002) o cuenta.' };
  if (out.length === 1) return { go: out[0] };
  return { list: out };
}

// Georef ubica la altura sobre el eje de la calle: se toma la parcela más cercana a ese punto
async function snapParcela(lat, lon, city) {
  try {
    const F = fuenteCat(city);
    const ext = provDe(city) !== 'cordoba';
    const dwq = 'DWITHIN(geom,SRID=4326;POINT(' + lon + ' ' + lat + '),35,meters)';
    let fs = await wfs(F.par, dwq, { base: F.base, props: ext ? null : 'Nomenclatura,geom', count: 30, timeout: 12000 });
    const mcp = esLocal(city) ? muniCiudad(city) : null;
    if (!fs.length && mcp && mcp.parcelas) fs = await wfs(mcp.parcelas.l, dwq, { count: 30, timeout: 12000 }).catch(function () { return []; });
    if (!fs.length) return null;
    const P = E.makeProj(lon, lat);
    let best = null, bd = Infinity;
    fs.forEach(function (f) {
      const r = E.outerRing(f.geometry); if (!r) return;
      const R = r.map(P.f);
      let d = E.inside([0, 0], R) ? 0 : Infinity;
      for (let i = 0; i < R.length && d > 0; i++) {
        const a = R[i], b = R[(i + 1) % R.length], vx = b[0] - a[0], vy = b[1] - a[1];
        const t = Math.max(0, Math.min(1, -(a[0] * vx + a[1] * vy) / (vx * vx + vy * vy || 1)));
        d = Math.min(d, Math.hypot(a[0] + t * vx, a[1] + t * vy));
      }
      if (d < bd) { bd = d; best = f; }
    });
    if (!best) return null;
    const ip = interiorPoint(best.geometry);
    return ip ? { lat: ip[1], lon: ip[0] } : null;
  } catch (e) { return null; }
}

/* ═══════ Ordenanzas (índice general) ═══════ */
function MarcoNormativo({ dg, idx, onMapa }) {
  if (!dg) return <div className="ld"><div className="sp" /><span>Cargando el índice del Digesto…</span></div>;
  const byKey = new Map();
  (idx || []).forEach(function (o) { byKey.set(E.ordKey(o), o); });
  return <Fragment>
    <h2 className="lbl" style={{ margin: '4px 0 8px', fontSize: 12 }}>Marco normativo de ocupación del suelo</h2>
    <p className="small muted" style={{ marginBottom: 10, maxWidth: 860 }}>Las normas del índice municipal "Ordenanzas Ocupación del Suelo" (V8) más todas las modificatorias y reglamentaciones de la Ord. 8256 que registra el Digesto. La columna "En las capas" dice si la capa oficial de zonificación ya cita esa norma en algún polígono.</p>
    {dg.marco.map(function (g) {
      return <div key={g.g} style={{ marginBottom: 14 }}>
        <div className="small" style={{ fontWeight: 700, margin: '8px 0 6px' }}>{g.g}</div>
        <div className="tw" style={{ background: 'var(--el)' }}><table className="t wrap" style={{ minWidth: 760 }}>
          <thead><tr><th>Norma</th><th style={{ textAlign: 'left' }}>Qué establece</th><th>Estado</th><th>En las capas</th><th>Texto</th></tr></thead>
          <tbody>{g.items.map(function (it) {
            const d = digDoc(dg, it.k);
            const ta = it.ta ? digDoc(dg, it.ta) : null;
            const tipo = it.k.indexOf('Dec.') === 0 ? 'Dec.' : 'Ord.';
            const num = it.k.replace(/^(Ord|Dec)\.\s*/, '').split('/')[0];
            const inIdx = byKey.get(tipo + ' ' + num);
            const est = it.est;
            const estCls = /Derogada/.test(est) ? 'tag-err' : (/veto/i.test(est) ? 'tag-warn' : 'tag-grey');
            return <tr key={it.k}>
              <td style={{ whiteSpace: 'nowrap' }}><b>{tipo} {num}{d ? '/' + String(d.anio).slice(-2) : ''}</b>{d && d.fecha ? <div className="small muted">{d.fecha}</div> : null}</td>
              <td style={{ textAlign: 'left', fontFamily: 'var(--ff)' }}>{it.q}</td>
              <td><span className={'tag ' + estCls}>{est}</span></td>
              <td style={{ fontFamily: 'var(--ff)' }}>{inIdx ? <span>Sí · {inIdx.n} ref.{inIdx.layer && inIdx.cql ? <Fragment>{' '}<button className="btn" style={{ marginLeft: 4 }} onClick={function () { onMapa({ layer: inIdx.layer, cql: inIdx.cql, label: tipo + ' ' + num }); }}>Mapa</button></Fragment> : null}</span> : <span className="muted">No</span>}</td>
              <td style={{ whiteSpace: 'nowrap' }}><DocLinks d={d} num={num} />{ta && <Fragment>{' '}<a className="btn" href={ta.pdf || ta.href} target="_blank" rel="noopener">Texto actualizado ↗</a></Fragment>}</td>
            </tr>;
          })}</tbody>
        </table></div>
      </div>;
    })}
  </Fragment>;
}

function OrdIndex({ onMapa }) {
  const dg = React.useContext(DigCtx);
  const [st, setSt] = useState({ loading: true });
  const [q, setQ] = useState('');
  const [tipo, setTipo] = useState('todas');
  useEffect(function () {
    let off = false;
    (async function () {
      try {
        const [z, la, lu, cmz, uso, fr, cat] = await Promise.all([
          wfs('CBA_Ordenanza_8256', null, { props: 'ord_y_perfil,ord_original,ord_modificatoria,perfil_o_zona,zona,observacion,otras_disposiciones,otros_retiros,retiro_frente,cantidad_unidades,art_ord', timeout: 60000 }),
          wfs('loteos_muni_aprobados', null, { props: PLOTEO, timeout: 60000 }),
          wfs('loteos_muni_autorizados', null, { timeout: 60000 }).catch(function () { return []; }),
          wfs('CBA_Centro_de_Manzana_8256', null, { props: 'ordenanza', timeout: 60000 }).catch(function () { return []; }),
          wfs('CBA_Ordenanza_8133', null, { props: 'patron,antecedentes,observaciones', timeout: 60000 }).catch(function () { return []; }),
          wfs('CBA_Ordenanza_8060_Modificaciones', null, { props: 'zonificacion,antecedentes,observaciones,excepciones', timeout: 60000 }).catch(function () { return []; }),
          wfs('cba_inmuebles_catalogados', null, { props: 'identifica,dmunicipal', timeout: 60000 }).catch(function () { return []; })
        ]);
        if (off) return;
        const idx = new Map();
        const add = function (o, ctx) {
          const k = E.ordKey(o);
          if (!idx.has(k)) idx.set(k, { tipo: o.tipo, num: o.num, anio: o.anio, capas: new Set(), roles: new Set(), zonas: new Set(), n: 0, convenio: false, link: null, layer: null, cql: null });
          const it = idx.get(k);
          if (o.anio && !it.anio) it.anio = o.anio;
          it.n++; it.capas.add(ctx.capa); if (ctx.rol) it.roles.add(ctx.rol); if (ctx.zona) it.zonas.add(ctx.zona);
          if (ctx.convenio) it.convenio = true;
          if (ctx.link && !it.link) it.link = ctx.link;
          if (!it.layer && ctx.layer) { it.layer = ctx.layer; it.cql = ctx.cql; }
        };
        const scan = function (t, ctx) { E.extractOrds(t).forEach(function (o) { add(o, Object.assign({}, ctx, ctx.cqlFn ? { cql: ctx.cqlFn(o) } : {})); }); };
        const cql8256 = function (o) { return "ord_modificatoria LIKE '%" + o.num + "%' OR ord_original LIKE '%" + o.num + "%' OR observacion LIKE '%" + o.num + "%' OR otras_disposiciones LIKE '%" + o.num + "%'"; };
        z.forEach(function (f) {
          const p = f.properties, N = E.parseNorma(p);
          const base = { capa: 'Ocupación del suelo', zona: N.convenio ? null : N.etiqueta, layer: 'CBA_Ordenanza_8256', cqlFn: cql8256 };
          scan(p.ord_original, Object.assign({ rol: 'Norma base' }, base));
          scan(p.ord_modificatoria, Object.assign({ rol: N.convenio ? 'Convenio urbanístico' : 'Modificatoria', convenio: N.convenio }, base));
          [p.observacion, p.otras_disposiciones, p.otros_retiros, p.retiro_frente, p.cantidad_unidades, p.art_ord].forEach(function (t) { scan(t, Object.assign({ rol: 'Citada en la norma de zona' }, base)); });
        });
        const loteos = [];
        la.concat(lu).forEach(function (f, i) {
          const p = f.properties;
          const tipoL = i < la.length ? 'Aprobado' : 'Autorizado a la venta';
          const ords = [];
          scan(p.decresapro || p.decreto || '', { capa: 'Loteos', rol: 'Aprobación de loteo', layer: i < la.length ? 'loteos_muni_aprobados' : 'loteos_muni_autorizados', cqlFn: function (o) { return "decresapro LIKE '%" + o.num + "%'"; } });
          Object.keys(LOTEO_ORDS).forEach(function (k) {
            const v = S_(p[k]);
            if (v) { ords.push({ num: LOTEO_ORDS[k], link: /^https?:/.test(v) ? v : null }); add({ tipo: 'Ord.', num: LOTEO_ORDS[k], anio: '' }, { capa: 'Loteos', rol: 'Encuadre de loteos', link: /^https?:/.test(v) ? v : null, layer: 'loteos_muni_aprobados', cql: k + ' IS NOT NULL' }); }
          });
          loteos.push({ tipo: tipoL, nombre: S_(p.nombre) || S_(p.nombfant) || S_(p.nombre_loteo) || '—', tl: S_(p.tipoloteo), lotes: S_(p.cantlotes), viv: S_(p.cantviv), dec: S_(p.decresapro) || S_(p.decreto), exp: S_(p.expediente_1) || S_(p.expediente), ords: ords, id: p.id, layer: i < la.length ? 'loteos_muni_aprobados' : 'loteos_muni_autorizados' });
        });
        cmz.forEach(function (f) { scan(f.properties.ordenanza, { capa: 'Centros de manzana', rol: 'Centro de manzana' }); });
        uso.forEach(function (f) { ['antecedentes', 'observaciones'].forEach(function (k) { scan(f.properties[k], { capa: 'Uso del suelo', rol: 'Uso del suelo' }); }); });
        fr.forEach(function (f) { ['antecedentes', 'observaciones', 'excepciones'].forEach(function (k) { scan(f.properties[k], { capa: 'Fraccionamiento', rol: 'Fraccionamiento' }); }); });
        cat.forEach(function (f) { scan(f.properties.dmunicipal, { capa: 'Patrimonio', rol: 'Declaración patrimonial' }); });
        ['8256', '8057', '8133', '8060', '13131', '9089'].forEach(function (n) { if (!idx.has('Ord. ' + n)) add({ tipo: 'Ord.', num: n, anio: '' }, { capa: 'Capa propia', rol: 'Norma con capa propia en IDECOR' }); });
        const list = Array.from(idx.values());
        setSt({ loading: false, list: list, loteos: loteos, nZ: z.length });
      } catch (e) { if (!off) setSt({ loading: false, error: String(e.message || e) }); }
    })();
    return function () { off = true; };
  }, []);
  if (st.loading) return <Fragment><MarcoNormativo dg={dg} idx={null} onMapa={onMapa} /><div className="ld"><div className="sp" /><span>Leyendo las capas de normativa de toda la ciudad…</span></div></Fragment>;
  if (st.error) return <Fragment><MarcoNormativo dg={dg} idx={null} onMapa={onMapa} /><div className="alert err">No pude leer las capas de IDECOR ({st.error}). Probá de nuevo en unos minutos.</div></Fragment>;
  const qq = q.trim().toLowerCase();

/* ── Editar o eliminar un lote desde la tabla de la cartera ── */
function EditLoteModal({ lote, modo, onClose, onSaved, admin }) {
  const [f, setF] = useState(function () { return formDesdeLote(lote); });
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [borrar, setBorrar] = useState(modo === 'eliminar');
  const [tc, setTc] = useState(null);
  useEffect(function () { tipoCambioMEP().then(setTc); }, []);
  useEffect(function () { const h = function (e) { if (e.key === 'Escape') onClose(); }; document.addEventListener('keydown', h); return function () { document.removeEventListener('keydown', h); }; }, []);
  const guardar = async function (e) {
    e.preventDefault(); setBusy(true); setErr('');
    try { await guardarCambiosLote(lote, f); await onSaved('Cambios guardados en ' + (f.nombre || 'el lote')); }
    catch (x) { setErr(faltaTabla(x)); setBusy(false); }
  };
  const eliminar = async function () {
    setBusy(true); setErr('');
    try { await borrarLote(lote); await onSaved('"' + (lote.nombre || 'Lote') + '" eliminado de la cartera'); }
    catch (x) { setErr(faltaTabla(x)); setBusy(false); }
  };
  return <div className="modal-bg" onClick={function (e) { if (e.target === e.currentTarget) onClose(); }}>
    <form className="modal" style={{ maxWidth: 560 }} onSubmit={guardar}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 10, marginBottom: 12 }}>
        <div><h2 style={{ fontSize: 16 }}>{borrar ? 'Eliminar lote' : 'Editar lote'}</h2>
          <div className="small muted">{lote.nom_muni || ''}{lote.zona ? ' · ' + lote.zona : ''}</div></div>
        <button type="button" className="btn-i" onClick={onClose} aria-label="Cerrar">✕</button>
      </div>
      {!borrar && <Fragment>
        <CamposLote f={f} setF={setF} tc={tc} />
        {err && <div className="alert err">{err}</div>}
        <div style={{ display: 'flex', gap: 8, justifyContent: 'space-between', marginTop: 14, flexWrap: 'wrap' }}>
          <button type="button" className="btn" style={{ color: 'var(--err)' }} onClick={function () { setBorrar(true); }}>Eliminar…</button>
          <span style={{ display: 'flex', gap: 8 }}>
            <button type="button" className="btn" onClick={onClose}>Cancelar</button>
            <button type="submit" className="btn pri" disabled={busy}>{busy ? 'Guardando…' : 'Guardar'}</button>
          </span>
        </div>
      </Fragment>}
      {borrar && <Fragment>
        <p>Vas a eliminar <b>{lote.nombre || 'este lote'}</b> de la cartera. Se borran también sus notas y escenarios, y no se puede deshacer.</p>
        {err && <div className="alert err">{err}</div>}
        <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end', marginTop: 14 }}>
          <button type="button" className="btn" onClick={function () { modo === 'eliminar' ? onClose() : setBorrar(false); }}>Cancelar</button>
          <button type="button" className="btn" disabled={busy} onClick={eliminar} style={{ background: 'var(--err)', borderColor: 'var(--err)', color: '#fff' }}>{busy ? 'Eliminando…' : 'Sí, eliminar'}</button>
        </div>
      </Fragment>}
    </form>
  </div>;
}

/* ── Negocio: costo total, unidades de venta y margen ──
   Todo en dólares. Se guarda dentro de lotes.analisis.negocio (se conserva al actualizar el análisis). */
function calcNegocio(n, cabida) {
  const m2c = n.m2Construir != null && n.m2Construir > 0 ? n.m2Construir : (cabida || 0);
  const terreno = n.terreno || 0;
  const construccion = (n.costoM2 || 0) * m2c;
  const indirectos = construccion * (n.indirectosPct || 0) / 100;
  const us = n.unidades || [];
  const ventas = us.reduce(function (s, u) { return s + (u.precio || 0); }, 0);
  const m2v = us.reduce(function (s, u) { return s + (u.m2 || 0); }, 0);
  const cp = (n.comercialPct || 0) / 100;
  const comercial = ventas * cp;
  const costo = terreno + construccion + indirectos + comercial;
  const margen = ventas - costo;
  return {
    m2c: m2c, terreno: terreno, construccion: construccion, indirectos: indirectos, comercial: comercial, costo: costo, ventas: ventas, m2v: m2v, margen: margen,
    margenVentas: ventas > 0 ? margen / ventas : null,
    margenCosto: costo > 0 ? margen / costo : null,
    incTerreno: ventas > 0 ? terreno / ventas : null,
    // precio de venta por m² vendible que deja margen cero (la comercialización se cobra sobre la venta)
    equilibrioM2: m2v > 0 && cp < 1 ? (terreno + construccion + indirectos) / (1 - cp) / m2v : null,
    costoM2Total: m2c > 0 ? costo / m2c : null
  };
}
const usdC = function (x) { return x == null || !isFinite(x) ? '—' : Math.abs(x) >= 1e6 ? 'US$ ' + (x / 1e6).toLocaleString('es-AR', { maximumFractionDigits: 2 }) + ' M' : usd(x); };
const pct = function (x, d) { return x == null || !isFinite(x) ? '—' : (x * 100).toLocaleString('es-AR', { maximumFractionDigits: d == null ? 1 : d }) + '%'; };
const strN = function (x) { return x == null || x === '' || !isFinite(x) ? '' : String(Math.round(x * 100) / 100).replace('.', ','); };
let _uid = 0;
const nuevoId = function () { _uid++; return Date.now().toString(36) + _uid; };

function NegocioPanel({ lote, cabida, unidadesSug, onGuardar }) {
  const ef = Number(lote.eficiencia) || 0.8;
  const inicial = function () {
    const g = lote.analisis && lote.analisis.negocio;
    if (g) return {
      terreno: strN(g.terreno), costoM2: strN(g.costoM2), m2Construir: strN(g.m2Construir), indirectosPct: strN(g.indirectosPct), comercialPct: strN(g.comercialPct),
      cantidad: String((g.unidades || []).length || ''), precioM2: strN(g.precioM2),
      unidades: (g.unidades || []).map(function (u) { return { id: u.id || nuevoId(), nombre: u.nombre || '', m2: strN(u.m2), pm2: strN(u.pm2), precio: strN(u.precio) }; })
    };
    const pu = precioUSD(lote);
    const vend = (cabida || 0) * ef;
    const cant = unidadesSug && unidadesSug > 0 ? unidadesSug : Math.max(1, Math.round(vend / 65));
    return { terreno: strN(pu != null ? Math.round(pu) : null), costoM2: '', m2Construir: '', indirectosPct: '', comercialPct: '', cantidad: String(cant), precioM2: '', unidades: [] };
  };
  const [f, setF] = useState(inicial);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState('');
  useEffect(function () { setF(inicial()); }, [lote.id]);
  // Si todavía no hay negocio guardado, el valor del terreno sigue al precio pedido cuando se carga después
  useEffect(function () {
    if (lote.analisis && lote.analisis.negocio) return;
    const pu = precioUSD(lote);
    if (pu != null) setF(function (o) { return o.terreno === '' ? Object.assign({}, o, { terreno: strN(Math.round(pu)) }) : o; });
  }, [lote.precio, lote.moneda, lote.tipo_cambio]);
  const setK = function (k) { return function (e) { const v = e.target.value; setF(function (o) { const n = Object.assign({}, o); n[k] = v; return n; }); }; };
  const n = {
    terreno: numAR(f.terreno), costoM2: numAR(f.costoM2), m2Construir: numAR(f.m2Construir), indirectosPct: numAR(f.indirectosPct), comercialPct: numAR(f.comercialPct), precioM2: numAR(f.precioM2),
    unidades: f.unidades.map(function (u) { return { id: u.id, nombre: u.nombre.trim(), m2: numAR(u.m2), pm2: numAR(u.pm2), precio: numAR(u.precio) }; })
  };
  const c = calcNegocio(n, cabida);
  const vendEst = (n.m2Construir && n.m2Construir > 0 ? n.m2Construir : (cabida || 0)) * ef;

  const repartir = function () {
    const cant = Math.max(1, Math.min(300, parseInt(f.cantidad, 10) || 1));
    const m2 = vendEst / cant, pm2 = numAR(f.precioM2);
    setF(function (o) {
      return Object.assign({}, o, { cantidad: String(cant), unidades: Array.from({ length: cant }, function (_, i) { return { id: nuevoId(), nombre: 'Unidad ' + (i + 1), m2: strN(m2), pm2: strN(pm2), precio: pm2 != null ? strN(Math.round(m2 * pm2)) : '' }; }) });
    });
  };
  const setU = function (id, k, v) {
    setF(function (o) {
      return Object.assign({}, o, {
        unidades: o.unidades.map(function (u) {
          if (u.id !== id) return u;
          const x = Object.assign({}, u); x[k] = v;
          const m2 = numAR(x.m2), pm2 = numAR(x.pm2), pr = numAR(x.precio);
          if ((k === 'm2' || k === 'pm2') && m2 != null && pm2 != null) x.precio = strN(Math.round(m2 * pm2));
          if (k === 'precio' && pr != null && m2 > 0) x.pm2 = strN(Math.round(pr / m2));
          return x;
        })
      });
    });
  };
  const agregarU = function (tipo) {
    setF(function (o) { return Object.assign({}, o, { unidades: o.unidades.concat([tipo === 'cochera' ? { id: nuevoId(), nombre: 'Cochera', m2: '0', pm2: '', precio: '' } : { id: nuevoId(), nombre: 'Unidad ' + (o.unidades.length + 1), m2: '', pm2: o.precioM2, precio: '' }]) }); });
  };
  const quitarU = function (id) { setF(function (o) { return Object.assign({}, o, { unidades: o.unidades.filter(function (u) { return u.id !== id; }) }); }); };
  const guardar = async function () {
    setBusy(true); setMsg('');
    try {
      const g = Object.assign({}, n, { v: 1, fecha: new Date().toISOString(), cabida: cabida || null, resultado: { costo: Math.round(c.costo), ventas: Math.round(c.ventas), margen: Math.round(c.margen), margenVentas: c.margenVentas, margenCosto: c.margenCosto, m2c: c.m2c, m2v: c.m2v, equilibrioM2: c.equilibrioM2 } });
      await onGuardar(g, c);
      setMsg('Negocio guardado');
      setTimeout(function () { setMsg(''); }, 2500);
    } catch (e) { setMsg(faltaTabla(e)); }
    setBusy(false);
  };
  const fld = function (k, label, unit, ph) {
    return <label className="fld"><span>{label}</span><span className="row"><input inputMode="decimal" value={f[k]} onChange={setK(k)} placeholder={ph || ''} /><span className="u">{unit}</span></span></label>;
  };
  const tone = c.margen > 0 ? 'var(--ok)' : c.margen < 0 ? 'var(--err)' : 'var(--c1)';

  return <div className="negocio">
    <h3 className="lbl" style={{ marginTop: 18 }}>Negocio</h3>
    <p className="small muted" style={{ margin: '2px 0 8px' }}>Costo total del proyecto, unidades de venta y margen. Todo en dólares; la cabida es la de la calculadora ({nf(cabida)} m²).</p>
    <div className="inputs" style={{ gridTemplateColumns: 'repeat(auto-fit,minmax(150px,1fr))' }}>
      {fld('terreno', 'Valor del terreno', 'US$', 'precio pedido')}
      {fld('costoM2', 'Costo de construcción', 'US$/m²', 'ej. 900')}
      {fld('m2Construir', 'M² a construir', 'm²', nf(cabida) + ' (cabida)')}
      {fld('indirectosPct', 'Indirectos', '% constr.', 'honorarios, permisos')}
      {fld('comercialPct', 'Comercialización', '% ventas', 'ej. 3')}
    </div>

    <div style={{ display: 'flex', gap: 8, alignItems: 'flex-end', flexWrap: 'wrap', marginTop: 12 }}>
      <label className="fld" style={{ width: 120 }}><span>Unidades</span><span className="row"><input inputMode="numeric" value={f.cantidad} onChange={setK('cantidad')} /></span></label>
      <label className="fld" style={{ width: 170 }}><span>Precio de venta</span><span className="row"><input inputMode="decimal" value={f.precioM2} onChange={setK('precioM2')} placeholder="ej. 2200" /><span className="u">US$/m²</span></span></label>
      <button className="btn" onClick={repartir} title={'Divide ' + nf(vendEst) + ' m² vendibles en partes iguales'}>Repartir en partes iguales</button>
      <button className="btn" onClick={function () { agregarU(); }}>+ Unidad</button>
      <button className="btn" onClick={function () { agregarU('cochera'); }}>+ Cochera</button>
    </div>
    <p className="small muted" style={{ marginTop: 4 }}>Vendible estimado: {nf(vendEst)} m² ({Math.round(ef * 100)}% de lo construido, ajustable en "Superficie vendible"). Después de repartir podés editar cada unidad: nombre, m², precio por m² o precio total.</p>

    {f.unidades.length > 0 && <div className="tw"><table className="t neg">
      <thead><tr><th style={{ textAlign: 'left' }}>Unidad</th><th>m²</th><th>US$/m²</th><th>Precio US$</th><th></th></tr></thead>
      <tbody>{f.unidades.map(function (u) {
        return <tr key={u.id}>
          <td style={{ textAlign: 'left' }}><input className="cell" style={{ textAlign: 'left', fontFamily: 'var(--ff)', minWidth: 110 }} value={u.nombre} onChange={function (e) { setU(u.id, 'nombre', e.target.value); }} maxLength={60} /></td>
          <td><input className="cell" inputMode="decimal" value={u.m2} onChange={function (e) { setU(u.id, 'm2', e.target.value); }} /></td>
          <td><input className="cell" inputMode="decimal" value={u.pm2} onChange={function (e) { setU(u.id, 'pm2', e.target.value); }} /></td>
          <td><input className="cell" inputMode="decimal" value={u.precio} onChange={function (e) { setU(u.id, 'precio', e.target.value); }} /></td>
          <td style={{ minWidth: 0 }}><button className="btn-i" title="Quitar" aria-label="Quitar unidad" onClick={function () { quitarU(u.id); }}>✕</button></td>
        </tr>;
      })}</tbody>
      <tfoot><tr><td>{f.unidades.length} unidades</td><td>{nf(c.m2v, 1)}</td><td>{c.m2v > 0 ? nf(c.ventas / c.m2v) : '—'}</td><td>{nf(c.ventas)}</td><td style={{ minWidth: 0 }}></td></tr></tfoot>
    </table></div>}
    {f.unidades.length > 0 && c.m2v > 0 && Math.abs(c.m2v - vendEst) / vendEst > 0.05 && <div className="alert info">Las unidades suman {nf(c.m2v)} m² y lo vendible estimado es {nf(vendEst)} m². Revisá si falta o sobra superficie.</div>}

    <div className="metrics" style={{ marginTop: 12 }}>
      <div className="metric"><div className="lbl">Costo total</div><div className="v" title={usd(c.costo)}>{usdC(c.costo)}</div><div className="d">{c.costoM2Total ? usd(c.costoM2Total) + ' por m² construido' : 'cargá el costo por m²'}</div></div>
      <div className="metric"><div className="lbl">Ventas</div><div className="v" title={usd(c.ventas)}>{usdC(c.ventas)}</div><div className="d">{c.m2v > 0 ? nf(c.m2v) + ' m² vendibles' : 'cargá las unidades'}</div></div>
      <div className="metric"><div className="lbl">Margen</div><div className="v" style={{ color: tone }} title={usd(c.margen)}>{usdC(c.margen)}</div><div className="d">{pct(c.margenVentas)} sobre ventas · {pct(c.margenCosto)} sobre costo</div></div>
      <div className="metric"><div className="lbl">Equilibrio</div><div className="v">{c.equilibrioM2 ? usd(c.equilibrioM2) : '—'}</div><div className="d">precio por m² con margen cero</div></div>
    </div>
    <div className="tw"><table className="t">
      <tbody>
        <tr><td>Terreno</td><td>{usd(c.terreno)}</td><td>{pct(c.costo > 0 ? c.terreno / c.costo : null)} del costo · {pct(c.incTerreno)} de las ventas</td></tr>
        <tr><td>Construcción</td><td>{usd(c.construccion)}</td><td>{nf(c.m2c)} m² × {usd(n.costoM2)}</td></tr>
        <tr><td>Indirectos</td><td>{usd(c.indirectos)}</td><td>{n.indirectosPct ? nf(n.indirectosPct, 1) + '% de la construcción' : 'sin cargar'}</td></tr>
        <tr><td>Comercialización</td><td>{usd(c.comercial)}</td><td>{n.comercialPct ? nf(n.comercialPct, 1) + '% de las ventas' : 'sin cargar'}</td></tr>
      </tbody>
      <tfoot><tr><td>Costo total</td><td>{usd(c.costo)}</td><td>Margen {usd(c.margen)} ({pct(c.margenVentas)})</td></tr></tfoot>
    </table></div>
    {!n.indirectosPct && !n.comercialPct && c.ventas > 0 && <p className="small muted" style={{ marginTop: 6 }}>Sin indirectos ni comercialización el margen queda inflado: honorarios, permisos, impuestos y venta suelen sumar bastante sobre la obra.</p>}
    <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginTop: 10 }}>
      <button className="btn pri" onClick={guardar} disabled={busy}>{busy ? 'Guardando…' : 'Guardar negocio'}</button>
      {msg && <span className="small" style={{ color: /guardado/.test(msg) ? 'var(--ok)' : 'var(--err)', fontWeight: 700 }}>{msg}</span>}
    </div>
  </div>;
}

/* ── Tarjeta de cartera dentro de la ficha del lote ── */
function CarteraCard({ M, sess, lote, onLogin, onChange, onApply, cartErr, q, marcarAplicado }) {
  const [notas, setNotas] = useState(null);
  const [nota, setNota] = useState('');
  const [busy, setBusy] = useState('');
  const [err, setErr] = useState('');
  const [f, setF] = useState(null);
  const [escNom, setEscNom] = useState('');
  const [borrar, setBorrar] = useState(false);
  const [tc, setTc] = useState(null);
  useEffect(function () { tipoCambioMEP().then(setTc); }, []);
  useEffect(function () {
    setErr(''); setBorrar(false);
    if (lote) {
      setF(formDesdeLote(lote));
      setNotas(null);
      sbReq('lote_notas?lote_id=eq.' + lote.id + '&select=*&order=created_at.desc').then(setNotas).catch(function (e) { setErr(faltaTabla(e)); setNotas([]); });
    } else setF(null);
  }, [lote && lote.id, lote && lote.updated_at]);

  if (!sess) return <Card title="Cartera de lotes" src="Supabase · cartera del equipo">
    <p>Guardá este análisis en la cartera del equipo para seguirlo con notas, estado, precio y escenarios desde cualquier dispositivo.</p>
    <button className="btn pri" style={{ marginTop: 10 }} onClick={onLogin}>Ingresar</button>
  </Card>;
  if (cartErr) return <Card title="Cartera de lotes" src="Supabase · cartera del equipo"><div className="alert err">{cartErr}</div></Card>;

  const r = M.cabida, N = M.cabidaN, S = M.det.S;
  const cabida = r && !r.error ? r.total : (lote && lote.cabida_m2) || null;
  const vut = M.D.vt[0] ? E.num(M.D.vt[0].properties.vut_pesos) : null;

  const nuevaNota = async function (lt, texto, tipo) {

        <button className="btn pri" onClick={agregarNota} disabled={busy === 'nota' || !nota.trim()}>Agregar</button>
      </div>
      {notas === null ? <div className="ld"><div className="sp" /><span>Cargando notas…</span></div>
        : notas.length === 0 ? <p className="small muted" style={{ marginTop: 8 }}>Sin notas todavía.</p>
          : <ul className="notas">{notas.map(function (n) {
            return <li key={n.id} className={'n-' + n.tipo}>
              <div className="small muted">{fechaHora(n.created_at)} · {n.autor_email || '—'}{n.tipo !== 'nota' ? ' · ' + (n.tipo === 'estado' ? 'cambio de estado' : n.tipo === 'precio' ? 'cambio de precio' : 'sistema') : ''}

              <div style={{ whiteSpace: 'pre-wrap' }}>{n.texto}</div>

          })}</ul>}
    </div>
  </section>;
}

/* ── Mapa de la cartera ── */
function CarteraMap({ rows, onOpen }) {
  const el = useRef(null), mapRef = useRef(null), grp = useRef(null), openRef = useRef(onOpen);
  openRef.current = onOpen;
  useEffect(function () {
    const map = L.map(el.current, { zoomControl: true }).setView([-31.4167, -64.1833], 12);
    baseLayer('gris').addTo(map);
    grp.current = L.featureGroup().addTo(map);
    mapRef.current = map;
    setTimeout(function () { map.invalidateSize(); }, 60);
    return function () { map.remove(); };
  }, []);
  useEffect(function () {
    const g = grp.current, map = mapRef.current;
    if (!g || !map) return;
    g.clearLayers();
    rows.forEach(function (l) {
      const e = estadoInfo(l.estado);
      const m = L.circleMarker([l.lat, l.lon], { radius: 7, color: '#fff', weight: 2, fillColor: e[2], fillOpacity: 0.95 });
      const div = document.createElement('div');
      const b = document.createElement('b'); b.textContent = l.nombre || l.nom_muni || 'Lote'; div.appendChild(b);
      const s = document.createElement('div'); s.style.fontSize = '11px'; s.textContent = e[1] + (l.cabida_m2 != null ? ' · ' + nf(l.cabida_m2) + ' m²' : '') + (l.zona ? ' · ' + l.zona : ''); div.appendChild(s);
      const a = document.createElement('a'); a.href = '#'; a.textContent = 'Abrir ficha'; a.style.fontSize = '12px'; a.onclick = function (ev) { ev.preventDefault(); openRef.current(l); }; div.appendChild(a);
      m.bindPopup(div);
      m.addTo(g);
    });
    if (rows.length) map.fitBounds(g.getBounds(), { maxZoom: 16, padding: [30, 30] });
  }, [rows]);
  return <div style={{ height: 340, border: '1px solid var(--b1)', borderRadius: 3, overflow: 'hidden', marginBottom: 12 }}><div ref={el} style={{ height: '100%' }}></div></div>;
}

function cargarXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise(function (res, rej) {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload = function () { res(window.XLSX); }; s.onerror = function () { rej(new Error('No se pudo cargar el exportador de Excel.')); };
    document.head.appendChild(s);
  });
}

/* ═══════ Theme ═══════ */
function useTheme() {
  const [t, setT] = useState(function () { try { return localStorage.getItem('bk.theme') || (window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light'); } catch (e) { return 'light'; } });
  useEffect(function () { document.documentElement.setAttribute('data-theme', t); try { localStorage.setItem('bk.theme', t); } catch (e) { } }, [t]);
  return [t, useCallback(function () { setT(function (v) { return v === 'light' ? 'dark' : 'light'; }); }, [])];
}

        {overlay && <span className="tag tag-ac" style={{ cursor: 'pointer' }} onClick={function () { setOverlay(null); }} title="Quitar resaltado">{overlay.label} en el mapa ✕</span>}
        <span className="shint">o tocá el lote en el mapa</span>
        {opts && <div className="sres">{opts.map(function (o, i) { return <button key={i} type="button" onClick={function () { setOpts(null); goTo(o); }}>{o.label}</button>; })}</div>}
      </form>
      <div className="main">
        <MapView key={city.id + (muniCat ? ':m' : '')} city={city} onPick={pick} M={M} overlay={overlay} active={mapTab} focus={focus} draw={draw} drawPts={drawPts} onDrawPt={function (p) { setDrawPts(function (a) { return a.concat([p]); }); }} />
        <div className="panel">
          {draw && <div className="card no-print" style={{ marginBottom: 10 }}><div className="card-b">
            <b>Dibujando el lote</b>
            <p className="small" style={{ marginTop: 4 }}>Tocá en el mapa cada esquina del lote, en orden. Conviene usar la vista Satélite y acercarse bien. Vértices: {drawPts.length}.</p>
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginTop: 8 }}>
              <button className="btn pri" onClick={terminarDibujo} disabled={drawPts.length < 3}>Terminar</button>
              <button className="btn" onClick={function () { setDrawPts(function (a) { return a.slice(0, -1); }); }} disabled={!drawPts.length}>Deshacer</button>
              <button className="btn" onClick={cancelarDibujo}>Cancelar</button>
            </div>
          </div></div>}
          {err && <div className="alert" style={{ marginTop: 0, marginBottom: 10 }}>{err}{retry && !busy && <div style={{ marginTop: 8 }}><button className="btn pri" onClick={function () { pick(retry.lat, retry.lon, true); }}>Reintentar</button></div>}</div>}
          {busy && <div className="ld"><div className="sp" /><span>{local ? 'Consultando catastro y normativa de ' + (provDe(city) === 'salta' ? 'IDESA e IDEMSa' : 'IDECOR') + '…' : 'Consultando 23 capas de IDECOR para este punto…'}</span></div>}
          {!M && !busy && local && <div className="card"><div className="empty">
            <h2>{city.nombre}</h2>
            <p><span className={'niv niv-' + city.nivel}>Nivel {city.nivel} · {NIVELES[city.nivel][0]}</span></p>
            <p style={{ marginTop: 8 }}>{city.cpua ? 'Distrito automático desde la capa municipal e indicadores de la ficha del CPUA 2025, editables.' : NIVELES[city.nivel][1]}</p>
            <div className="steps">
              <div><b>1</b><span>Buscá la dirección, {provDe(city) === 'salta' ? 'la matrícula catastral o la nomenclatura de IDESA' : 'la nomenclatura provincial o la cuenta'}, o tocá el lote en el mapa.</span></div>
              <div><b>2</b><span>La ficha trae el lote del catastro provincial{city.cpua ? ' y el distrito del CPUA con sus indicadores' : city.nivel >= 2 ? ' y la zona con FOS, FOT y altura de la capa provincial' : ''}.</span></div>
              <div><b>3</b><span>{city.cpua ? 'Revisá las notas del distrito (PRAC en el Área Centro, sectores especiales) antes de usar la cifra.' : city.nivel >= 2 ? 'Revisá los parámetros contra la ordenanza (' + city.ord + ') y completá retiros y plantas.' : 'Cargá FOS, FOT, altura y retiros del código urbano local para calcular la cabida.'}</span></div>
            </div>
          </div></div>}
          {!M && !busy && !local && <div className="card"><div className="empty">
            <h2>Normativa y cabida por lote</h2>
            <p>Datos oficiales de la Municipalidad de Córdoba publicados en IDECOR, consultados en vivo.</p>
            <div className="steps">
              <div><b>1</b><span>Buscá la dirección, la nomenclatura o la cuenta, o tocá el lote en el mapa.</span></div>
              <div><b>2</b><span>La ficha junta ocupación, uso y fraccionamiento del suelo, centro de manzana, patrimonio, loteos, convenios y valores de referencia.</span></div>
              <div><b>3</b><span>La cabida se calcula con el FOS, FOT, alturas y retiros vigentes de la zona y la geometría real del lote. Podés ajustar cada dato.</span></div>
            </div>
            <p className="small muted" style={{ marginTop: 14 }}>Probá con <a href="#-31.413500,-64.188800" onClick={function (e) { e.preventDefault(); pick(-31.4135, -64.1888); }}>un lote en Nueva Córdoba</a>.</p>
          </div></div>}
          {M && !busy && <Fragment>
            <div className="print-only" style={{ marginBottom: 10 }}><b>Análisis de Cabida · {M.city.nombre}</b> · {new Date().toLocaleDateString('es-AR')}</div>
            <div className="no-print" style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 10, alignItems: 'center' }}>
              <button className="btn" onClick={copy}>Copiar resumen</button>
              <button className="btn" onClick={function () { window.print(); }}>Imprimir / PDF</button>
              {!M.local && <a className="btn" href={MAPA311} target="_blank" rel="noopener">Ver en MapasCórdoba ↗</a>}
              {toast && <span className="small" style={{ color: 'var(--ok)', fontWeight: 700 }}>{toast}</span>}
            </div>
            <RotuloLote M={M} res={res} onCabida={function () { setTab('cabida'); }} />
            {/* Las tres pestañas comparten el mapa; se ocultan con CSS para no perder lo editado en la cabida */}
            <div className="tabgrp" style={vis('lote')}>
              <LoteCard M={M} lote={loteActual} onDraw={empezarDibujo} />
              <div className="no-print"><CarteraCard M={M} sess={sess} lote={loteActual} cartErr={cartErr} q={q} onLogin={salir} onChange={loadCartera} onApply={aplicarEscenario} marcarAplicado={function () { aplicado.current = M.D.t; }} /></div>
            </div>
            <div className="tabgrp" style={vis('norma')}>
              {!M.local && <AvisosNorma M={M} />}
              {M.local ? <Fragment><NormaLocalCard M={M} />{M.city.cpua && <SaltaCapasCard M={M} />}<PlanosMuniCard M={M} /><OrdCiudadCard M={M} /></Fragment> : <Fragment>
                <NormaCard M={M} />
                <UsoCard M={M} />
                <FraccCard M={M} />
                <CMCard M={M} />
                <PatrimonioCard M={M} />
                <EntornoCard M={M} />
                <OrdLoteCard M={M} />
              </Fragment>}
            </div>
            <div className="tabgrp" style={vis('cabida')}>
              <CabidaCard M={M} normaSel={normaSel} setNormaSel={setNormaSel} preset={preset} onResult={setRes} />
            </div>
            {M.local ? <p className="small muted">Fuente: {fuenteTxt(M.city)}, consultados el {new Date(M.D.t).toLocaleString('es-AR')}. Herramienta de consulta: no reemplaza la visación ni el certificado de uso del suelo de {M.city.nombre}.</p> : <p className="small muted">Fuente: capas WFS de IDECOR (Infraestructura de Datos Espaciales de la Provincia de Córdoba) con información de la Dirección de Planeamiento Urbano municipal y Catastro provincial, consultadas el {new Date(M.D.t).toLocaleString('es-AR')}. Herramienta de consulta: no reemplaza la visación ni el certificado de uso del suelo.</p>}
          </Fragment>}
        </div>
      </div>
    </div>

    {tab === 'ord' && local && <div className="page"><div className="page-in">
      <h1 className="title-lote" style={{ fontSize: 20 }}>Normativa urbana de {city.cpua ? nombreCiudad(city) : provInfo(provDe(city)).nombre}</h1>
      <p className="sub" style={{ marginBottom: 14 }}>{city.cpua ? 'Código urbano, código de edificación y ordenanzas especiales que se usan en la ficha, con su enlace oficial y quién lo publica.' : 'Planos y ordenanzas de uso, ocupación y fraccionamiento del suelo, con enlace al texto oficial. ' + city.nombre + ' aparece primero.'}</p>
      {city.cpua ? <SaltaOrdenanzas /> : <DirectorioMuni prov={provDe(city)} actual={city} />}
    </div></div>}
    {tab === 'ord' && !local && <div className="page"><div className="page-in">
      <h1 className="title-lote" style={{ fontSize: 20 }}>Ordenanzas que impactan en la ciudad</h1>
      <p className="sub" style={{ marginBottom: 14 }}>Marco normativo vigente según el Digesto municipal, más el índice de todas las normas citadas en las capas oficiales: zonas, perfiles, modificatorias, convenios urbanísticos y loteos aprobados.</p>
      <OrdIndex onMapa={showOnMap} />
    </div></div>}

    {tab === 'cartera' && <div className="page"><div className="page-in">
      {toast && <div className="alert ok" style={{ marginTop: 0 }}>{toast}</div>}
      <CarteraTab sess={sess} cartera={carteraVis} cartErr={cartErr} onLogin={salir} onOpen={abrirDeCartera} onReload={loadCartera} locales={saved} onImportLocales={subirLocales} />
    </div></div>}
  </DigCtx.Provider>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
