<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Análisis de Cabida</title>
<meta name="description" content="Normativa urbana y cabida máxima por lote en Córdoba capital y Salta capital, con datos oficiales consultados en vivo."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Urbanist:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M6 3h20l3 3v20l-3 3H6l-3-3V6z' fill='%2328283D'/><path d='M6 3h10v13H3V6z' fill='%23FB7520'/></svg>"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<!-- Sesión única de las herramientas de Grupo ECIPSA (portal en https://mmmsa221.github.io/) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/sesion.js"></script>
<script>if (window.ECI) ECI.exigir('cabida');</script>
<style>
:root{--bg:#F6F6F6;--bg1:#f1f3f5;--bg2:#e9ecef;--el:#fff;--c0:#28283D;--c1:#575756;--c2:#6f6f7a;--b0:#e2e5ea;--b1:#eef0f3;--ac:#B54E0B;--ac2:#9E4309;--acbg:rgba(251,117,32,.10);--ok:#10b981;--err:#ef4444;--warn:#f59e0b;--okbg:rgba(16,185,129,.1);--warnbg:rgba(245,158,11,.12);--errbg:rgba(239,68,68,.1);--floor:rgba(251,117,32,.22);--floor2:rgba(251,117,32,.07);--sh:0 1px 2px rgba(0,0,0,.04);--shm:0 2px 8px rgba(0,0,0,.06);--ff:'Open Sans',Arial,-apple-system,sans-serif;--ft:Gilroy,'Open Sans',Arial,sans-serif;--fm:'JetBrains Mono',monospace}
@media(prefers-color-scheme:dark){:root{--ac:#FB7520;--ac2:#FF9A55;--bg:#1c1c2b;--bg1:#232336;--bg2:#2d2d45;--el:#28283D;--c0:#F6F6F6;--c1:#b9b9c6;--c2:#8d8da0;--b0:#3a3a55;--b1:#30304a;--acbg:rgba(251,117,32,.14);--floor:rgba(251,117,32,.26);--floor2:rgba(251,117,32,.08);--sh:0 1px 2px rgba(0,0,0,.2);--shm:0 2px 8px rgba(0,0,0,.3)}}
:root[data-theme="light"]{--ac:#B54E0B;--ac2:#9E4309;--bg:#F6F6F6;--bg1:#f1f3f5;--bg2:#e9ecef;--el:#fff;--c0:#28283D;--c1:#575756;--c2:#6f6f7a;--b0:#e2e5ea;--b1:#eef0f3;--acbg:rgba(251,117,32,.10);--floor:rgba(251,117,32,.22);--floor2:rgba(251,117,32,.07);--sh:0 1px 2px rgba(0,0,0,.04);--shm:0 2px 8px rgba(0,0,0,.06)}
:root[data-theme="dark"]{--ac:#FB7520;--ac2:#FF9A55;--bg:#1c1c2b;--bg1:#232336;--bg2:#2d2d45;--el:#28283D;--c0:#F6F6F6;--c1:#b9b9c6;--c2:#8d8da0;--b0:#3a3a55;--b1:#30304a;--acbg:rgba(251,117,32,.14);--floor:rgba(251,117,32,.26);--floor2:rgba(251,117,32,.08);--sh:0 1px 2px rgba(0,0,0,.2);--shm:0 2px 8px rgba(0,0,0,.3)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ff);background:var(--bg);color:var(--c0);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden}
#root{height:100vh;display:flex;flex-direction:column}
a{color:var(--ac)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--b0);border-radius:3px}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:1px}

.hdr{height:44px;background:var(--el);border-bottom:1px solid var(--b0);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;color:var(--c0)}
.hdr-title{font-size:14px;font-weight:700;color:var(--ac);white-space:nowrap}
.acts{margin-left:auto;display:flex;gap:4px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:6px 11px;font-size:12px;font-weight:600;font-family:var(--ff);border-radius:3px;border:1px solid var(--b0);background:var(--el);color:var(--c1);cursor:pointer;text-decoration:none;white-space:nowrap}.btn:hover{background:var(--bg1);color:var(--c0)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}.btn.pri:hover{background:var(--ac2);border-color:var(--ac2)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#28283D}}
:root[data-theme="dark"] .btn.pri{color:#28283D}
.btn:disabled{opacity:.5;cursor:default}
.btn-i{padding:5px;width:28px;height:28px;border:none;background:none;cursor:pointer;color:var(--c1);border-radius:3px;font-size:14px}.btn-i:hover{background:var(--bg1)}
.seg{display:inline-flex;background:var(--bg1);border-radius:3px;padding:2px;gap:1px}
.seg button{padding:4px 14px;font-size:12px;font-weight:700;font-family:var(--ff);border:none;background:transparent;color:var(--c1);cursor:pointer;border-radius:2px;text-transform:uppercase;letter-spacing:.5px}.seg button:hover{color:var(--c0)}.seg button.on{background:var(--el);color:var(--ac);box-shadow:var(--sh)}

.sbar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--bg1);border-bottom:1px solid var(--b1);flex-shrink:0;flex-wrap:wrap;position:relative}
.sin{flex:1;min-width:220px;max-width:560px;padding:7px 10px;font-size:13px;font-family:var(--ff);border:1px solid var(--b0);border-radius:3px;background:var(--el);color:var(--c0)}
.shint{font-size:11px;color:var(--c2)}
.sres{position:absolute;top:100%;left:16px;z-index:1200;background:var(--el);border:1px solid var(--b0);border-radius:3px;box-shadow:var(--shm);min-width:320px;max-width:560px}
.sres button{display:block;width:100%;text-align:left;padding:8px 12px;border:none;background:none;color:var(--c0);font-family:var(--ff);font-size:12.5px;cursor:pointer;border-bottom:1px solid var(--b1)}.sres button:hover{background:var(--acbg)}

.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(420px,600px)}
.mapwrap{position:relative;min-height:0;border-right:1px solid var(--b0)}
#map{position:absolute;inset:0;background:var(--bg2)}
.panel{overflow-y:auto;padding:14px 16px 40px;min-width:0}
.maphint{position:absolute;left:12px;bottom:22px;z-index:800;background:var(--el);border:1px solid var(--b0);border-radius:3px;padding:6px 10px;font-size:11.5px;color:var(--c1);box-shadow:var(--sh);pointer-events:none}
@media(max-width:900px){
  body{overflow:auto;height:auto}#root{height:auto;min-height:100vh}
  .main{display:block}
  .mapwrap{height:46vh;border-right:0;border-bottom:1px solid var(--b0)}
  .panel{overflow:visible;padding:12px}
  .hdr{padding:6px 16px;gap:8px;height:auto;min-height:44px;flex-wrap:wrap}.hdr-sep,.hdr-title{display:none}
  .panel{padding:16px}
  /* Las cinco pestañas pasan a su propia fila; si no entran se desplazan dentro de la barra, nunca la página */
  .hdr .seg{order:10;flex:1 1 100%;margin-left:0!important;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .hdr .seg::-webkit-scrollbar{display:none}
  .seg button{padding:8px 12px;font-size:12px;min-height:36px;flex:1 0 auto;white-space:nowrap}
  .hdr .acts{margin-left:auto}
}
html,body{max-width:100%;overflow-x:hidden}

.card{background:var(--el);border:1px solid var(--b0);border-radius:3px;margin-bottom:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 14px;border-bottom:1px solid var(--b1);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--c1)}
.card-h .src{font-family:var(--fm);font-size:10px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--c2)}
.card-b{padding:12px 14px}
.card.hero{border-top:3px solid var(--ac)}
.kv{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr);gap:5px 14px;font-size:12.5px}
.kv dt{color:var(--c2)}.kv dd{min-width:0;overflow-wrap:anywhere}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.muted{color:var(--c2)}
.small{font-size:11.5px}
.title-lote{font-size:18px;font-weight:900;letter-spacing:.2px;line-height:1.25}
.sub{color:var(--c1);font-size:12px;margin-top:2px}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:2px 8px;border-radius:3px;white-space:nowrap}
.tag-ok{background:var(--okbg);color:var(--ok)}.tag-warn{background:var(--warnbg);color:#b77905}.tag-err{background:var(--errbg);color:var(--err)}.tag-grey{background:var(--bg2);color:var(--c1)}.tag-ac{background:var(--acbg);color:var(--ac)}
:root[data-theme="dark"] .tag-warn{color:var(--warn)}
.tags{display:flex;flex-wrap:wrap;gap:6px}

.alert{border-left:3px solid var(--warn);background:var(--warnbg);padding:8px 10px;border-radius:2px;font-size:12.5px;margin-top:8px}
.alert.err{border-color:var(--err);background:var(--errbg)}
.alert.info{border-color:var(--ac);background:var(--acbg)}
.alert.ok{border-color:var(--ok);background:var(--okbg)}

.big{font-family:var(--ff);font-weight:900;font-size:clamp(34px,6vw,52px);line-height:1;color:var(--c0);font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.big small{font-size:.38em;font-weight:700;color:var(--c1);margin-left:6px;letter-spacing:0}
.lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--c2)}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--b1);border-bottom:1px solid var(--b1);margin:12px 0}
.metric{padding:9px 10px 9px 0;min-width:0}.metric+.metric{padding-left:10px;border-left:1px solid var(--b1)}
.metric .v{font-family:var(--fm);font-size:16px;font-weight:500;line-height:1.3}
.metric .d{font-size:10.5px;color:var(--c2);line-height:1.3}
@media(max-width:520px){.metrics{grid-template-columns:1fr 1fr}.metric:nth-child(3){padding-left:0;border-left:0}.metric:nth-child(n+3){border-top:1px solid var(--b1)}}

.inputs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 10px;margin-top:4px}
@media(max-width:520px){.inputs{grid-template-columns:1fr 1fr}}
.fld{display:grid;gap:2px;font-size:11px;color:var(--c2);font-weight:700;min-width:0}
.fld .row{display:flex;align-items:center;border:1px solid var(--b0);border-radius:3px;background:var(--bg);overflow:hidden}
.fld input,.fld select{flex:1;min-width:0;border:0;background:transparent;padding:5px 7px;font-family:var(--fm);font-size:12.5px;color:var(--c0)}
.fld select{font-family:var(--ff);font-weight:600}
.fld .u{font-family:var(--fm);font-size:10.5px;color:var(--c2);padding:0 7px;border-left:1px solid var(--b0)}
.fld .det{font-weight:400;font-size:10px;color:var(--ok)}
.fld.man .row{border-color:var(--warn)}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--c0);font-weight:600}
.chk input{accent-color:var(--ac)}

.corte{border:1px solid var(--b1);border-radius:3px;background:var(--bg);overflow-x:auto;margin-top:10px}
.corte svg{display:block;width:100%;height:auto;min-width:440px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--c2);margin-top:6px}
.legend i{display:inline-block;width:14px;height:9px;margin-right:5px;vertical-align:-1px;border:1px solid var(--ac)}
.legend i.u{background:var(--floor)}.legend i.g{border-style:dashed}

.tw{overflow-x:auto;border:1px solid var(--b1);border-radius:3px;margin-top:10px}
table.t{border-collapse:collapse;width:100%;font-size:11.5px;min-width:520px}
table.t th,table.t td{padding:5px 8px;border-bottom:1px solid var(--b1);text-align:right;white-space:nowrap}
table.t th{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--c2);background:var(--bg1);font-weight:700}
table.t td{font-family:var(--fm);font-variant-numeric:tabular-nums}
table.t th:first-child,table.t td:first-child,table.t th:last-child,table.t td:last-child{text-align:left}
table.t td:last-child{font-family:var(--ff);color:var(--c2);white-space:normal;min-width:140px}
table.t tr.off td{color:var(--c2);text-decoration:line-through;text-decoration-color:var(--b0)}
table.t tfoot td{font-weight:700;background:var(--bg1);border-bottom:0}
table.t.wrap td{white-space:normal}
.bytag{font-size:9.5px;padding:1px 5px;border-radius:2px;background:var(--acbg);color:var(--ac);margin-left:6px;font-family:var(--ff);font-weight:700;text-transform:uppercase}

ul.refs{list-style:none;display:grid;gap:5px;font-size:12px;margin-top:8px}
ul.refs li{padding-left:10px;border-left:2px solid var(--ac)}
ul.plain{list-style:none;display:grid;gap:8px;font-size:12.5px}
ul.plain li{border-bottom:1px solid var(--b1);padding-bottom:7px}ul.plain li:last-child{border-bottom:0;padding-bottom:0}
details.more summary{cursor:pointer;font-size:11.5px;color:var(--ac);font-weight:700;margin-top:8px;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:6px}

.empty{padding:28px 18px;text-align:center;color:var(--c1)}
.empty h2{font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:var(--c0);margin-bottom:6px}
.steps{display:grid;gap:8px;text-align:left;max-width:420px;margin:14px auto 0;font-size:12.5px}
.steps div{display:flex;gap:10px;align-items:flex-start}
.steps b{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:2px;background:var(--ac);color:#fff;font-size:11px;flex:none}
.ld{display:flex;align-items:center;gap:10px;color:var(--c1);padding:16px 4px}
.sp{width:18px;height:18px;border:2px solid var(--b0);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.sp{animation-duration:3s}}

.page{flex:1;overflow-y:auto;padding:16px 20px 40px}
.page-in{max-width:1180px;margin:0 auto}
.stats{display:flex;flex-wrap:wrap;gap:18px;margin:4px 0 14px}
.stat .v{font-family:var(--fm);font-size:22px;font-weight:500;line-height:1.1}.stat .d{font-size:10.5px;color:var(--c2);text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:3px;border:1px solid var(--b0);background:var(--el);color:var(--c1);cursor:pointer;font-family:var(--ff)}.pill.on{background:var(--ac);color:#fff;border-color:var(--ac)}

.leaflet-container{font-family:var(--ff)}
.leaflet-tooltip.calle{background:var(--el);color:var(--c0);border:1px solid var(--ac);font-family:var(--fm);font-size:11px;padding:2px 6px;box-shadow:none}

.modal-bg{position:fixed;inset:0;background:rgba(10,12,18,.5);z-index:3000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--el);border:1px solid var(--b0);border-radius:4px;width:100%;max-width:380px;padding:20px;box-shadow:var(--shm);color:var(--c0)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;flex-shrink:0}
.sess{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--c1);padding:0 4px;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
textarea.note{flex:1;min-height:60px;resize:vertical;padding:7px 9px;font-family:var(--ff);font-size:13px;border:1px solid var(--b0);border-radius:3px;background:var(--bg);color:var(--c0)}
ul.notas{list-style:none;margin-top:10px;display:grid;gap:8px}
ul.notas li{border-left:3px solid var(--b0);padding:4px 0 4px 10px;font-size:13px}
ul.notas li.n-nota{border-left-color:var(--ac)}ul.notas li.n-estado{border-left-color:#d48806}ul.notas li.n-precio{border-left-color:#2f6fd6}
table.t tr.clickable{cursor:pointer}table.t tr.clickable:hover td{background:var(--acbg)}
table.t th.sortable{cursor:pointer;user-select:none}table.t th.sortable:hover{color:var(--c0)}
h3.lbl{font-size:11px}
.login-page{flex:1;display:grid;grid-template-columns:1.1fr 1fr;min-height:0;overflow-y:auto;background:var(--bg)}
.login-brand{background:#141414;color:#fff;padding:56px 48px;display:flex;flex-direction:column;justify-content:center;gap:8px;border-right:3px solid var(--ac)}
.login-logo{width:52px;height:52px;border-radius:4px;background:var(--ac);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px;letter-spacing:1px;margin-bottom:10px}
.login-brand h1{font-size:30px;font-weight:300;letter-spacing:1px;line-height:1.2}
.login-sub{font-size:11.5px;text-transform:uppercase;letter-spacing:3px;color:rgba(255,255,255,.55);margin-bottom:16px}
.login-brand ul{list-style:none;display:grid;gap:10px;max-width:440px;margin:4px 0 20px}
.login-brand li{padding-left:16px;position:relative;font-size:14px;line-height:1.5;color:rgba(255,255,255,.86)}
.login-brand li:before{content:'';position:absolute;left:0;top:9px;width:7px;height:2px;background:var(--ac2)}
.login-brand .small{color:rgba(255,255,255,.45)}
.login-side{display:flex;align-items:center;justify-content:center;padding:32px 20px}
.login-card{width:100%;max-width:360px;background:var(--el);border:1px solid var(--b0);border-radius:4px;padding:26px;color:var(--c0)}
.login-card h2{font-size:18px;margin-bottom:2px}
@media(max-width:800px){.login-page{grid-template-columns:1fr;align-content:start}.login-brand{padding:28px 20px;border-right:0;border-bottom:3px solid var(--ac)}.login-brand ul{display:none}}
.umenu{position:relative;display:flex;align-items:center;gap:6px}
.empsel{font-family:var(--ff);font-size:12px;font-weight:700;padding:5px 8px;border:1px solid var(--b0);border-radius:3px;background:var(--el);color:var(--c0);max-width:180px;cursor:pointer}
.ubtn{display:flex;align-items:center;gap:6px;border:1px solid var(--b0);background:var(--el);color:var(--c1);border-radius:3px;padding:3px 8px 3px 3px;cursor:pointer;font-family:var(--ff);font-size:12px;font-weight:700}
.ubtn:hover{background:var(--bg1);color:var(--c0)}
.avatar{width:22px;height:22px;border-radius:3px;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px}
.uname{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.udrop{position:absolute;right:0;top:calc(100% + 6px);z-index:2500;background:var(--el);border:1px solid var(--b0);border-radius:4px;box-shadow:var(--shm);padding:12px;width:250px;color:var(--c0)}
@media(max-width:600px){.uname{display:none}.empsel{max-width:120px}}
table.t input.cell{width:100%;min-width:70px;border:1px solid transparent;background:transparent;font-family:var(--fm);font-size:12px;text-align:right;padding:3px 4px;color:var(--c0);border-radius:2px}
table.t input.cell:hover,table.t input.cell:focus{border-color:var(--b0);background:var(--bg);outline:none}
table.t.neg td{padding:2px 4px}
.city-page{flex:1;overflow-y:auto;background:var(--bg);padding:28px 16px 40px}
.city-in{max-width:980px;margin:0 auto}
.city-in h1{font-size:24px;font-weight:300;letter-spacing:.5px;margin-bottom:4px}
.city-grp{margin-top:22px}
.city-grp h2{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:var(--c1);margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.city-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:8px}
.city-btn{text-align:left;border:1px solid var(--b0);background:var(--el);border-radius:4px;padding:10px 12px;cursor:pointer;font-family:var(--ff);color:var(--c0);display:flex;flex-direction:column;gap:3px;min-width:0}
.city-btn:hover{border-color:var(--ac);background:var(--acbg)}
.city-btn b{font-size:13.5px}
.city-btn span{font-size:11px;color:var(--c1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.city-btn.big{border-top:3px solid var(--ac);padding:14px}
.niv{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.6px;padding:2px 7px;border-radius:2px}
.niv-3{background:var(--okbg);color:var(--ok)}.niv-2{background:var(--acbg);color:var(--ac)}.niv-1{background:var(--warnbg);color:#b77905}

.city-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--b0);background:var(--el);border-radius:3px;padding:3px 8px;font-family:var(--ff);font-size:12px;font-weight:700;color:var(--c0);cursor:pointer;white-space:nowrap}

@media print{.tabgrp{display:block!important}
  body{overflow:visible;height:auto;background:#fff;color:#000}
  #root{height:auto}
  .hdr,.sbar,.mapwrap,.no-print,.leaflet-control-container,.modal-bg{display:none!important}
  .main{display:block}
  .panel{overflow:visible;padding:0}
  .card{break-inside:avoid;border-color:#ccc}
  .print-only{display:block!important}
}
.print-only{display:none}
/* ═══════════════════════════════════════════════════════════════════
   Capa visual ECIPSA · misma familia que el portal de herramientas
   Idea: la herramienta es una lámina del legajo de obra. El navy es la línea del plano;
   el naranja marca solo lo que se está por tocar: la parcela en el mapa y la acción principal.
   Urbanist reemplaza a Gilroy en web (como en el portal); Open Sans para el texto.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --navy:#28283D;--naranja:#FB7520;--naranja-osc:#C9530A;
  --bg:#F6F6F6;--bg1:#EFEFF2;--bg2:#E7E7EC;--el:#FFFFFF;
  --c0:#28283D;--c1:#575756;--c2:#6f6f7a;
  --b0:rgba(40,40,61,.16);--b1:rgba(40,40,61,.09);--bf:rgba(40,40,61,.55);
  --ac:#C2560E;--ac2:#A8480A;--acbg:rgba(251,117,32,.10);
  --ok:#1d6b34;--okbg:rgba(29,107,52,.09);--err:#a3261f;--errbg:rgba(163,38,31,.08);--warn:#9a5b00;--warnbg:rgba(154,91,0,.08);
  --floor:rgba(251,117,32,.22);--floor2:rgba(251,117,32,.07);
  --sh:none;--shm:0 8px 24px rgba(40,40,61,.12);
  --ff:'Open Sans',Arial,sans-serif;--ft:'Gilroy','Urbanist',Arial,sans-serif;--fm:'Open Sans',Arial,sans-serif;
  --r:6px;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1d1d2c;--bg1:#232335;--bg2:#2b2b40;--el:#262638;--c0:#F2F2F5;--c1:#c9c9d3;--c2:#9a9aab;
  --b0:rgba(242,242,245,.14);--b1:rgba(242,242,245,.08);--bf:rgba(242,242,245,.5);
  --ac:#FB7520;--ac2:#FF9A55;--acbg:rgba(251,117,32,.14);--ok:#7fd492;--okbg:rgba(127,212,146,.1);--err:#ff9b97;--errbg:rgba(255,155,151,.1);--warn:#ffb86b;--warnbg:rgba(255,184,107,.1);
  --floor:rgba(251,117,32,.26);--floor2:rgba(251,117,32,.08);--shm:0 8px 24px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{
  --bg:#1d1d2c;--bg1:#232335;--bg2:#2b2b40;--el:#262638;--c0:#F2F2F5;--c1:#c9c9d3;--c2:#9a9aab;
  --b0:rgba(242,242,245,.14);--b1:rgba(242,242,245,.08);--bf:rgba(242,242,245,.5);
  --ac:#FB7520;--ac2:#FF9A55;--acbg:rgba(251,117,32,.14);--ok:#7fd492;--okbg:rgba(127,212,146,.1);--err:#ff9b97;--errbg:rgba(255,155,151,.1);--warn:#ffb86b;--warnbg:rgba(255,184,107,.1);
  --floor:rgba(251,117,32,.26);--floor2:rgba(251,117,32,.08);--shm:0 8px 24px rgba(0,0,0,.4)}
body{font-size:14px;line-height:1.55;color:var(--c1)}
:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--naranja);outline-offset:2px;border-radius:2px}
h1,h2,h3{font-family:var(--ft);color:var(--c0)}
.mono{font-family:var(--ff);font-variant-numeric:tabular-nums}

/* Barra: marca, herramienta y ciudad, secciones */
.hdr,.eci-barra{height:auto;min-height:60px;background:var(--el);border-bottom:1px solid var(--b0);padding:0 20px;gap:20px;position:relative;z-index:1100}
.eci-barra-in{display:flex;align-items:center;gap:16px;min-height:60px}
.eci-mark{display:inline-flex;flex-direction:column;line-height:1;text-decoration:none;color:var(--navy);flex:none}
:root[data-theme="dark"] .eci-mark{color:#F2F2F5}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .eci-mark{color:#F2F2F5}}
.eci-mark .g{font-family:Arial,sans-serif;font-size:9.5px;letter-spacing:.42em;margin-bottom:2px}
.eci-mark .e{font-family:var(--ft);font-weight:800;font-size:21px;letter-spacing:.01em}
.eci-mark .e b{color:var(--naranja);font-weight:800}
.ruta{display:flex;align-items:center;gap:10px;padding-left:20px;border-left:1px solid var(--b0);min-width:0}
.ruta-h{font-family:var(--ft);font-weight:700;font-size:17px;color:var(--c0);white-space:nowrap}
.city-chip{font-family:var(--ff);font-size:13px;font-weight:600;color:var(--c1);border:1px solid var(--b0);border-radius:999px;padding:4px 10px 4px 12px;background:transparent;gap:6px}
.city-chip:hover{border-color:var(--bf);color:var(--c0)}
.seg{background:transparent;padding:0;gap:4px;border-radius:0;align-self:stretch;margin-left:8px}
.seg button{font-family:var(--ft);font-size:15px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--c2);padding:0 10px;border-radius:0;border-bottom:2px solid transparent;margin-bottom:-1px;min-height:60px}
.seg button:hover{color:var(--c0)}
.seg button.on{background:transparent;color:var(--c0);box-shadow:none;border-bottom-color:var(--naranja)}
.seg .cnt{display:inline-block;margin-left:6px;font-family:var(--ff);font-size:11px;font-weight:700;color:var(--c1);background:var(--bg1);border-radius:999px;padding:1px 7px;vertical-align:2px}
.acts{gap:8px}
.btn-i{width:36px;height:36px;border-radius:var(--r);color:var(--c1);display:inline-flex;align-items:center;justify-content:center}
.ubtn{border-radius:999px;padding:3px 10px 3px 3px;font-size:13px;font-weight:600;color:var(--c0);border-color:var(--b0)}
.avatar{border-radius:50%;width:28px;height:28px;background:var(--navy);color:#fff;font-family:var(--ft);font-weight:700;font-size:13px}
.udrop{border-radius:var(--r);padding:16px}

/* Botones */
.btn{font-family:var(--ff);font-size:13px;font-weight:600;min-height:36px;padding:0 14px;border-radius:var(--r);border:1px solid var(--bf);background:transparent;color:var(--c0)}
.btn:hover{background:transparent;border-color:var(--c0);color:var(--c0)}
.btn.pri{background:var(--naranja);border-color:var(--naranja);color:#fff}
.btn.pri:hover{background:var(--naranja-osc);border-color:var(--naranja-osc);color:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#fff}}
:root[data-theme="dark"] .btn.pri{color:#fff}
.pill{font-family:var(--ff);font-size:12.5px;font-weight:600;border-radius:999px;padding:5px 12px;border-color:var(--b0);background:transparent;color:var(--c1)}
.pill.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* Buscador */
.sbar{background:var(--el);border-bottom:1px solid var(--b0);padding:10px 20px;gap:10px}
.sin{min-height:40px;border-radius:var(--r);border:1px solid var(--bf);font-size:14px;padding:0 12px;background:var(--el)}
.sin:focus{outline:none;border-color:var(--naranja);box-shadow:0 0 0 3px rgba(251,117,32,.2)}
.shint{font-size:12.5px;color:var(--c2)}
.sres{border-radius:var(--r);border-color:var(--b0);box-shadow:var(--shm);left:20px}
.sres button{font-size:13.5px;padding:10px 14px}

/* Panel y láminas */
.main{grid-template-columns:minmax(0,1fr) minmax(440px,620px)}
.panel{padding:20px 20px 48px;background:var(--bg)}
.card{border-radius:var(--r);border:1px solid var(--b0);margin-bottom:16px;box-shadow:none}
.card-h{padding:14px 18px 10px;border-bottom:1px solid var(--b1);text-transform:none;letter-spacing:0;font-family:var(--ft);font-size:16px;font-weight:700;color:var(--c0);align-items:baseline}
.card-h .src{font-family:var(--ff);font-size:12px;font-weight:400;color:var(--c2);text-align:right}
.card-b{padding:14px 18px 16px}
.card.hero{border-top:2px solid var(--navy)}
:root[data-theme="dark"] .card.hero{border-top-color:var(--c0)}
.kv{font-size:13.5px;gap:6px 16px}
.kv dt{color:var(--c2)}.kv dd{color:var(--c0)}
.title-lote{font-family:var(--ft);font-weight:800;font-size:22px;letter-spacing:-.01em;color:var(--c0)}
.sub{font-size:13px;color:var(--c1)}
.small{font-size:12.5px}
.lbl,h3.lbl{font-family:var(--ff);font-size:12.5px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--c2)}
.tag,.bytag,.niv{text-transform:none;letter-spacing:0;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px}
.tag-warn{color:var(--warn)}
.alert{border-radius:0 var(--r) var(--r) 0;font-size:13.5px;padding:10px 12px;color:var(--c0);border-left-width:3px}
.alert.info{border-color:var(--navy);background:var(--bg1)}
:root[data-theme="dark"] .alert.info{border-color:var(--c2)}
ul.refs{font-size:13.5px;gap:8px}
ul.refs li{border-left:2px solid var(--b0);padding-left:12px}
details.more summary{color:var(--c0);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--bf);font-weight:600;font-size:13px}

/* Números: Urbanist para la cifra que importa, Open Sans con cifras tabulares en tablas */
.big{font-family:var(--ft);font-weight:800;letter-spacing:-.02em;color:var(--c0)}
.big small{font-family:var(--ff);font-weight:600}
.metric .v,.stat .v{font-family:var(--ft);font-weight:700;font-size:18px;color:var(--c0)}
.metric .d,.stat .d{font-size:12px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--c2)}
table.t{font-size:13px}
table.t th{font-family:var(--ff);font-size:12px;text-transform:none;letter-spacing:0;font-weight:600;color:var(--c2);background:transparent;border-bottom:1px solid var(--bf)}
table.t td{font-family:var(--ff);font-variant-numeric:tabular-nums;border-bottom-color:var(--b1);color:var(--c0)}
table.t tfoot td{background:transparent;border-top:1px solid var(--bf)}
.tw,.corte{border-radius:var(--r);border-color:var(--b0)}

/* Campos */
.fld{font-size:12.5px;font-weight:600;color:var(--c1);gap:4px}
.fld .row{border-radius:var(--r);border-color:var(--bf);background:var(--el);min-height:38px}
.fld .row:focus-within{border-color:var(--naranja);box-shadow:0 0 0 3px rgba(251,117,32,.2)}
.fld input,.fld select{font-family:var(--ff);font-size:14px;font-variant-numeric:tabular-nums;padding:6px 10px}
.fld input:focus,.fld select:focus{outline:none}
.fld .u{font-family:var(--ff);font-size:12px;border-left-color:var(--b0)}
.fld.man .row{border-color:var(--warn);border-style:dashed}
textarea.note{border-radius:var(--r);border-color:var(--bf);background:var(--el);font-size:14px}

/* Rótulo del lote: el resumen, como el rótulo de una lámina */
.rotulo-lote{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.35fr;background:var(--el);border:1px solid var(--bf);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.rc{padding:10px 14px 12px;border-left:1px solid var(--b0);display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left;font:inherit;color:inherit;background:transparent;border-top:0;border-right:0;border-bottom:0}
.rc:first-child{border-left:0}
.rc span{font-size:12px;color:var(--c2)}
.rc b{font-family:var(--ft);font-weight:700;font-size:17px;line-height:1.2;color:var(--c0);overflow-wrap:anywhere}
.rc small{font-size:12px;color:var(--c2);overflow-wrap:anywhere}
.rc .sw{display:inline-block;width:10px;height:10px;background:var(--naranja);margin-right:7px;vertical-align:1px}
.rc-cab{cursor:pointer;background:var(--bg1)}
.rc-cab:hover{background:var(--acbg)}
.rc-cab .num{font-weight:800;font-size:30px;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.rc-cab .num em{font-style:normal;font-family:var(--ff);font-size:14px;font-weight:600;color:var(--c1);letter-spacing:0}
.rc-cab .num.sin{color:var(--c2)}
@media(max-width:1180px){.rotulo-lote{grid-template-columns:1fr 1fr}.rc:nth-child(3){border-left:0}.rc:nth-child(n+3){border-top:1px solid var(--b0)}}

/* Pantalla inicial vacía */
.empty{text-align:left;padding:24px 22px}
.empty h2{font-family:var(--ft);font-size:24px;font-weight:800;text-transform:none;letter-spacing:-.01em}
.steps{margin:16px 0 0;max-width:none;font-size:14px;gap:10px}
.steps b{background:transparent;color:var(--c0);border:1.5px solid var(--bf);border-radius:50%;width:24px;height:24px;font-family:var(--ft);font-weight:700;font-size:13px}
.sp{border-top-color:var(--naranja)}

/* Selector de ciudad: índice de láminas, como el portal */
.city-page{padding:0;background:var(--bg)}
.city-in{max-width:none}
.city-in .eci-barra{padding:0}
.city-in .eci-barra-in{max-width:1180px;margin:0 auto;padding:0 24px}
.city-hoja{max-width:1180px;margin:0 auto;padding:56px 24px 48px}
.city-hoja h1{font-family:var(--ft);font-weight:800;font-size:clamp(34px,5vw,56px);line-height:1.02;letter-spacing:-.02em;color:var(--c0);margin:0 0 12px}
.city-hoja .bajada{font-size:17px;max-width:52ch;margin:0 0 36px;color:var(--c1)}
.indice{list-style:none;margin:0;padding:0;border-top:2px solid var(--c0);max-width:900px}
.lamina{border-bottom:1px solid var(--b0)}
.lamina button{width:100%;display:grid;grid-template-columns:64px minmax(0,1fr) auto;grid-template-areas:'cod tit abrir' 'cod desc abrir';gap:4px 20px;align-items:center;padding:22px 4px;background:none;border:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
.lamina .cod{grid-area:cod;font-family:var(--ft);font-weight:800;font-size:44px;line-height:1;color:var(--c0)}
.lamina .tit{grid-area:tit;font-family:var(--ft);font-weight:700;font-size:23px;line-height:1.2;color:var(--c0)}
.lamina .desc{grid-area:desc;font-size:15px;max-width:64ch;color:var(--c1)}
.lamina .det{display:block;font-size:13px;color:var(--c2);margin-top:4px}
.lamina .abrir{grid-area:abrir;font-weight:600;font-size:14px;color:var(--c0);border:1px solid var(--bf);border-radius:var(--r);padding:10px 16px;white-space:nowrap}
.lamina button:hover .cod,.lamina button:focus-visible .cod,.lamina.activa .cod{color:var(--naranja)}
.lamina button:hover .abrir,.lamina button:focus-visible .abrir{background:var(--naranja);border-color:var(--naranja);color:#fff}
@media(max-width:640px){
  .lamina button{grid-template-columns:40px minmax(0,1fr);grid-template-areas:'cod tit' 'cod desc' '. abrir';padding:18px 0;align-items:start}
  .lamina .cod{font-size:30px}.lamina .abrir{justify-self:start;margin-top:10px}
  .city-hoja{padding:32px 16px 40px}
}

/* Ingreso por el portal */
.login-page{grid-template-columns:1fr 1fr;background:var(--bg)}
.login-brand{background:var(--navy);border-right:0;padding:56px 48px}
.login-brand h1{font-family:var(--ft);font-weight:800;font-size:40px;letter-spacing:-.02em;color:#fff}
.login-sub{text-transform:none;letter-spacing:0;font-size:15px;color:rgba(255,255,255,.75)}
.login-card{border-radius:var(--r);border-color:var(--b0);padding:28px}
.login-card h2{font-family:var(--ft);font-weight:800;font-size:24px;margin-bottom:6px}
.login-card .btn{min-height:44px;font-size:15px}

.page{padding:24px 24px 48px}
.page h1.title-lote{font-size:28px}
.modal{border-radius:var(--r)}
.leaflet-container{background:var(--bg2)}
.leaflet-bar a,.leaflet-control-layers{border-radius:var(--r)!important}
.leaflet-tooltip.calle{border-color:var(--navy);font-family:var(--ff)}

@media(max-width:900px){
  .hdr{padding:0 16px;gap:12px}
  .ruta{padding-left:12px;gap:8px}.ruta-h{display:none}
  .seg{order:10;flex:1 1 100%;margin:0 -16px;padding:0 8px;border-top:1px solid var(--b1);align-self:auto}
  .seg button{min-height:44px;font-size:14px}
  .panel{padding:16px}
  .sbar{padding:10px 16px}
  .btn{min-height:44px}
  .login-page{grid-template-columns:1fr}
}
@media(max-width:520px){.rc-cab .num{font-size:26px}}
/* Los niveles eran para el interior provincial: con dos ciudades no aportan */
.niv{display:none!important}
ol.ords{list-style:none;margin:8px 0 0;padding:0;border-top:2px solid var(--c0);max-width:980px}
ol.ords li{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:4px 20px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--b0)}
ol.ords .n{font-family:var(--ft);font-weight:700;font-size:17px;color:var(--c0)}
ol.ords .t{color:var(--c0);font-size:15px}
ol.ords .f{display:block;font-size:12.5px;color:var(--c2)}
ol.ords .sinlink{font-size:12.5px;color:var(--c2)}
@media(max-width:640px){ol.ords li{grid-template-columns:1fr}ol.ords .btn{justify-self:start}}
@media(max-width:900px){.hdr{padding-top:6px}}
:root[data-theme="dark"] .avatar{background:var(--bg2)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .avatar{background:var(--bg2)}}
@media(max-width:900px){
  .hdr .seg{margin:0 -16px!important;padding:0 6px;justify-content:space-between}
  .hdr .seg button{padding:0 8px;font-size:14px;flex:0 0 auto;min-height:44px}
  .shint{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01ms!important}}

  /**
   * Analiza la geometría del lote contra su manzana y las manzanas vecinas.

  // ---------------------------------------------------------------- normativa

  /** Normaliza un registro de la capa CBA_Ordenanza_8256 */
  function parseNorma(p) {
    if (!p) return null;
    const N = {
      raw: p,
      clave: str(p.ord_y_perfil),
      perfil: str(p.perfil_o_zona),
      zona: str(p.zona),
      ordOriginal: str(p.ord_original),
      ordModif: str(p.ord_modificatoria),
      art: str(p.art_ord),
      grafico: str(p.grafico),
      enlaceGrafico: str(p.enlace_grafico),
      caracter: str(p.caracter_urbanistico),
      industria: str(p.actividad_industrial),
      fos: num(p.fos), fot: num(p.fot),
      hLM: num(p.altura_lm), hMax: num(p.altura_maxima),
      plano45: str(p.plano_a_45).toUpperCase(),
      hPerim: num(p.altura_perim),
      pisosLM: pisos(p.pisos_lm), pisosMax: pisos(p.pisos_maximos), pisosPerim: pisos(p.n_pisos_li),
      retiroFrente: str(p.retiro_frente), otrosRetiros: str(p.otros_retiros),

    if (N.fuente === '8057' && /CORREDOR/i.test(N.zona)) N.etiqueta = 'Perfil ' + N.perfil + ' · ' + N.zona.replace(/^CORREDOR\s*/i, 'Corredor ');
    if (N.fos != null && N.fos > 0 && N.fos <= 10 && N.fot != null && N.fot > 0 && N.fot <= 1) {

      N.notes.push('Los valores de FOS y FOT de este polígono están cruzados en la capa; se usaron FOS ' + Math.round(N.fos * 100) + '% y FOT ' + fmt(N.fot) + '.');
    } else if (N.fos != null && N.fos > 1) N.fos = N.fos / 100;

    else if ((m = rf.match(/Retiro LE a (\d+(?:[.,]\d+)?)\s*m a partir de los (\d+(?:[.,]\d+)?)/i))) N.step = { type: 'le', d: pnum(m[1]), from: pnum(m[2]) };

    else if ((m = rf.match(/Plano a 45.{0,3} a partir de los (\d+(?:[.,]\d+)?)/i))) N.step = { type: 'p45', from: pnum(m[1]) };
    if (!N.step) {

    const orrV = /VIVIENDA/i.test(orr) ? orr.slice(orr.search(/VIVIENDA/i)) : orr;
    if ((m = orrV.match(/(\d+(?:[.,]\d+)?)\s*m(?:ts)?\.?\s*(?:en|de)\s*todos los linderos/i)) || (m = orrV.match(/todos los linderos[^\d]{0,8}(\d+(?:[.,]\d+)?)\s*m/i))) {

    if (/FOS:\s*100% para parcelas en esquina/i.test(obs)) N.fosEsq100 = true;

    if (N.fuente === '8256' && CAP4.has(N.perfil)) N.cap4 = true;

    if (N.fuente === '8256' && N.perfil === 'C1') N.wideW = 24;
    if (N.fuente === '8256' && N.perfil === 'C2') N.wideW = 20;
    return N;
  }

  function parseUnits(t) {
    t = str(t);
    const u = { txt: t };
    let m;
    if (!t) return u;
    if ((m = t.match(/1\s*(?:cada|c\/)\s*(\d+)\s*m(?:²|2)\s*(?:de|del)?\s*(?:la\s*)?Superficie de Parcela/i))) u.perS = pnum(m[1]);
    if ((m = t.match(/1\s*(?:cada|c\/)\s*(\d+)\s*m(?:²|2)\s*del FOT/i))) u.perFOT = pnum(m[1]);
    if ((m = t.match(/1\s*cada\s*(\d+)\s*m(?:²|2)\s*ubicadas por dentro del per[ií]metro de Av\.? Circun/i))) u.perS_CV = pnum(m[1]);
    if ((m = t.match(/hasta (\d+)/i))) u.max = pnum(m[1]);
    if (/UNA POR PARCELA ACCESORIA/i.test(t)) u.accesoria = true;
    if (/1 Viv(ienda)? por parcela/i.test(t)) u.max = 1;
    return u;
  }

  // Art. 42 (Ord. 12596): decimales ≥ 0,50 suman una unidad
  function roundUF(x) { const i = Math.floor(x + 1e-9); return (x - i) >= 0.5 - 1e-9 ? i + 1 : i; }
  const NO_MIN2 = new Set(['L', 'N', 'N1', 'M']);
  function unitsCalc(N, S, total) {
    const u = N.units || {};
    const z = N.perfil;
    const min2 = N.fuente === '8256' && !NO_MIN2.has(z); // Art. 26: 2 UF en toda parcela salvo L, N, N1 y M
    if (u.accesoria) return { n: 1, label: '1 accesoria', txt: 'Una vivienda por parcela, accesoria al uso industrial' };
    if (u.max && !u.perS && !u.perFOT) return { n: u.max, label: String(u.max), txt: u.txt };
    if (u.perS || u.perFOT) {
      const base = u.perS ? S / u.perS : (N.fot ? N.fot * S / u.perFOT : 0);
      let n = Math.max(1, roundUF(base));
      const parts = [u.perS ? '1 cada ' + u.perS + ' m² de parcela' : '1 cada ' + u.perFOT + ' m² del FOT'];
      if (u.max && n > u.max) { n = u.max; parts.push('tope ' + u.max); }
      if (min2 && n < 2) { n = 2; parts.push('mínimo 2 por Art. 26'); }
      if (base % 1 >= 0.5 - 1e-9 && n > 1) parts.push('redondeo del Art. 42');
      const r = { n: n, label: String(n), txt: parts.join(' · ') };
      // +25% con factibilidad cloacal (Art. 26; excepciones del Dec. 1883/19)
      const noBonus = (z === 'F3' && u.perS === 100) || (['F4', 'G2', 'G3', 'H2'].indexOf(z) >= 0 && !!u.perFOT);
      if (u.perS_CV) {
        // F3 (Ord. 12596): 1 cada 100 m² con máximo de 5 unidades, dentro de Circunvalación y con factibilidad cloacal; no rige en áreas de protección patrimonial ni catalogados
        const capCV = z === 'F3' ? 5 : null;
        let nCV = roundUF(S / u.perS_CV); if (capCV && nCV > capCV) nCV = capCV;
        r.alt = { n: Math.max(n, nCV), txt: '1 cada ' + u.perS_CV + ' m² dentro de Av. Circunvalación con factibilidad cloacal' + (capCV ? ' (máximo ' + capCV + ', Ord. 12596)' : '') };
      }
      else if (u.perFOT && u.perS && N.fot) r.alt = { n: roundUF(N.fot * S / u.perFOT), txt: '1 cada ' + u.perFOT + ' m² del FOT con factibilidad de cloacas' };
      else if (!noBonus && N.fuente === '8256') r.alt = { n: Math.max(n, roundUF(base * 1.25)), txt: 'hasta +25% con factibilidad cloacal y obras complementarias (Art. 26)' };
      return r;
    }
    if (min2) return { n: null, label: 'Sin tope', txt: u.txt || 'La capa no fija tope de unidades: lo define la superficie construible (mínimo 2 por Art. 26).' };
    return { n: null, label: 'Sin tope', txt: u.txt || 'La capa no fija tope de unidades: lo define la superficie construible.' };
  }

  // ---------------------------------------------------------------- cabida
  /**
   * N: norma (parseNorma). L: lote {S, a, f, W, esq, cmOn, lfi, min8060S}. o: {hp, minD, leExtra}
   */
  function cabida(N, L, o) {
    o = o || {};
    const out = { rows: [], notes: [], refs: [], warns: [] };
    if (!N) { out.error = 'Sin norma de ocupación para este punto.'; return out; }
    if (N.noCalc) { out.error = N.noCalcReason; return out; }
    const S = L.S, a = L.a, f = L.f;
    if (!(S > 0 && a > 0 && f > 0)) { out.error = 'Faltan superficie, frente o fondo del lote.'; return out; }
    const W = L.W > 0 ? L.W : 16;
    const esq = !!L.esq;
    if (N.wideW && N.hMax) {
      if (W >= N.wideW - EPS) {
        N = Object.assign({}, N, { hLM: N.hMax, step: null, plano45: 'NO' });
        out.refs.push('Calle de ' + fmt(W) + ' m (≥ ' + N.wideW + ' m): la fachada sube sobre la LM hasta ' + fmt(N.hMax) + ' m, sin retiro ni plano a 45° (Ord. 12483, zona ' + N.perfil + ')');
      } else {
        N = Object.assign({}, N, { plano45: 'NO' });
        out.refs.push('Calle de ' + fmt(W) + ' m (< ' + N.wideW + ' m): perfil escalonado hasta ' + fmt(N.hMax) + ' m. Con calle de ' + N.wideW + ' m o más, o frente a espacio verde, la fachada podría subir derecho.');
      }
    }
    const hp = o.hp > 0 ? o.hp : (N.hpAuto || 3);
    const minD = o.minD > 0 ? o.minD : 4;
    const leX = o.leExtra > 0 ? o.leExtra : 0;
    out.hp = hp;
    const D = L.cmOn && L.lfi ? Math.min(f, L.lfi) : f;
    const cmExtra = (L.cmOn && L.lfi && f > L.lfi) ? 0.25 * a * (f - L.lfi) : 0;
    const whys = new Set();

    function fosAt(zt) {
      let v = N.fos;
      if (N.fosBySup) { v = S < N.fosBySup.lim ? N.fosBySup.a : N.fosBySup.b; whys.add('FOS según superficie de parcela (' + Math.round(v * 100) + '%)'); }
      if (N.fosByFrente) { v = a < N.fosByFrente.lim ? N.fosByFrente.a : N.fosByFrente.b; whys.add('FOS según frente (' + Math.round(v * 100) + '%)'); }
      if (N.fosMin8060 && L.min8060S && S < L.min8060S) { v = N.fosMin8060; whys.add('Lote menor al mínimo de la Ord. 8060 → FOS 80%'); }
      if (N.fosByH) v = zt <= N.fosByH.upto + EPS ? N.fosByH.a : N.fosByH.b;
      if (v == null) { v = 1; whys.add('La capa no trae FOS: se tomó 100% y limita el FOT'); }
      if (N.fosEsq100 && esq) { v = 1; whys.add('FOS 100% en esquina (verificar desarrollo ≤ 25% del frente de manzana)'); }
      if (N.cap3) {
        if (esq && (Math.min(a, L.a2 || a) <= 12 || S <= 250)) { v = 1; whys.add('Art. 35 (Ord. 12596): esquina con un frente ≤ 12 m o superficie ≤ 250 m² → FOS 100%'); }
        else if (!esq && f <= 15) { v = 1; whys.add('Art. 35 (Ord. 12596): entre medianeras con fondo ≤ 15 m → FOS 100%'); }
        else if (esq && zt <= 8 + EPS) { v = 1; whys.add('Art. 36: esquina → FOS 100% hasta 8 m (PB y 1 piso)'); }
      }
      return v;
    }
    function latFor(H) {
      const lt = N.lat; let l = 0, r = 0;
      if (lt) {
        if (lt.kind === 'fijo') { l = lt.d; r = lt.d; }
        else if (lt.kind === 'zonaL') { const d = Math.max(lt.min, H / 3); if (a > 60) { l = d; r = d; } else if (a >= 25) l = d; }
        else if (lt.kind === 'escalonado') { if (a >= lt.allFrom) { l = r = Math.max(lt.allMin, H / 3); } else if (a >= lt.oneFrom) l = Math.max(lt.oneMin, H / 3); }
        else if (lt.kind === 'uno') { if (a > lt.from) l = Math.max(lt.min, H / 3); }
      }
      if (esq && N.latCalle) l = Math.max(l, N.latCalle);
      return l + r;
    }
    const art34 = N.cap3 && !esq && W < 10;
    const stepEje = esq ? 0 : Math.max(0, 12 - W / 2);
    const front0 = (N.fixedFront || 0) + leX;
    const backFixed = (N.backExceptEsq && esq) ? 0 : (N.back || 0);
    let assumed45 = false;

    function frontAt(zt) {
      let fr = front0;
      const s = N.step;
      if (s) {
        if (s.type === 'eje' && zt > s.from + EPS) fr = Math.max(fr, Math.max(0, s.d - W / 2) * (esq ? 0 : 1) + leX);
        if (s.type === 'le' && zt > s.from + EPS) fr = Math.max(fr, front0 + s.d);
        if (s.type === 'p45' && zt > s.from + EPS) fr = Math.max(fr, front0 + (zt - s.from));
      } else if (N.hLM && N.hMax && N.hMax > N.hLM + EPS && zt > N.hLM + EPS) {
        fr = Math.max(fr, front0 + (zt - N.hLM)); assumed45 = true;
      }
      if (art34 && zt > 8 + EPS) fr = Math.max(fr, stepEje);
      return fr;
    }

    function runPerfil(latTotal) {
      const rows = [];
      const cap = N.unlimited ? 90 : (N.tower ? (N.hLM || 0) : N.hMax);
      for (let k = 0; k < 40; k++) {
        const zb = k * hp, zt = zb + hp;
        let fr, bk = backFixed, above = false;
        if (zt > cap + EPS) {
          if (N.plano45 === 'SI' && N.hMax) {
            if (rows.filter(function (r) { return r.zt > cap + EPS; }).length >= 2) break; // hasta 2 plantas útiles (zonas A y B)
            above = true;
            fr = Math.max(frontAt(Math.min(zt, N.hMax)), front0 + (zt - (N.hLM || N.hMax)));
            bk = backFixed + (zt - N.hMax);
          } else break;
        } else fr = frontAt(zt);
        const depth = D - fr - bk;
        const width = a - latTotal;
        if (depth < minD - EPS || width < 3) break;
        let foot = width * depth, note = above ? 'Plano límite a 45°' : '';
        if (k === 0 && cmExtra > 0 && hp <= 4 + EPS) { foot += cmExtra; note = 'Incluye 25% del centro de manzana (hasta 4 m)'; }
        const fos = fosAt(zt), capA = fos * S;
        const area = Math.min(foot, capA);
        rows.push({ k: k, zb: zb, zt: zt, front: fr, back: bk, depth: depth, width: width, foot: foot, fos: fos, area: area, by: foot > capA + EPS ? 'FOS' : (above ? '45°' : 'Perfil'), note: note });
      }
      return rows;
    }
    function runTower() {
      // basamento entre medianeras hasta hLM; torre en perímetro libre hasta hPerim con retiros de 1/5 de h a medianeras y fondo
      const rows = runPerfil(0);
      const base = rows.length;
      let best = null;
      const nMaxT = Math.floor((N.hPerim + EPS) / hp);
      for (let n = base + 1; n <= nMaxT; n++) {
        const H = n * hp, r = H / 5;
        const w = a - 2 * r, d = Math.min(D, f - r) - frontAt(H);
        if (w < 6 || d < minD) continue;
        const per = Math.min(w * d, fosAt(H) * S);
        best = { n: n, H: H, r: r, w: w, d: d, per: per };
      }
      if (best) {
        for (let k = base; k < best.n; k++) {
          const zt = (k + 1) * hp;
          const per = Math.min(best.w * best.d, fosAt(zt) * S);
          rows.push({ k: k, zb: k * hp, zt: zt, front: frontAt(zt), back: f - best.d - frontAt(zt), depth: best.d, width: best.w, foot: best.w * best.d, fos: fosAt(zt), area: per, by: 'Torre', note: 'Torre: retiro de ' + best.r.toFixed(1) + ' m a medianeras' });
        }
        out.refs.push('Torre en perímetro libre hasta ' + fmt(best.H) + ' m con retiros de 1/5 de la altura a ejes medianeros');
      }
      return rows;
    }

    const sumA = function (rs) { return rs.reduce(function (s, r) { return s + r.area; }, 0); };
    const fotCap = N.fot ? N.fot * S : Infinity;
    let rows, envRows, latUsed = 0;
    if (N.tower) {
      rows = runTower(); envRows = rows;
    } else {
      // elegir la cantidad de plantas que maximiza la superficie (los retiros laterales dependen de la altura)
      const hasLat = !!N.lat || (esq && N.latCalle);
      const nAll = runPerfil(0).length;
      let best = null;
      for (let n = 1; n <= Math.max(1, nAll); n++) {
        const lat = hasLat ? latFor(n * hp) : 0;
        const rs = runPerfil(lat).slice(0, n);
        const tot = Math.min(sumA(rs), fotCap);
        if (!best || tot > best.tot + 0.01) best = { n: n, lat: lat, tot: tot };
        if (!hasLat && rs.length < n) break;
      }
      latUsed = best ? best.lat : 0;
      envRows = runPerfil(latUsed);
      rows = envRows.slice(0, best ? best.n : 0).map(function (r) { return Object.assign({}, r); });
      if (!N.unlimited) envRows.slice(rows.length, rows.length + 2).forEach(function (r) { rows.push(Object.assign({}, r, { area: 0, by: 'FOT', note: 'No se usa: el FOT ya se agotó' })); });
      if (latUsed > 0) out.refs.push((esq && N.latCalle && !N.lat ? 'Retiro lateral sobre calle pública: ' : 'Retiros laterales aplicados: ') + fmt(latUsed) + ' m en total');
    }
    let total = sumA(rows);
    const envTotal = N.unlimited ? Math.min(sumA(envRows), fotCap) : sumA(envRows);
    let limit = rows.length && rows.filter(function (r) { return r.area > EPS; }).every(function (r) { return r.by === 'FOS'; }) ? 'FOS' : 'Perfil';
    if (N.fot) {
      if (total > fotCap + EPS || (envTotal > fotCap + EPS)) {
        let left = fotCap;
        rows.forEach(function (r) {
          if (r.by === 'FOT' && r.area === 0) return;
          const use = Math.min(r.area, Math.max(0, left));
          if (use < r.area - EPS) { r.by = 'FOT'; r.note = use > EPS ? 'Planta parcial: se agota el FOT' : 'No se usa: el FOT ya se agotó'; }
          r.area = use; left -= use;
        });
        total = sumA(rows); limit = 'FOT';
      }
    }
    if (N.unlimited && N.fot && limit !== 'FOT') limit = 'Retiros';
    if (rows.some(function (r) { return r.by === '45°' || r.note === 'Plano límite a 45°'; })) {
      const extra = rows.filter(function (r) { return r.note === 'Plano límite a 45°'; }).reduce(function (s, r) { return s + r.area; }, 0);
      if (extra > EPS) out.refs.push('Incluye ' + fmt(Math.round(extra)) + ' m² sobre la altura máxima dentro del plano límite a 45°');
    }
    // perímetro libre alternativo (zona B y similares)
    if (!N.tower && N.hPerim && N.hPerim > (N.hMax || 0)) {
      let best = null;
      const nMax = Math.floor((N.hPerim + EPS) / hp);
      for (let n = 1; n <= nMax; n++) {
        const H = n * hp, r = H / 5;
        const w = a - 2 * r, d = Math.min(D, f - r) - front0;
        if (w < 6 || d < minD) continue;
        let tot = 0;
        for (let k = 0; k < n; k++) tot += Math.min(w * d, fosAt((k + 1) * hp) * S);
        if (N.fot) tot = Math.min(tot, N.fot * S);
        if (!best || tot > best.tot + EPS) best = { n: n, H: H, r: r, tot: tot };
      }
      if (best) out.alt = { label: 'Perímetro libre (' + best.n + ' plantas, ' + fmt(best.H) + ' m, retiros ' + fmt(best.r) + ' m)', total: best.tot, approx: N.fuente !== '8256' || N.perfil !== 'B' };
      else out.notes.push('Perímetro libre hasta ' + fmt(N.hPerim) + ' m no es viable: el frente no deja 6 m libres tras los retiros de 1/5 de la altura.');
    }
    whys.forEach(function (w) { out.refs.push(w); });
    if (N.step && N.step.type === 'eje' && !esq) out.refs.push('Retiro a ' + fmt(N.step.d) + ' m del eje de calle desde los ' + fmt(N.step.from) + ' m: ' + fmt(stepEje) + ' m desde la LM con calle de ' + fmt(W) + ' m');
    if (N.step && N.step.type === 'le') out.refs.push('Retiro de ' + fmt(N.step.d) + ' m desde los ' + fmt(N.step.from) + ' m de altura');
    if (N.step && N.step.type === 'p45') out.refs.push('Plano a 45° desde los ' + fmt(N.step.from) + ' m');
    if (art34) out.refs.push('Art. 34: calle de menos de 10 m → retiro a 12 m del eje sobre los 8 m');
    if (esq && N.step && N.step.type === 'eje') out.refs.push('Art. 7 inc. c (Ord. 12596): en esquina, hasta 20 m desde la intersección de las LM se construye sobre la LM hasta la altura máxima');
    if (esq && Math.max(a, L.a2 || 0) > 20 + EPS) out.warns.push('Esquina con un frente mayor a 20 m: los beneficios de esquina (Arts. 7 inc. c y 10, Ord. 12596) alcanzan solo los primeros 20 m desde la intersección. El cálculo los aplicó a todo el lote.');
    if (esq && S <= 250 + EPS && N.fot && N.cap3) {
      out.alt35 = { fot: N.fot * 1.5, total: N.fot * 1.5 * S };
      out.notes.push('Art. 35 (Ord. 12596): por ser esquina de hasta 250 m², el FOT puede subir hasta 50% (FOT ' + fmt(N.fot * 1.5) + ', hasta ' + fmt(Math.round(N.fot * 1.5 * S)) + ' m²) con obras complementarias a cargo del propietario (Dec. 1883/19, Ord. 11272). El perfil y las alturas siguen limitando.');
    }
    if (N.fixedFront) out.refs.push('Retiro de frente: ' + fmt(N.fixedFront) + ' m');
    if (backFixed) out.refs.push('Retiro de fondo: ' + fmt(backFixed) + ' m');
    if (L.cmOn && L.lfi) out.refs.push('Centro de manzana: línea de frente interno a ' + fmt(L.lfi) + ' m de la LM');
    if (assumed45) out.warns.push('La capa no detalla cómo se pasa de ' + fmt(N.hLM) + ' m a ' + fmt(N.hMax) + ' m; se asumió un plano a 45° desde la fachada. Verificar con el gráfico del perfil.');
    if (N.latNote) out.warns.push(N.latNote);
    if (N.unlimited) out.notes.push('Altura sin limitación: el techo lo pone el FOT.');
    N.notes.forEach(function (t) { out.notes.push(t); });
    if (N.fuente === '8256' && ['C3', 'D', 'E'].indexOf(N.perfil) >= 0 && N.fot) out.notes.push('Art. 33 bis (Ord. 12483): en C3, D y E no computan para el FOT las cocheras comunes de planta baja ni el 50% de escaleras, balcones, galerías y pasillos con un lado abierto. La superficie cubierta real puede superar la cifra de arriba.');
    if (N.cap4) out.notes.push('Art. 40 bis (Ord. 12596): en esta zona el subsuelo cuenta para el FOS y el resto del terreno debe quedar absorbente.');
    if (N.cap4 && ['F1', 'F2', 'F3', 'F4'].indexOf(N.perfil) >= 0) {
      const okCol = L.patron === 'Id' || S >= 2500 - EPS;
      out.notes.push('Vivienda colectiva en ' + N.perfil + ': solo en parcelas frentistas a vías con patrón Id de la Ord. 8133 o de 2.500 m² o más, con FOS 40%, 1 unidad cada 180 m² y separación entre bloques de 3/7 de la altura (mín. 4 m).' + (okCol ? ' Este lote califica: ~' + fmt(Math.round(Math.min(0.4 * S * Math.min(3, Math.floor((N.hMax || 10.5) / hp + EPS)), N.fot ? N.fot * S : Infinity))) + ' m² y ' + roundUF(S / 180) + ' unidades como referencia.' : ''));
    }
    if (N.fuente === '8256' && !N.convenio) out.notes.push('Art. 16 (Ord. 12596): sobre la altura máxima solo se admiten tanques, salas de máquinas, escaleras y un nivel de usos comunes (SUM, quincho) de hasta el 50% de la planta, dentro de un plano a 45°' + (N.fuente === '8256' && /^APH/.test(N.perfil) ? '. En APH solo locales técnicos.' : '.'));
    const used = rows.filter(function (r) { return r.area > EPS; });
    Object.assign(out, {
      rows: rows, total: total, envTotal: envTotal, limit: limit,
      floors: used.length, hReached: used.length ? used[used.length - 1].zt : 0,
      pb: used.length ? used[0].area : 0, index: total / S, D: D, W: W,
      fotCap: N.fot ? N.fot * S : null
    });
    out.units = unitsCalc(N, S, total);
    const nU = Math.max(out.units.n || 0, out.units.alt ? out.units.alt.n : 0);
    if (N.fuente === '8256' && nU >= 10) out.notes.push('Art. 24 bis (Ord. 12596): con 10 o más viviendas hace falta factibilidad de localización de Planeamiento, 1 cochera por unidad (más 10% de cortesía) y, en terrenos de menos de 15.000 m² resueltos como conjunto, 15% de espacio verde común.');
    return out;
  }

  function fmt(x) { return (Math.round(x * 100) / 100).toLocaleString('es-AR', { maximumFractionDigits: 2 }); }

  // ---------------------------------------------------------------- fraccionamiento
  function fraccionamiento(p, S, a) {
    if (!p) return null;
    const fm = num(p.frente), sm = num(p.superficie);
    const r = { zona: str(p.zonificacion), sector: str(p.sector), desc: str(p.descripcion), frenteMin: fm, supMin: sm,
      planFrente: num(p.plan_vivienda_frente), planSup: num(p.plan_vivienda_superficie), antecedentes: str(p.antecedentes), obs: str(p.observaciones), excepciones: str(p.excepciones) };
    if (sm && S) {
      r.bajoMinimo = S < sm - EPS;
      const nS = Math.floor(S / sm + 1e-9), nF = fm && a ? Math.floor(a / fm + 1e-9) : nS;
      r.subdiv = Math.min(nS, nF);
    }
    return r;
  }

  // ---------------------------------------------------------------- ordenanzas
  const ORD_INFO = {
    '8256': 'Ocupación del suelo en el ejido municipal',
    '8057': 'Ocupación del suelo y preservación de ámbitos históricos en el Área Central',
    '8133': 'Uso del suelo: localización de actividades industriales y asimilables',
    '8060': 'Fraccionamiento del suelo (loteos y subdivisiones)',
    '12483': 'Modificatoria de la Ord. 8256: zonas y perfiles vigentes',
    '12596': 'Modificatoria de la Ord. 8256 (esquinas, FOS 100%, unidades, FIS). Veto parcial: Dec. 4689/16',

/* ═══════ Corte esquemático ═══════ */
function Corte({ r, N, L }) {

      <line x1={X(-half)} y1={Y(0)} x2={X(-half)} y2={Y(yMax - 1)} stroke="var(--c2)" strokeDasharray="6 4 1 4" />
      <text x={X(-half) + 4} y={Y(yMax - 1) + 10} fill="var(--c2)" style={mono}>EJE</text>
      <line x1={X(0)} y1={Y(0)} x2={X(0)} y2={Y(yMax - 1)} stroke="var(--c0)" strokeDasharray="3 3" />
      <text x={X(0) + 4} y={Y(yMax - 1) + 10} fill="var(--c0)" style={mono}>LM</text>
      {step > 0 && <g><line x1={X(step)} y1={Y(0)} x2={X(step)} y2={Y(yMax - 1)} stroke="var(--ac)" strokeDasharray="2 4" /><text x={X(step) + 4} y={Y(yMax - 1) + 22} fill="var(--ac)" style={mono}>12 m del eje</text></g>}
      {L.cmOn && L.lfi && L.lfi < f && <g><line x1={X(L.lfi)} y1={Y(0)} x2={X(L.lfi)} y2={Y(yMax - 1)} stroke="var(--warn)" strokeDasharray="5 3" /><text x={X(L.lfi) + 4} y={Y(yMax - 1) + 10} fill="var(--warn)" style={mono}>LFI</text></g>}
      {N && N.hMax && <g><line x1={X(0)} y1={Y(N.hMax)} x2={X(f)} y2={Y(N.hMax)} stroke="var(--c2)" strokeDasharray="1 3" /><text x={X(f) - 4} y={Y(N.hMax) - 3} textAnchor="end" fill="var(--c2)" style={mono}>{'máx. ' + n2(N.hMax) + ' m'}</text></g>}
      <line x1={X(f)} y1={Y(0)} x2={X(f)} y2={Y(Math.min(yMax - 1, topZ + 2))} stroke="var(--c2)" />
      {rows.map(function (x) {
        const used = x.area > 1e-6;
        return <rect key={x.k} x={X(x.front)} y={Y(x.zt)} width={Math.max(0, x.depth * s)} height={(x.zt - x.zb) * s} fill={used ? 'var(--floor)' : 'none'} stroke="var(--ac)" strokeWidth={used ? 1 : 0.8} strokeDasharray={used ? null : '4 3'} />;
      })}
      {r.rows[0] && L.cmOn && L.lfi && L.lfi < f && r.rows[0].note && r.rows[0].note.indexOf('centro de manzana') >= 0 &&
        <rect x={X(L.lfi)} y={Y(Math.min(r.hp, 4))} width={(f - L.lfi) * s} height={Math.min(r.hp, 4) * s} fill="var(--floor2)" stroke="var(--ac)" strokeWidth={0.7} strokeDasharray="2 2" />}
      <line x1={X(xMin)} y1={Y(0)} x2={X(xMax)} y2={Y(0)} stroke="var(--c0)" strokeWidth={1.5} />
      {ticks.map(function (h) { return <g key={h}><line x1={pad.l - 6} y1={Y(h)} x2={pad.l - 2} y2={Y(h)} stroke="var(--c2)" /><text x={pad.l - 9} y={Y(h) + 3.5} textAnchor="end" fill="var(--c2)" style={mono}>{h}</text></g>; })}
      <text x={X(-half / 2)} y={Y(0) + 18} textAnchor="middle" fill="var(--c2)" style={mono}>{'½ calle ' + nf(W, 1)}</text>
      <text x={X(f / 2)} y={Y(0) + 18} textAnchor="middle" fill="var(--c2)" style={mono}>{'fondo ' + n2(f) + ' m'}</text>
    </svg>
  );
}

    if (!M.local) return N0;
    const np = v.np || {};
    const pos = function (x) { const n = num(x); return isFinite(n) && n > 0 ? n : null; };
    const meta = N0 ? N0.meta : { zona: '', ord: '' };
    const Nm = normaLocal({ fos: pos(np.fos), fot: pos(np.fot), hMax: pos(np.hMax), pisos: pos(np.pisos), rf: pos(np.rf), rfo: pos(np.rfo) }, meta);

// Avisos de normas que cambiaron la zonificación y que la capa oficial todavía no cita
function AvisosNorma({ M }) {
  const dg = React.useContext(DigCtx);

  const muni = M.pp ? nomMuni(M.pp.Nomenclatura) : '';
  const out = [];
  dg.marco.forEach(function (g) {
    g.items.forEach(function (it) {
      if (it.poly && E.inside([M.D.lon, M.D.lat], it.poly)) {
        const d0 = digDoc(dg, it.k);
        out.push(<div key={it.k + 'p'} className="alert info">{it.aviso || ('El lote parece estar dentro del ámbito de la ' + it.k + '.')} {d0 && <DocLinks d={d0} small />}</div>);

      }
      if (!it.mz || !muni) return;
      if (it.mz.some(function (m) { return muni.indexOf(m) === 0; })) {
        const d = digDoc(dg, it.k);
        out.push(<div key={it.k} className="alert">La <b>{it.k}/{d ? String(d.anio).slice(-2) : ''}</b> cambió la zonificación de esta manzana y la capa oficial todavía no la cita: los parámetros de abajo pueden estar desactualizados. {d && <DocLinks d={d} small />}</div>);
      }

  });
  return out.length ? <Fragment>{out}</Fragment> : null;
}

function classifyCat(M) {
  const D = M.D;
  M.catEn = []; M.catLin = []; M.catCerca = [];
  if (!D.cat.length) return;
  const pr = M.parcel ? E.outerRing(M.parcel.geometry) : null;
  D.cat.forEach(function (f) {
    const cr = E.outerRing(f.geometry);
    if (!pr || !cr) { M.catCerca.push(f); return; }
    const c0 = pr[0];
    const P = E.makeProj(c0[0], c0[1]);
    const A = pr.map(P.f), B = cr.map(P.f);
    const overlap = A.some(function (p) { return E.inside(p, B); }) || B.some(function (p) { return E.inside(p, A); });
    // área en común aproximada: si comparten nomenclatura, es la misma parcela
    const same = S_(f.properties.nc_muni) && S_(f.properties.nc_muni) === nomMuni(M.pp && M.pp.Nomenclatura);
    if (same || overlap) { M.catEn.push(f); return; }
    let dmin = Infinity;
    A.forEach(function (p) { B.forEach(function (q) { dmin = Math.min(dmin, Math.hypot(p[0] - q[0], p[1] - q[1])); }); });
    if (dmin < 2.5) M.catLin.push(f); else M.catCerca.push(f);
  });
}

/* ═══════ Resumen ═══════ */
function resumen(M) {
  const pp = M.pp, r = M.cabida, N = M.cabidaN, L = M.cabidaL || {};
  const t = [];
  const c = M.city || CORDOBA;
  t.push('NORMATIVA Y CABIDA — ' + c.nombre + (M.local ? ' (nivel ' + c.nivel + ': ' + NIVELES[c.nivel][0].toLowerCase() + ')' : ''));
  t.push(pp ? nomCorta(pp) + (pp._fuente ? ' · ' + S_(pp.desig_oficial) : ' · cuenta ' + pp.Nro_Cuenta) : 'Punto ' + M.D.lat.toFixed(6) + ', ' + M.D.lon.toFixed(6));
  if (pp) t.push('Superficie ' + nf(M.det.S, 2) + ' m² · frente ' + n2(L.a) + ' m · fondo ' + n2(L.f) + ' m · calle ' + nf(L.W, 1) + ' m' + (L.esq ? ' · esquina' : ''));
  if (N) t.push('Zona: ' + N.etiqueta + ' (' + (N.ordModif || N.ordOriginal) + ') · FOS ' + (N.fos != null ? nf(N.fos * 100) + '%' : '—') + ' · FOT ' + (N.fot != null ? nf(N.fot, 2) : '—') + ' · altura ' + (N.hMax ? n2(N.hMax) + ' m' : 'sin límite'));
  if (r && !r.error) {
    t.push('Cabida máxima estimada: ' + nf(r.total) + ' m² (' + (r.floors <= 1 ? 'PB' : 'PB + ' + (r.floors - 1)) + ', ' + n2(r.hReached) + ' m, índice ' + n2(r.index) + ')');
    t.push('Unidades: ' + r.units.label + (r.units.txt ? ' (' + r.units.txt + ')' : ''));
  }
  const D = M.D;
  if (D.uso[0]) t.push('Uso del suelo: patrón ' + S_(D.uso[0].properties.patron) + ' (Ord. 8133)');
  if (M.fracc) t.push('Fraccionamiento: zona ' + S_(M.fracc.zonificacion) + ', mínimo ' + nf(E.num(M.fracc.superficie)) + ' m² / frente ' + nf(E.num(M.fracc.frente)) + ' m (Ord. 8060)');
  if (D.app[0]) t.push('Patrimonio: ' + S_(D.app[0].properties.nombre_app));
  if (D.arq[0]) t.push('Área arqueológica: ' + S_(D.arq[0].properties.escalas));
  if (M.convenioSinParam) t.push('Convenio urbanístico: ' + M.convenioSinParam.ordModif);
  t.push(M.local ? 'Fuente: ' + fuenteTxt(M.city) + '; parámetros revisados a mano. Estimación preliminar, verificar con el código urbano y la visación municipal.' : 'Fuente: capas oficiales IDECOR / Municipalidad de Córdoba. Estimación preliminar, verificar con visación municipal.');
  t.push(location.origin + location.pathname + '#' + M.D.lat.toFixed(6) + ',' + M.D.lon.toFixed(6));
  return t.join('\n');
}

/* ═══════ Mapa ═══════ */
function MapView({ onPick, M, overlay, active, focus, city, draw, drawPts, onDrawPt }) {
  city = city || CORDOBA;
  const el = useRef(null), mapRef = useRef(null), grp = useRef(null), ovl = useRef(null), dgrp = useRef(null);
  // En modo dibujo el clic agrega un vértice en lugar de consultar el punto
  const pickRef = useRef(onPick);
  pickRef.current = draw ? function (lat, lon) { onDrawPt([lat, lon]); } : onPick;
  useEffect(function () {
    const map = L.map(el.current, { zoomControl: true }).setView(city.c, city.z || 13);
    const base = baseLayer('gris').addTo(map);
    const argen = baseLayer('argenmap'), osm = baseLayer('osm'), sat = baseLayer('sat');
    const w = function (layer, extra) { return L.tileLayer.wms(WMS, Object.assign({ layers: 'idecor:' + layer, format: 'image/png', transparent: true, version: '1.1.1', attribution: esLocal(city) ? 'IDECOR' : 'IDECOR · Municipalidad de Córdoba' }, extra || {})); };
    if (esLocal(city)) {
      // Interior: catastro provincial y, si la localidad está en la capa provincial, su zonificación
      let ov;
      if (provDe(city) === 'salta') {
        const F = fuenteCat(city);
        const ws = function (url, layer, extra) { return L.tileLayer.wms(url, Object.assign({ layers: layer, format: 'image/png', transparent: true, version: '1.1.1' }, extra)); };
        ov = {};
        if (city.cpua) ov['Distritos CPUA 2025'] = ws(SALTA_MUNI + 'wms', CPUA_LAYER, { opacity: 0.45, attribution: 'IDEMSa · Municipalidad de Salta' }).addTo(map);
        ov['Parcelas'] = ws(F.wms, F.par, { minZoom: 16, opacity: 0.85, attribution: 'IDESA · Provincia de Salta' }).addTo(map);
      } else {
        ov = { 'Parcelas': w('parcelas', { minZoom: 16, opacity: 0.85 }).addTo(map) };
        const mcp = muniCiudad(city);
        if (mcp && mcp.parcelas) ov['Parcelas municipales'] = L.tileLayer.wms(WMS, { layers: mcp.parcelas.l, format: 'image/png', transparent: true, version: '1.1.1', minZoom: 16, opacity: 0.7, attribution: 'IDECOR Ciudades' }).addTo(map);
        if (city.nu) ov['Ocupación del suelo (provincial)'] = w(NU_LAYER, { opacity: 0.45 }).addTo(map);
      }
      // Planos de la municipalidad: el primero de zonificación se prende si la ciudad no está en la capa provincial
      const mc = muniCiudad(city);
      if (mc && mc.capas) {
        let prendida = !!city.nu;
        mc.capas.forEach(function (c) {

    }
    const zon = w('CBA_Ordenanza_8256', { opacity: 0.45 }).addTo(map);
    const par = w('parcelas', { minZoom: 17, opacity: 0.85 }).addTo(map);
    const cm = w('CBA_Centro_de_Manzana_8256', { opacity: 0.5 });

    L.control.scale({ imperial: false }).addTo(map);
    grp.current = L.layerGroup().addTo(map);
    map.on('click', function (e) { pickRef.current(e.latlng.lat, e.latlng.lng); });
    mapRef.current = map;
    return function () { map.remove(); };
  }, []);
  useEffect(function () { if (active && mapRef.current) setTimeout(function () { mapRef.current.invalidateSize(); }, 50); }, [active]);
  useEffect(function () { if (focus && mapRef.current) mapRef.current.setView([focus.lat, focus.lon], 18); }, [focus]);
  useEffect(function () {
    const map = mapRef.current;

    const g = dgrp.current; g.clearLayers();

    if (drawPts.length >= 3) L.polygon(drawPts, { color: col, weight: 2, dashArray: '5 4', fillOpacity: 0.15 }).addTo(g);
    else L.polyline(drawPts, { color: col, weight: 2, dashArray: '5 4' }).addTo(g);
    drawPts.forEach(function (p) { L.circleMarker(p, { radius: 5, color: col, weight: 2, fillColor: '#fff', fillOpacity: 1 }).addTo(g); });
  }, [draw, drawPts]);
  useEffect(function () {
    const map = mapRef.current, g = grp.current;
    if (!map || !g) return;
    g.clearLayers();
    if (!M) return;

    L.circleMarker([D.lat, D.lon], { radius: 4, color: '#FB7520', weight: 2, fillColor: '#fff', fillOpacity: 1 }).addTo(g);
    if (M.mz) L.geoJSON(M.mz.geometry, { style: { color: '#28283D', weight: 1.2, opacity: 0.7, dashArray: '4 4', fill: false } }).addTo(g);

      if (M.geo) {

        if (M.geo.rayLL) L.polyline([[M.geo.rayLL[0][1], M.geo.rayLL[0][0]], [M.geo.rayLL[1][1], M.geo.rayLL[1][0]]], { color: '#1a1f2e', weight: 1.5, dashArray: '3 3' }).bindTooltip('calle ≈ ' + nf(M.geo.anchoCalle, 1) + ' m', { permanent: true, className: 'calle', direction: 'center' }).addTo(g);

  return <div className="mapwrap"><div id="map" ref={el}></div>{!M && <div className="maphint">Tocá un lote en el mapa o buscalo arriba</div>}</div>;
