    if (N.fuente === '8256' && N.perfil === 'C2') N.wideW = 20;
    return N;
  }

  function parseUnits(t) {
    t = str(t);
    const u = { txt: t };
    let m;
    if (!t) return u;
    if ((m = t.match(/1\s*(?:cada|c\/)\s*(\d+)\s*m(?:²|2)\s*(?:de|del)?\s*(?:la\s*)?Superficie de Parcela/i))) u.perS = pnum(m[1]);
    if ((m = t.match(/1\s*(?:cada|c\/)\s*(\d+)\s*m(?:²|2)\s*del FOT/i))) u.perFOT = pnum(m[1]);
    if ((m = t.match(/1\s*cada\s*(\d+)\s*m(?:²|2)\s*ubicadas por dentro del per[ií]metro de Av\.? Circun/i))) u.perS_CV = pnum(m[1]);
    if ((m = t.match(/hasta (\d+)/i))) u.max = pnum(m[1]);
    if (/UNA POR PARCELA ACCESORIA/i.test(t)) u.accesoria = true;
    if (/1 Viv(ienda)? por parcela/i.test(t)) u.max = 1;
    return u;
  }

  // Art. 42 (Ord. 12596): decimales ≥ 0,50 suman una unidad
  function roundUF(x) { const i = Math.floor(x + 1e-9); return (x - i) >= 0.5 - 1e-9 ? i + 1 : i; }
  const NO_MIN2 = new Set(['L', 'N', 'N1', 'M']);
  function unitsCalc(N, S, total) {
    const u = N.units || {};
    const z = N.perfil;
    const min2 = N.fuente === '8256' && !NO_MIN2.has(z); // Art. 26: 2 UF en toda parcela salvo L, N, N1 y M
    if (u.accesoria) return { n: 1, label: '1 accesoria', txt: 'Una vivienda por parcela, accesoria al uso industrial' };
    if (u.max && !u.perS && !u.perFOT) return { n: u.max, label: String(u.max), txt: u.txt };
    if (u.perS || u.perFOT) {
      const base = u.perS ? S / u.perS : (N.fot ? N.fot * S / u.perFOT : 0);
      let n = Math.max(1, roundUF(base));
      const parts = [u.perS ? '1 cada ' + u.perS + ' m² de parcela' : '1 cada ' + u.perFOT + ' m² del FOT'];
      if (u.max && n > u.max) { n = u.max; parts.push('tope ' + u.max); }
      if (min2 && n < 2) { n = 2; parts.push('mínimo 2 por Art. 26'); }
      if (base % 1 >= 0.5 - 1e-9 && n > 1) parts.push('redondeo del Art. 42');
      const r = { n: n, label: String(n), txt: parts.join(' · ') };
      // +25% con factibilidad cloacal (Art. 26; excepciones del Dec. 1883/19)
      const noBonus = (z === 'F3' && u.perS === 100) || (['F4', 'G2', 'G3', 'H2'].indexOf(z) >= 0 && !!u.perFOT);
      if (u.perS_CV) {
        // F3 (Ord. 12596): 1 cada 100 m² con máximo de 5 unidades, dentro de Circunvalación y con factibilidad cloacal; no rige en áreas de protección patrimonial ni catalogados
        const capCV = z === 'F3' ? 5 : null;
        let nCV = roundUF(S / u.perS_CV); if (capCV && nCV > capCV) nCV = capCV;
        r.alt = { n: Math.max(n, nCV), txt: '1 cada ' + u.perS_CV + ' m² dentro de Av. Circunvalación con factibilidad cloacal' + (capCV ? ' (máximo ' + capCV + ', Ord. 12596)' : '') };
      }
      else if (u.perFOT && u.perS && N.fot) r.alt = { n: roundUF(N.fot * S / u.perFOT), txt: '1 cada ' + u.perFOT + ' m² del FOT con factibilidad de cloacas' };
      else if (!noBonus && N.fuente === '8256') r.alt = { n: Math.max(n, roundUF(base * 1.25)), txt: 'hasta +25% con factibilidad cloacal y obras complementarias (Art. 26)' };
      return r;
    }
    if (min2) return { n: null, label: 'Sin tope', txt: u.txt || 'La capa no fija tope de unidades: lo define la superficie construible (mínimo 2 por Art. 26).' };
    return { n: null, label: 'Sin tope', txt: u.txt || 'La capa no fija tope de unidades: lo define la superficie construible.' };
  }

  // ---------------------------------------------------------------- cabida
  /**
   * N: norma (parseNorma). L: lote {S, a, f, W, esq, cmOn, lfi, min8060S}. o: {hp, minD, leExtra}
   */
  function cabida(N, L, o) {
    o = o || {};
    const out = { rows: [], notes: [], refs: [], warns: [] };
    if (!N) { out.error = 'Sin norma de ocupación para este punto.'; return out; }
    if (N.noCalc) { out.error = N.noCalcReason; return out; }
    const S = L.S, a = L.a, f = L.f;
    if (!(S > 0 && a > 0 && f > 0)) { out.error = 'Faltan superficie, frente o fondo del lote.'; return out; }
    const W = L.W > 0 ? L.W : 16;
    const esq = !!L.esq;
    if (N.wideW && N.hMax) {
      if (W >= N.wideW - EPS) {
        N = Object.assign({}, N, { hLM: N.hMax, step: null, plano45: 'NO' });
        out.refs.push('Calle de ' + fmt(W) + ' m (≥ ' + N.wideW + ' m): la fachada sube sobre la LM hasta ' + fmt(N.hMax) + ' m, sin retiro ni plano a 45° (Ord. 12483, zona ' + N.perfil + ')');
      } else {
        N = Object.assign({}, N, { plano45: 'NO' });
        out.refs.push('Calle de ' + fmt(W) + ' m (< ' + N.wideW + ' m): perfil escalonado hasta ' + fmt(N.hMax) + ' m. Con calle de ' + N.wideW + ' m o más, o frente a espacio verde, la fachada podría subir derecho.');
      }
    }
    const hp = o.hp > 0 ? o.hp : (N.hpAuto || 3);
    const minD = o.minD > 0 ? o.minD : 4;
    const leX = o.leExtra > 0 ? o.leExtra : 0;
    out.hp = hp;
    const D = L.cmOn && L.lfi ? Math.min(f, L.lfi) : f;
    const cmExtra = (L.cmOn && L.lfi && f > L.lfi) ? 0.25 * a * (f - L.lfi) : 0;
    const whys = new Set();

    function fosAt(zt) {
      let v = N.fos;
      if (N.fosBySup) { v = S < N.fosBySup.lim ? N.fosBySup.a : N.fosBySup.b; whys.add('FOS según superficie de parcela (' + Math.round(v * 100) + '%)'); }
      if (N.fosByFrente) { v = a < N.fosByFrente.lim ? N.fosByFrente.a : N.fosByFrente.b; whys.add('FOS según frente (' + Math.round(v * 100) + '%)'); }
      if (N.fosMin8060 && L.min8060S && S < L.min8060S) { v = N.fosMin8060; whys.add('Lote menor al mínimo de la Ord. 8060 → FOS 80%'); }
      if (N.fosByH) v = zt <= N.fosByH.upto + EPS ? N.fosByH.a : N.fosByH.b;
      if (v == null) { v = 1; whys.add('La capa no trae FOS: se tomó 100% y limita el FOT'); }
      if (N.fosEsq100 && esq) { v = 1; whys.add('FOS 100% en esquina (verificar desarrollo ≤ 25% del frente de manzana)'); }
      if (N.cap3) {
        if (esq && (Math.min(a, L.a2 || a) <= 12 || S <= 250)) { v = 1; whys.add('Art. 35 (Ord. 12596): esquina con un frente ≤ 12 m o superficie ≤ 250 m² → FOS 100%'); }
        else if (!esq && f <= 15) { v = 1; whys.add('Art. 35 (Ord. 12596): entre medianeras con fondo ≤ 15 m → FOS 100%'); }
        else if (esq && zt <= 8 + EPS) { v = 1; whys.add('Art. 36: esquina → FOS 100% hasta 8 m (PB y 1 piso)'); }
      }
      return v;
    }
    function latFor(H) {
      const lt = N.lat; let l = 0, r = 0;
      if (lt) {
        if (lt.kind === 'fijo') { l = lt.d; r = lt.d; }
        else if (lt.kind === 'zonaL') { const d = Math.max(lt.min, H / 3); if (a > 60) { l = d; r = d; } else if (a >= 25) l = d; }
        else if (lt.kind === 'escalonado') { if (a >= lt.allFrom) { l = r = Math.max(lt.allMin, H / 3); } else if (a >= lt.oneFrom) l = Math.max(lt.oneMin, H / 3); }
        else if (lt.kind === 'uno') { if (a > lt.from) l = Math.max(lt.min, H / 3); }
      }
      if (esq && N.latCalle) l = Math.max(l, N.latCalle);
      return l + r;
    }
    const art34 = N.cap3 && !esq && W < 10;
    const stepEje = esq ? 0 : Math.max(0, 12 - W / 2);
    const front0 = (N.fixedFront || 0) + leX;
    const backFixed = (N.backExceptEsq && esq) ? 0 : (N.back || 0);
    let assumed45 = false;

    function frontAt(zt) {
      let fr = front0;
      const s = N.step;
      if (s) {
        if (s.type === 'eje' && zt > s.from + EPS) fr = Math.max(fr, Math.max(0, s.d - W / 2) * (esq ? 0 : 1) + leX);
        if (s.type === 'le' && zt > s.from + EPS) fr = Math.max(fr, front0 + s.d);
        if (s.type === 'p45' && zt > s.from + EPS) fr = Math.max(fr, front0 + (zt - s.from));
      } else if (N.hLM && N.hMax && N.hMax > N.hLM + EPS && zt > N.hLM + EPS) {
        fr = Math.max(fr, front0 + (zt - N.hLM)); assumed45 = true;
      }
      if (art34 && zt > 8 + EPS) fr = Math.max(fr, stepEje);
      return fr;
    }

    function runPerfil(latTotal) {
      const rows = [];
      const cap = N.unlimited ? 90 : (N.tower ? (N.hLM || 0) : N.hMax);
      for (let k = 0; k < 40; k++) {
        const zb = k * hp, zt = zb + hp;
        let fr, bk = backFixed, above = false;
        if (zt > cap + EPS) {
          if (N.plano45 === 'SI' && N.hMax) {
            if (rows.filter(function (r) { return r.zt > cap + EPS; }).length >= 2) break; // hasta 2 plantas útiles (zonas A y B)
            above = true;
            fr = Math.max(frontAt(Math.min(zt, N.hMax)), front0 + (zt - (N.hLM || N.hMax)));
            bk = backFixed + (zt - N.hMax);
          } else break;
        } else fr = frontAt(zt);
        const depth = D - fr - bk;
        const width = a - latTotal;
        if (depth < minD - EPS || width < 3) break;
        let foot = width * depth, note = above ? 'Plano límite a 45°' : '';
        if (k === 0 && cmExtra > 0 && hp <= 4 + EPS) { foot += cmExtra; note = 'Incluye 25% del centro de manzana (hasta 4 m)'; }
        const fos = fosAt(zt), capA = fos * S;
        const area = Math.min(foot, capA);
        rows.push({ k: k, zb: zb, zt: zt, front: fr, back: bk, depth: depth, width: width, foot: foot, fos: fos, area: area, by: foot > capA + EPS ? 'FOS' : (above ? '45°' : 'Perfil'), note: note });
      }
      return rows;
    }
    function runTower() {
      // basamento entre medianeras hasta hLM; torre en perímetro libre hasta hPerim con retiros de 1/5 de h a medianeras y fondo
      const rows = runPerfil(0);
      const base = rows.length;
      let best = null;
      const nMaxT = Math.floor((N.hPerim + EPS) / hp);
      for (let n = base + 1; n <= nMaxT; n++) {
        const H = n * hp, r = H / 5;
        const w = a - 2 * r, d = Math.min(D, f - r) - frontAt(H);
        if (w < 6 || d < minD) continue;
        const per = Math.min(w * d, fosAt(H) * S);
        best = { n: n, H: H, r: r, w: w, d: d, per: per };
      }
      if (best) {
        for (let k = base; k < best.n; k++) {
          const zt = (k + 1) * hp;
          const per = Math.min(best.w * best.d, fosAt(zt) * S);
          rows.push({ k: k, zb: k * hp, zt: zt, front: frontAt(zt), back: f - best.d - frontAt(zt), depth: best.d, width: best.w, foot: best.w * best.d, fos: fosAt(zt), area: per, by: 'Torre', note: 'Torre: retiro de ' + best.r.toFixed(1) + ' m a medianeras' });
        }
        out.refs.push('Torre en perímetro libre hasta ' + fmt(best.H) + ' m con retiros de 1/5 de la altura a ejes medianeros');
      }
      return rows;
    }

    const sumA = function (rs) { return rs.reduce(function (s, r) { return s + r.area; }, 0); };
    const fotCap = N.fot ? N.fot * S : Infinity;
    let rows, envRows, latUsed = 0;
    if (N.tower) {
      rows = runTower(); envRows = rows;
    } else {
      // elegir la cantidad de plantas que maximiza la superficie (los retiros laterales dependen de la altura)
      const hasLat = !!N.lat || (esq && N.latCalle);
      const nAll = runPerfil(0).length;
      let best = null;
      for (let n = 1; n <= Math.max(1, nAll); n++) {
        const lat = hasLat ? latFor(n * hp) : 0;
        const rs = runPerfil(lat).slice(0, n);
        const tot = Math.min(sumA(rs), fotCap);
        if (!best || tot > best.tot + 0.01) best = { n: n, lat: lat, tot: tot };
        if (!hasLat && rs.length < n) break;
      }
      latUsed = best ? best.lat : 0;
      envRows = runPerfil(latUsed);
      rows = envRows.slice(0, best ? best.n : 0).map(function (r) { return Object.assign({}, r); });
      if (!N.unlimited) envRows.slice(rows.length, rows.length + 2).forEach(function (r) { rows.push(Object.assign({}, r, { area: 0, by: 'FOT', note: 'No se usa: el FOT ya se agotó' })); });
      if (latUsed > 0) out.refs.push((esq && N.latCalle && !N.lat ? 'Retiro lateral sobre calle pública: ' : 'Retiros laterales aplicados: ') + fmt(latUsed) + ' m en total');
    }
    let total = sumA(rows);
    const envTotal = N.unlimited ? Math.min(sumA(envRows), fotCap) : sumA(envRows);
    let limit = rows.length && rows.filter(function (r) { return r.area > EPS; }).every(function (r) { return r.by === 'FOS'; }) ? 'FOS' : 'Perfil';
    if (N.fot) {
      if (total > fotCap + EPS || (envTotal > fotCap + EPS)) {
        let left = fotCap;
        rows.forEach(function (r) {
          if (r.by === 'FOT' && r.area === 0) return;
          const use = Math.min(r.area, Math.max(0, left));
          if (use < r.area - EPS) { r.by = 'FOT'; r.note = use > EPS ? 'Planta parcial: se agota el FOT' : 'No se usa: el FOT ya se agotó'; }
          r.area = use; left -= use;
        });
        total = sumA(rows); limit = 'FOT';
      }
    }
    if (N.unlimited && N.fot && limit !== 'FOT') limit = 'Retiros';
    if (rows.some(function (r) { return r.by === '45°' || r.note === 'Plano límite a 45°'; })) {
      const extra = rows.filter(function (r) { return r.note === 'Plano límite a 45°'; }).reduce(function (s, r) { return s + r.area; }, 0);
      if (extra > EPS) out.refs.push('Incluye ' + fmt(Math.round(extra)) + ' m² sobre la altura máxima dentro del plano límite a 45°');
    }
    // perímetro libre alternativo (zona B y similares)
    if (!N.tower && N.hPerim && N.hPerim > (N.hMax || 0)) {
      let best = null;
      const nMax = Math.floor((N.hPerim + EPS) / hp);
      for (let n = 1; n <= nMax; n++) {
        const H = n * hp, r = H / 5;
        const w = a - 2 * r, d = Math.min(D, f - r) - front0;
        if (w < 6 || d < minD) continue;
        let tot = 0;
        for (let k = 0; k < n; k++) tot += Math.min(w * d, fosAt((k + 1) * hp) * S);
        if (N.fot) tot = Math.min(tot, N.fot * S);
        if (!best || tot > best.tot + EPS) best = { n: n, H: H, r: r, tot: tot };
      }
      if (best) out.alt = { label: 'Perímetro libre (' + best.n + ' plantas, ' + fmt(best.H) + ' m, retiros ' + fmt(best.r) + ' m)', total: best.tot, approx: N.fuente !== '8256' || N.perfil !== 'B' };
      else out.notes.push('Perímetro libre hasta ' + fmt(N.hPerim) + ' m no es viable: el frente no deja 6 m libres tras los retiros de 1/5 de la altura.');
    }
    whys.forEach(function (w) { out.refs.push(w); });
    if (N.step && N.step.type === 'eje' && !esq) out.refs.push('Retiro a ' + fmt(N.step.d) + ' m del eje de calle desde los ' + fmt(N.step.from) + ' m: ' + fmt(stepEje) + ' m desde la LM con calle de ' + fmt(W) + ' m');
    if (N.step && N.step.type === 'le') out.refs.push('Retiro de ' + fmt(N.step.d) + ' m desde los ' + fmt(N.step.from) + ' m de altura');
    if (N.step && N.step.type === 'p45') out.refs.push('Plano a 45° desde los ' + fmt(N.step.from) + ' m');
    if (art34) out.refs.push('Art. 34: calle de menos de 10 m → retiro a 12 m del eje sobre los 8 m');
    if (esq && N.step && N.step.type === 'eje') out.refs.push('Art. 7 inc. c (Ord. 12596): en esquina, hasta 20 m desde la intersección de las LM se construye sobre la LM hasta la altura máxima');
    if (esq && Math.max(a, L.a2 || 0) > 20 + EPS) out.warns.push('Esquina con un frente mayor a 20 m: los beneficios de esquina (Arts. 7 inc. c y 10, Ord. 12596) alcanzan solo los primeros 20 m desde la intersección. El cálculo los aplicó a todo el lote.');
    if (esq && S <= 250 + EPS && N.fot && N.cap3) {
      out.alt35 = { fot: N.fot * 1.5, total: N.fot * 1.5 * S };
      out.notes.push('Art. 35 (Ord. 12596): por ser esquina de hasta 250 m², el FOT puede subir hasta 50% (FOT ' + fmt(N.fot * 1.5) + ', hasta ' + fmt(Math.round(N.fot * 1.5 * S)) + ' m²) con obras complementarias a cargo del propietario (Dec. 1883/19, Ord. 11272). El perfil y las alturas siguen limitando.');
    }
    if (N.fixedFront) out.refs.push('Retiro de frente: ' + fmt(N.fixedFront) + ' m');
    if (backFixed) out.refs.push('Retiro de fondo: ' + fmt(backFixed) + ' m');
    if (L.cmOn && L.lfi) out.refs.push('Centro de manzana: línea de frente interno a ' + fmt(L.lfi) + ' m de la LM');
    if (assumed45) out.warns.push('La capa no detalla cómo se pasa de ' + fmt(N.hLM) + ' m a ' + fmt(N.hMax) + ' m; se asumió un plano a 45° desde la fachada. Verificar con el gráfico del perfil.');
    if (N.latNote) out.warns.push(N.latNote);
    if (N.unlimited) out.notes.push('Altura sin limitación: el techo lo pone el FOT.');
    N.notes.forEach(function (t) { out.notes.push(t); });
    if (N.fuente === '8256' && ['C3', 'D', 'E'].indexOf(N.perfil) >= 0 && N.fot) out.notes.push('Art. 33 bis (Ord. 12483): en C3, D y E no computan para el FOT las cocheras comunes de planta baja ni el 50% de escaleras, balcones, galerías y pasillos con un lado abierto. La superficie cubierta real puede superar la cifra de arriba.');
    if (N.cap4) out.notes.push('Art. 40 bis (Ord. 12596): en esta zona el subsuelo cuenta para el FOS y el resto del terreno debe quedar absorbente.');
    if (N.cap4 && ['F1', 'F2', 'F3', 'F4'].indexOf(N.perfil) >= 0) {
      const okCol = L.patron === 'Id' || S >= 2500 - EPS;
      out.notes.push('Vivienda colectiva en ' + N.perfil + ': solo en parcelas frentistas a vías con patrón Id de la Ord. 8133 o de 2.500 m² o más, con FOS 40%, 1 unidad cada 180 m² y separación entre bloques de 3/7 de la altura (mín. 4 m).' + (okCol ? ' Este lote califica: ~' + fmt(Math.round(Math.min(0.4 * S * Math.min(3, Math.floor((N.hMax || 10.5) / hp + EPS)), N.fot ? N.fot * S : Infinity))) + ' m² y ' + roundUF(S / 180) + ' unidades como referencia.' : ''));
    }
    if (N.fuente === '8256' && !N.convenio) out.notes.push('Art. 16 (Ord. 12596): sobre la altura máxima solo se admiten tanques, salas de máquinas, escaleras y un nivel de usos comunes (SUM, quincho) de hasta el 50% de la planta, dentro de un plano a 45°' + (N.fuente === '8256' && /^APH/.test(N.perfil) ? '. En APH solo locales técnicos.' : '.'));
    const used = rows.filter(function (r) { return r.area > EPS; });
    Object.assign(out, {
      rows: rows, total: total, envTotal: envTotal, limit: limit,
      floors: used.length, hReached: used.length ? used[used.length - 1].zt : 0,
      pb: used.length ? used[0].area : 0, index: total / S, D: D, W: W,
      fotCap: N.fot ? N.fot * S : null
    });
    out.units = unitsCalc(N, S, total);
    const nU = Math.max(out.units.n || 0, out.units.alt ? out.units.alt.n : 0);
    if (N.fuente === '8256' && nU >= 10) out.notes.push('Art. 24 bis (Ord. 12596): con 10 o más viviendas hace falta factibilidad de localización de Planeamiento, 1 cochera por unidad (más 10% de cortesía) y, en terrenos de menos de 15.000 m² resueltos como conjunto, 15% de espacio verde común.');
    return out;
  }

  function fmt(x) { return (Math.round(x * 100) / 100).toLocaleString('es-AR', { maximumFractionDigits: 2 }); }

  // ---------------------------------------------------------------- fraccionamiento
  function fraccionamiento(p, S, a) {
    if (!p) return null;
    const fm = num(p.frente), sm = num(p.superficie);
    const r = { zona: str(p.zonificacion), sector: str(p.sector), desc: str(p.descripcion), frenteMin: fm, supMin: sm,
      planFrente: num(p.plan_vivienda_frente), planSup: num(p.plan_vivienda_superficie), antecedentes: str(p.antecedentes), obs: str(p.observaciones), excepciones: str(p.excepciones) };
    if (sm && S) {
      r.bajoMinimo = S < sm - EPS;
      const nS = Math.floor(S / sm + 1e-9), nF = fm && a ? Math.floor(a / fm + 1e-9) : nS;
      r.subdiv = Math.min(nS, nF);
    }
    return r;
  }

  // ---------------------------------------------------------------- ordenanzas
  const ORD_INFO = {
    '8256': 'Ocupación del suelo en el ejido municipal',
    '8057': 'Ocupación del suelo y preservación de ámbitos históricos en el Área Central',
    '8133': 'Uso del suelo: localización de actividades industriales y asimilables',
    '8060': 'Fraccionamiento del suelo (loteos y subdivisiones)',
    '12483': 'Modificatoria de la Ord. 8256: zonas y perfiles vigentes',
    '12596': 'Modificatoria de la Ord. 8256 (esquinas, FOS 100%, unidades, FIS). Veto parcial: Dec. 4689/16',
    '12116': 'Modificatoria de la Ord. 8057 (Área Central)',
    '12077': 'Convenios urbanísticos (derogada por la Ord. 13557/25)',

function buildModel(D) {

  if (D.v9089.length) add({ tipo: 'Ord.', num: '9089', anio: '' }, 'Distancia a ejes viales', 'Red vial');
  M.catEn && M.catEn.forEach(function (c) { const p = c.properties; scan(p.dmunicipal, 'Declaración patrimonial de ' + S_(p.identifica), 'Patrimonio'); });
  return Array.from(map.values()).sort(function (a, b) { return (a.tipo === b.tipo ? 0 : a.tipo === 'Ord.' ? -1 : 1) || (parseInt(a.num, 10) - parseInt(b.num, 10)); });
}

/* ═══════ Corte esquemático ═══════ */
function Corte({ r, N, L }) {
  if (!r || !r.rows || !r.rows.length) return null;
  const rows = r.rows;
  const W = r.W, half = W / 2, f = L.f;
  const xMin = -half - 1, xMax = f + 1.5;
  let topZ = 0; rows.forEach(function (x) { topZ = Math.max(topZ, x.zt); });
  if (N && N.hMax) topZ = Math.max(topZ, N.hMax);
  const yMax = Math.max(topZ, 9) + 3;
  const Wd = 640, pad = { l: 40, r: 14, t: 12, b: 28 };
  const s = Math.min((Wd - pad.l - pad.r) / (xMax - xMin), 330 / yMax);
  const Hd = Math.round(yMax * s + pad.t + pad.b);
  const X = function (x) { return pad.l + (x - xMin) * s; };
  const Y = function (y) { return pad.t + (yMax - y) * s; };
  const mono = { fontFamily: 'JetBrains Mono, monospace', fontSize: 10 };
  const ticks = []; const tk = yMax > 40 ? 10 : (yMax > 20 ? 5 : 3);
  for (let h = 0; h <= yMax - 1; h += tk) ticks.push(h);
  const step = N && N.step && N.step.type === 'eje' && !L.esq ? Math.max(0, N.step.d - half) : 0;
  return (
    <svg viewBox={'0 0 ' + Wd + ' ' + Hd} role="img" aria-label="Corte esquemático del volumen edificable">
      <rect x={X(-half)} y={Y(0)} width={half * s} height={4} fill="var(--bg2)" />
      <line x1={X(-half)} y1={Y(0)} x2={X(-half)} y2={Y(yMax - 1)} stroke="var(--c2)" strokeDasharray="6 4 1 4" />
      <text x={X(-half) + 4} y={Y(yMax - 1) + 10} fill="var(--c2)" style={mono}>EJE</text>
      <line x1={X(0)} y1={Y(0)} x2={X(0)} y2={Y(yMax - 1)} stroke="var(--c0)" strokeDasharray="3 3" />
      <text x={X(0) + 4} y={Y(yMax - 1) + 10} fill="var(--c0)" style={mono}>LM</text>
      {step > 0 && <g><line x1={X(step)} y1={Y(0)} x2={X(step)} y2={Y(yMax - 1)} stroke="var(--ac)" strokeDasharray="2 4" /><text x={X(step) + 4} y={Y(yMax - 1) + 22} fill="var(--ac)" style={mono}>12 m del eje</text></g>}
      {L.cmOn && L.lfi && L.lfi < f && <g><line x1={X(L.lfi)} y1={Y(0)} x2={X(L.lfi)} y2={Y(yMax - 1)} stroke="var(--warn)" strokeDasharray="5 3" /><text x={X(L.lfi) + 4} y={Y(yMax - 1) + 10} fill="var(--warn)" style={mono}>LFI</text></g>}
      {N && N.hMax && <g><line x1={X(0)} y1={Y(N.hMax)} x2={X(f)} y2={Y(N.hMax)} stroke="var(--c2)" strokeDasharray="1 3" /><text x={X(f) - 4} y={Y(N.hMax) - 3} textAnchor="end" fill="var(--c2)" style={mono}>{'máx. ' + n2(N.hMax) + ' m'}</text></g>}
      <line x1={X(f)} y1={Y(0)} x2={X(f)} y2={Y(Math.min(yMax - 1, topZ + 2))} stroke="var(--c2)" />
      {rows.map(function (x) {
        const used = x.area > 1e-6;
        return <rect key={x.k} x={X(x.front)} y={Y(x.zt)} width={Math.max(0, x.depth * s)} height={(x.zt - x.zb) * s} fill={used ? 'var(--floor)' : 'none'} stroke="var(--ac)" strokeWidth={used ? 1 : 0.8} strokeDasharray={used ? null : '4 3'} />;
      })}
      {r.rows[0] && L.cmOn && L.lfi && L.lfi < f && r.rows[0].note && r.rows[0].note.indexOf('centro de manzana') >= 0 &&
        <rect x={X(L.lfi)} y={Y(Math.min(r.hp, 4))} width={(f - L.lfi) * s} height={Math.min(r.hp, 4) * s} fill="var(--floor2)" stroke="var(--ac)" strokeWidth={0.7} strokeDasharray="2 2" />}
      <line x1={X(xMin)} y1={Y(0)} x2={X(xMax)} y2={Y(0)} stroke="var(--c0)" strokeWidth={1.5} />
      {ticks.map(function (h) { return <g key={h}><line x1={pad.l - 6} y1={Y(h)} x2={pad.l - 2} y2={Y(h)} stroke="var(--c2)" /><text x={pad.l - 9} y={Y(h) + 3.5} textAnchor="end" fill="var(--c2)" style={mono}>{h}</text></g>; })}
      <text x={X(-half / 2)} y={Y(0) + 18} textAnchor="middle" fill="var(--c2)" style={mono}>{'½ calle ' + nf(W, 1)}</text>
      <text x={X(f / 2)} y={Y(0) + 18} textAnchor="middle" fill="var(--c2)" style={mono}>{'fondo ' + n2(f) + ' m'}</text>
    </svg>
  );
}

/* ═══════ Tarjetas ═══════ */

}
function KV({ items }) {

}

}

const DEF = { hp: '', minD: 4, leExtra: 0 };

  const init = function () { return { S: det.S || '', a: det.a ? Math.round(det.a * 100) / 100 : '', f: det.f ? Math.round(det.f * 100) / 100 : '', W: det.W || '', esq: !!det.esq, cmOn: !!det.cmOn, lfi: det.lfi || '', hp: '', minD: 4, leExtra: 0 }; };
  const [v, setV] = useState(init);
  useEffect(function () { setV(init()); }, [M.D.t]);

  useEffect(function () { if (preset && preset.v) setV(Object.assign(init(), preset.v)); }, [preset && preset.t]);
  const set = function (k) { return function (e) { const val = e.target.type === 'checkbox' ? e.target.checked : e.target.value; setV(function (o) { const n = Object.assign({}, o); n[k] = val; return n; }); }; };
  const num = function (x) { const n = parseFloat(String(x).replace(',', '.')); return isFinite(n) ? n : NaN; };
  const L = { S: num(v.S), a: num(v.a), f: num(v.f), W: num(v.W), esq: v.esq, cmOn: v.cmOn, lfi: num(v.lfi), min8060S: det.min8060S, a2: v.esq ? det.a2 : null, patron: det.patron };
  const r = useMemo(function () { return N ? E.cabida(N, L, { hp: num(v.hp), minD: num(v.minD), leExtra: num(v.leExtra) }) : null; }, [N, v.S, v.a, v.f, v.W, v.esq, v.cmOn, v.lfi, v.hp, v.minD, v.leExtra, det.min8060S, det.a2, det.patron]);
  M.cabida = r; M.cabidaL = L; M.cabidaN = N; M.cabidaV = v; M.normaSelIdx = normaSel;
  const isDet = function (k) { return det[k] != null && String(det[k] === true ? true : (Math.round(det[k] * 100) / 100)) === String(v[k]); };
  const fld = function (k, label, unit, step) {
    const d = det[k] != null && det[k] !== '' && det[k] !== false;
    return <label className={'fld' + (!d && (k === 'S' || k === 'a' || k === 'f') ? ' man' : '')}>
      <span>{label} {d && isDet(k) ? <span className="det">· detectado</span> : null}</span>
      <span className="row"><input type="number" inputMode="decimal" step={step || '0.01'} value={v[k]} onChange={set(k)} placeholder={k === 'hp' && N ? n2(N.hpAuto || 3) : ''} /><span className="u">{unit}</span></span>
    </label>;
  };
  const used = r && r.rows ? r.rows.filter(function (x) { return x.area > 1e-6; }) : [];
  const limTxt = !r || r.error ? '' : r.limit === 'FOT' ? 'Limita el FOT' : r.limit === 'FOS' ? 'Limita el FOS' : r.limit === 'Retiros' ? 'Limitan los retiros' : 'Limita el perfil';
  return (
    <Card title="Cabida máxima" src="Cálculo con parámetros de la capa oficial" hero>
      {M.normas.length > 1 && <label className="fld" style={{ marginBottom: 10 }}>
        <span>Norma aplicada (el punto cae en {M.normas.length} polígonos)</span>
        <span className="row"><select value={normaSel != null ? normaSel : M.normas.indexOf(N)} onChange={function (e) { setNormaSel(parseInt(e.target.value, 10)); }}>
          {M.normas.map(function (n, i) { return <option key={i} value={i}>{n.etiqueta + ' · ' + (n.ordModif || n.ordOriginal || n.clave) + (n.noCalc ? ' (sin parámetros)' : '')}</option>; })}
        </select></span>
      </label>}
      {!N && <div className="alert err">No hay norma de ocupación para este punto.</div>}
      {r && r.error && <div className="alert err">{r.error}</div>}
      {r && !r.error && <Fragment>
        <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', gap: 12, flexWrap: 'wrap' }}>
          <div>
            <div className="lbl">Superficie construible estimada · {N.etiqueta}</div>
            <div className="big">{nf(r.total)}<small>m²</small></div>

        </div>

          <div className="metric"><div className="lbl">Plantas</div><div className="v">{r.floors <= 1 ? 'PB' : 'PB + ' + (r.floors - 1)}</div><div className="d">{N.pisosMax ? 'norma: ' + (N.pisosMax <= 1 ? 'PB' : 'PB + ' + (N.pisosMax - 1)) : 'según FOS y FOT'}</div></div>

        <div className="tw"><table className="t">

// Avisos de normas que cambiaron la zonificación y que la capa oficial todavía no cita
function AvisosNorma({ M }) {
  const dg = React.useContext(DigCtx);
  if (!dg) return null;
  const muni = M.pp ? nomMuni(M.pp.Nomenclatura) : '';
  const out = [];
  dg.marco.forEach(function (g) {
    g.items.forEach(function (it) {
      if (it.poly && E.inside([M.D.lon, M.D.lat], it.poly)) {
        const d0 = digDoc(dg, it.k);
        out.push(<div key={it.k + 'p'} className="alert info">{it.aviso || ('El lote parece estar dentro del ámbito de la ' + it.k + '.')} {d0 && <DocLinks d={d0} small />}</div>);
        return;
      }
      if (!it.mz || !muni) return;
      if (it.mz.some(function (m) { return muni.indexOf(m) === 0; })) {
        const d = digDoc(dg, it.k);
        out.push(<div key={it.k} className="alert">La <b>{it.k}/{d ? String(d.anio).slice(-2) : ''}</b> cambió la zonificación de esta manzana y la capa oficial todavía no la cita: los parámetros de abajo pueden estar desactualizados. {d && <DocLinks d={d} small />}</div>);
      }
    });
  });
  return out.length ? <Fragment>{out}</Fragment> : null;
}

function classifyCat(M) {
  const D = M.D;
  M.catEn = []; M.catLin = []; M.catCerca = [];
  if (!D.cat.length) return;
  const pr = M.parcel ? E.outerRing(M.parcel.geometry) : null;
  D.cat.forEach(function (f) {
    const cr = E.outerRing(f.geometry);
    if (!pr || !cr) { M.catCerca.push(f); return; }
    const c0 = pr[0];
    const P = E.makeProj(c0[0], c0[1]);
    const A = pr.map(P.f), B = cr.map(P.f);
    const overlap = A.some(function (p) { return E.inside(p, B); }) || B.some(function (p) { return E.inside(p, A); });
    // área en común aproximada: si comparten nomenclatura, es la misma parcela
    const same = S_(f.properties.nc_muni) && S_(f.properties.nc_muni) === nomMuni(M.pp && M.pp.Nomenclatura);
    if (same || overlap) { M.catEn.push(f); return; }
    let dmin = Infinity;
    A.forEach(function (p) { B.forEach(function (q) { dmin = Math.min(dmin, Math.hypot(p[0] - q[0], p[1] - q[1])); }); });
    if (dmin < 2.5) M.catLin.push(f); else M.catCerca.push(f);
  });
}

function resumen(M) {

  t.push('NORMATIVA Y CABIDA — Córdoba');
  t.push(pp ? 'Parcela ' + nomMuni(pp.Nomenclatura) + ' · cuenta ' + pp.Nro_Cuenta : 'Punto ' + M.D.lat.toFixed(6) + ', ' + M.D.lon.toFixed(6));
  if (pp) t.push('Superficie ' + nf(M.det.S, 2) + ' m² · frente ' + n2(L.a) + ' m · fondo ' + n2(L.f) + ' m · calle ' + nf(L.W, 1) + ' m' + (L.esq ? ' · esquina' : ''));
  if (N) t.push('Zona: ' + N.etiqueta + ' (' + (N.ordModif || N.ordOriginal) + ') · FOS ' + (N.fos != null ? nf(N.fos * 100) + '%' : '—') + ' · FOT ' + (N.fot != null ? nf(N.fot, 2) : '—') + ' · altura ' + (N.hMax ? n2(N.hMax) + ' m' : 'sin límite'));
  if (r && !r.error) {
    t.push('Cabida máxima estimada: ' + nf(r.total) + ' m² (' + (r.floors <= 1 ? 'PB' : 'PB + ' + (r.floors - 1)) + ', ' + n2(r.hReached) + ' m, índice ' + n2(r.index) + ')');
    t.push('Unidades: ' + r.units.label + (r.units.txt ? ' (' + r.units.txt + ')' : ''));
  }
  const D = M.D;
  if (D.uso[0]) t.push('Uso del suelo: patrón ' + S_(D.uso[0].properties.patron) + ' (Ord. 8133)');
  if (M.fracc) t.push('Fraccionamiento: zona ' + S_(M.fracc.zonificacion) + ', mínimo ' + nf(E.num(M.fracc.superficie)) + ' m² / frente ' + nf(E.num(M.fracc.frente)) + ' m (Ord. 8060)');
  if (D.app[0]) t.push('Patrimonio: ' + S_(D.app[0].properties.nombre_app));
  if (D.arq[0]) t.push('Área arqueológica: ' + S_(D.arq[0].properties.escalas));
  if (M.convenioSinParam) t.push('Convenio urbanístico: ' + M.convenioSinParam.ordModif);
  t.push('Fuente: capas oficiales IDECOR / Municipalidad de Córdoba. Estimación preliminar, verificar con visación municipal.');
  t.push(location.origin + location.pathname + '#' + M.D.lat.toFixed(6) + ',' + M.D.lon.toFixed(6));
  return t.join('\n');
}

/* ═══════ Mapa ═══════ */
function MapView({ onPick, M, overlay, active, focus }) {
  const el = useRef(null), mapRef = useRef(null), grp = useRef(null), ovl = useRef(null), pickRef = useRef(onPick);
  pickRef.current = onPick;
  useEffect(function () {
    const map = L.map(el.current, { zoomControl: true }).setView([-31.4167, -64.1833], 13);
    const base = baseLayer('gris').addTo(map);
    const argen = baseLayer('argenmap'), osm = baseLayer('osm'), sat = baseLayer('sat');
    const w = function (layer, extra) { return L.tileLayer.wms(WMS, Object.assign({ layers: 'idecor:' + layer, format: 'image/png', transparent: true, version: '1.1.1', attribution: 'IDECOR · Municipalidad de Córdoba' }, extra || {})); };
    const zon = w('CBA_Ordenanza_8256', { opacity: 0.45 }).addTo(map);
    const par = w('parcelas', { minZoom: 17, opacity: 0.85 }).addTo(map);
    const cm = w('CBA_Centro_de_Manzana_8256', { opacity: 0.5 });
    const pat = w('cba_inmuebles_catalogados', { opacity: 0.75 });
    const uso = w('CBA_Ordenanza_8133', { opacity: 0.45 });
    const lot = w('loteos_muni_aprobados', { opacity: 0.6 });
    const ecop = w('franja_ecoprod_13131', { opacity: 0.6 });
    L.control.layers({ 'Mapa gris (IGN)': base, 'Argenmap (IGN)': argen, 'Calles (OSM)': osm, 'Satélite': sat }, { 'Ocupación del suelo': zon, 'Parcelas': par, 'Centros de manzana': cm, 'Patrimonio catalogado': pat, 'Uso del suelo (8133)': uso, 'Loteos aprobados': lot, 'Franja ecoproductiva': ecop }, { collapsed: true }).addTo(map);
    L.control.scale({ imperial: false }).addTo(map);
    grp.current = L.layerGroup().addTo(map);
    map.on('click', function (e) { pickRef.current(e.latlng.lat, e.latlng.lng); });
    mapRef.current = map;
    return function () { map.remove(); };
  }, []);
  useEffect(function () { if (active && mapRef.current) setTimeout(function () { mapRef.current.invalidateSize(); }, 50); }, [active]);
  useEffect(function () { if (focus && mapRef.current) mapRef.current.setView([focus.lat, focus.lon], 18); }, [focus]);
  useEffect(function () {
    const map = mapRef.current, g = grp.current;
    if (!map || !g) return;
    g.clearLayers();
    if (!M) return;
    const D = M.D;
    L.circleMarker([D.lat, D.lon], { radius: 4, color: '#9E0101', weight: 2, fillColor: '#fff', fillOpacity: 1 }).addTo(g);
    if (M.mz) L.geoJSON(M.mz.geometry, { style: { color: '#5a6178', weight: 1.2, dashArray: '4 4', fill: false } }).addTo(g);
    if (M.parcel) {
      const lay = L.geoJSON(M.parcel.geometry, { style: { color: '#9E0101', weight: 2, fillColor: '#9E0101', fillOpacity: 0.12 } }).addTo(g);
      if (M.geo) {
        M.geo.frentes.forEach(function (fr) { fr.edgesLL.forEach(function (e) { L.polyline([[e[0][1], e[0][0]], [e[1][1], e[1][0]]], { color: '#E40000', weight: 5, opacity: 0.9 }).addTo(g); }); });
        if (M.geo.rayLL) L.polyline([[M.geo.rayLL[0][1], M.geo.rayLL[0][0]], [M.geo.rayLL[1][1], M.geo.rayLL[1][0]]], { color: '#1a1f2e', weight: 1.5, dashArray: '3 3' }).bindTooltip('calle ≈ ' + nf(M.geo.anchoCalle, 1) + ' m', { permanent: true, className: 'calle', direction: 'center' }).addTo(g);
      }
      if (!M.noFit) map.fitBounds(lay.getBounds(), { maxZoom: 19, padding: [60, 60] });
    } else if (!M.noFit) map.setView([D.lat, D.lon], Math.max(map.getZoom(), 17));
  }, [M]);
  useEffect(function () {
    const map = mapRef.current;
    if (!map) return;
    if (ovl.current) { map.removeLayer(ovl.current); ovl.current = null; }
    if (overlay) {
      ovl.current = L.tileLayer.wms(WMS, { layers: 'idecor:' + overlay.layer, format: 'image/png', transparent: true, version: '1.1.1', opacity: 0.85, CQL_FILTER: overlay.cql, zIndex: 50 }).addTo(map);
      if (overlay.bounds) map.fitBounds(overlay.bounds, { maxZoom: 16 });
    }
  }, [overlay]);
  return <div className="mapwrap"><div id="map" ref={el}></div>{!M && <div className="maphint">Tocá un lote en el mapa o buscalo arriba</div>}</div>;
}

/* ═══════ Búsqueda ═══════ */
async function buscar(q) {
  q = q.trim();
  let m;
  if ((m = q.match(/^(-?\d+(?:\.\d+)?)\s*[,; ]\s*(-?\d+(?:\.\d+)?)$/))) {
    let a = parseFloat(m[1]), b = parseFloat(m[2]);
    if (Math.abs(a) > Math.abs(b)) { const t = a; a = b; b = t; } // lat ~ -31, lon ~ -64
    return { go: { lat: a, lon: b } };
  }
  let prov = null;
  if (/^\d{1,2}\s*-\s*\d{1,2}\s*-\s*\d{1,3}\s*-\s*\d{1,3}$/.test(q)) prov = nomProv(q.replace(/\s/g, ''));
  else if (/^\d{16}$/.test(q)) prov = q;
  if (prov) {
    const fs = await wfs('parcelas', "Nomenclatura='" + prov + "'", { count: 1 });
    if (!fs.length) return { error: 'No encontré la parcela ' + q + ' en el parcelario provincial.' };
    const p = interiorPoint(fs[0].geometry); return { go: { lat: p[1], lon: p[0] } };
  }
  if (/^\d{10,13}$/.test(q)) {
    const fs = await wfs('parcelas', 'Nro_Cuenta=' + q, { count: 1 });
    if (!fs.length) return { error: 'No encontré la cuenta ' + q + '.' };
    const p = interiorPoint(fs[0].geometry); return { go: { lat: p[1], lon: p[0] } };
  }
  // dirección: Georef (datos.gob.ar); si no encuentra, reintenta sin las primeras palabras del nombre
  // (Georef guarda algunos nombres recortados, p. ej. "OSPO TREJO Y SANABRIA") y, al final, OpenStreetMap
  const out = [];
  async function georef(txt) {
    try {
      const u = 'https://apis.datos.gob.ar/georef/api/direcciones?direccion=' + encodeURIComponent(txt) + '&provincia=' + encodeURIComponent('Córdoba') + '&departamento=Capital&max=6';
      const j = await (await fetch(u)).json();
      (j.direcciones || []).forEach(function (d) { if (d.ubicacion && d.ubicacion.lat != null) out.push({ label: d.nomenclatura, lat: d.ubicacion.lat, lon: d.ubicacion.lon, addr: true }); });
    } catch (e) { }
  }
  await georef(q);
  const mNum = q.match(/^(.*?)[\s,]+(\d{1,5})\s*$/);
  if (!out.length && mNum) {
    const words = mNum[1].replace(/^(av(enida)?|bv|bulevar|calle|pje|pasaje)\.?\s+/i, '').split(/\s+/).filter(Boolean);
    for (let k = 1; k < words.length && !out.length; k++) await georef(words.slice(k).join(' ') + ' ' + mNum[2]);
  }
  if (!out.length) {
    try {
      const u = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&countrycodes=ar&viewbox=-64.36,-31.28,-64.04,-31.56&bounded=1&q=' + encodeURIComponent(q);
      const j = await (await fetch(u)).json();
      j.forEach(function (d) {
        const house = d.type === 'house' || d.addresstype === 'building' || d.category === 'building';
        out.push({ label: d.display_name.split(', Pedanía')[0] + (mNum && !house ? ' · sin altura' : ''), lat: parseFloat(d.lat), lon: parseFloat(d.lon), approx: !!mNum && !house });
      });
    } catch (e) { }
  }
  if (!out.length) return { error: 'No encontré "' + q + '". Probá con calle y altura (ej. "Obispo Trejo 300"), nomenclatura (04-02-065-002) o cuenta.' };
  if (out.length === 1) return { go: out[0] };
  return { list: out };
}

// Georef ubica la altura sobre el eje de la calle: se toma la parcela más cercana a ese punto
async function snapParcela(lat, lon) {
  try {
    const fs = await wfs('parcelas', 'DWITHIN(geom,SRID=4326;POINT(' + lon + ' ' + lat + '),35,meters)', { props: 'Nomenclatura,geom', count: 30, timeout: 12000 });
    if (!fs.length) return null;
    const P = E.makeProj(lon, lat);
    let best = null, bd = Infinity;
    fs.forEach(function (f) {
      const r = E.outerRing(f.geometry); if (!r) return;
      const R = r.map(P.f);
      let d = E.inside([0, 0], R) ? 0 : Infinity;
      for (let i = 0; i < R.length && d > 0; i++) {
        const a = R[i], b = R[(i + 1) % R.length], vx = b[0] - a[0], vy = b[1] - a[1];
        const t = Math.max(0, Math.min(1, -(a[0] * vx + a[1] * vy) / (vx * vx + vy * vy || 1)));
        d = Math.min(d, Math.hypot(a[0] + t * vx, a[1] + t * vy));
      }
      if (d < bd) { bd = d; best = f; }
    });
    if (!best) return null;
    const ip = interiorPoint(best.geometry);
    return ip ? { lat: ip[1], lon: ip[0] } : null;
  } catch (e) { return null; }
}

const SB_KEY = 'sb_publishable_HOL_2wM5kz2tPr7t8oTJWQ_X2pRapkh'; // clave publishable o anon (pública): la seguridad la da RLS
const ESTADOS = [
  ['nuevo', 'Nuevo', '#8b92a5'],

  ['oferta', 'Oferta', '#d48806'],
  ['reservado', 'Reservado', '#7c4dcc'],

];

function autorActual() { try { return (localStorage.getItem('ac_nombre') || '').trim().slice(0, 120); } catch (e) { return ''; } }
async function sbReq(path, o) {
  o = o || {};
  // Sirve con la clave anon clásica (eyJ...) o con la nueva publishable (sb_publishable_...), que no lleva Authorization
  const h = { apikey: SB_KEY };
  if (/^eyJ/.test(SB_KEY)) h.Authorization = 'Bearer ' + SB_KEY;
  // Autor de cada alta: el nombre guardado en este navegador
  if ((o.method || 'GET') === 'POST' && o.body && typeof o.body === 'object' && !Array.isArray(o.body)) {
    const campo = /^lote_notas/.test(path) ? 'autor_email' : /^lotes/.test(path) ? 'creado_por_email' : null;
    if (campo && !o.body[campo]) o.body = Object.assign({}, o.body, { [campo]: autorActual() || null });
  }
  // Toda edición o baja de un lote deja quién la hizo
  if (o.method === 'PATCH' && /^lotes\?/.test(path) && o.body && typeof o.body === 'object') {
    o.body = Object.assign({}, o.body, { actualizado_por: autorActual() || null });
  }
  if (o.body !== undefined) h['Content-Type'] = 'application/json';
  if (o.prefer) h.Prefer = o.prefer;
  const r = await fetch(SB_URL + '/rest/v1/' + path, { method: o.method || 'GET', headers: h, body: o.body !== undefined ? JSON.stringify(o.body) : undefined });
  if (!r.ok) {
    let j = {}; try { j = await r.json(); } catch (e) { }
    const e = new Error(j.message || ('HTTP ' + r.status)); e.status = r.status; e.code = j.code;
    if (j.code === '42P01' || j.code === 'PGRST205' || /does not exist|schema cache/i.test(j.message || '')) e.missing = true;
    throw e;
  }
  if (r.status === 204) return null;
  const t = await r.text();

  const m2v = us.reduce(function (s, u) { return s + (u.m2 || 0); }, 0);
  const cp = (n.comercialPct || 0) / 100;
  const comercial = ventas * cp;

    m2c: m2c, terreno: terreno, construccion: construccion, indirectos: indirectos, comercial: comercial, costo: costo, ventas: ventas, m2v: m2v, margen: margen,

  const tone = c.margen > 0 ? 'var(--ok)' : c.margen < 0 ? 'var(--err)' : 'var(--c1)';

  return <div className="negocio">
    <h3 className="lbl" style={{ marginTop: 18 }}>Negocio</h3>
    <p className="small muted" style={{ margin: '2px 0 8px' }}>Costo total del proyecto, unidades de venta y margen. Todo en dólares; la cabida es la de la calculadora ({nf(cabida)} m²).</p>
    <div className="inputs" style={{ gridTemplateColumns: 'repeat(auto-fit,minmax(150px,1fr))' }}>
      {fld('terreno', 'Valor del terreno', 'US$', 'precio pedido')}
      {fld('costoM2', 'Costo de construcción', 'US$/m²', 'ej. 900')}
      {fld('m2Construir', 'M² a construir', 'm²', nf(cabida) + ' (cabida)')}
      {fld('indirectosPct', 'Indirectos', '% constr.', 'honorarios, permisos')}
      {fld('comercialPct', 'Comercialización', '% ventas', 'ej. 3')}
    </div>

    <div style={{ display: 'flex', gap: 8, alignItems: 'flex-end', flexWrap: 'wrap', marginTop: 12 }}>
      <label className="fld" style={{ width: 120 }}><span>Unidades</span><span className="row"><input inputMode="numeric" value={f.cantidad} onChange={setK('cantidad')} /></span></label>
      <label className="fld" style={{ width: 170 }}><span>Precio de venta</span><span className="row"><input inputMode="decimal" value={f.precioM2} onChange={setK('precioM2')} placeholder="ej. 2200" /><span className="u">US$/m²</span></span></label>
      <button className="btn" onClick={repartir} title={'Divide ' + nf(vendEst) + ' m² vendibles en partes iguales'}>Repartir en partes iguales</button>
      <button className="btn" onClick={function () { agregarU(); }}>+ Unidad</button>
      <button className="btn" onClick={function () { agregarU('cochera'); }}>+ Cochera</button>
    </div>
    <p className="small muted" style={{ marginTop: 4 }}>Vendible estimado: {nf(vendEst)} m² ({Math.round(ef * 100)}% de lo construido, ajustable en "Superficie vendible"). Después de repartir podés editar cada unidad: nombre, m², precio por m² o precio total.</p>

    {f.unidades.length > 0 && <div className="tw"><table className="t neg">
      <thead><tr><th style={{ textAlign: 'left' }}>Unidad</th><th>m²</th><th>US$/m²</th><th>Precio US$</th><th></th></tr></thead>
      <tbody>{f.unidades.map(function (u) {
        return <tr key={u.id}>
          <td style={{ textAlign: 'left' }}><input className="cell" style={{ textAlign: 'left', fontFamily: 'var(--ff)', minWidth: 110 }} value={u.nombre} onChange={function (e) { setU(u.id, 'nombre', e.target.value); }} maxLength={60} /></td>
          <td><input className="cell" inputMode="decimal" value={u.m2} onChange={function (e) { setU(u.id, 'm2', e.target.value); }} /></td>
          <td><input className="cell" inputMode="decimal" value={u.pm2} onChange={function (e) { setU(u.id, 'pm2', e.target.value); }} /></td>
          <td><input className="cell" inputMode="decimal" value={u.precio} onChange={function (e) { setU(u.id, 'precio', e.target.value); }} /></td>
          <td style={{ minWidth: 0 }}><button className="btn-i" title="Quitar" aria-label="Quitar unidad" onClick={function () { quitarU(u.id); }}>✕</button></td>
        </tr>;
      })}</tbody>
      <tfoot><tr><td>{f.unidades.length} unidades</td><td>{nf(c.m2v, 1)}</td><td>{c.m2v > 0 ? nf(c.ventas / c.m2v) : '—'}</td><td>{nf(c.ventas)}</td><td style={{ minWidth: 0 }}></td></tr></tfoot>
    </table></div>}
    {f.unidades.length > 0 && c.m2v > 0 && Math.abs(c.m2v - vendEst) / vendEst > 0.05 && <div className="alert info">Las unidades suman {nf(c.m2v)} m² y lo vendible estimado es {nf(vendEst)} m². Revisá si falta o sobra superficie.</div>}

    <div className="metrics" style={{ marginTop: 12 }}>
      <div className="metric"><div className="lbl">Costo total</div><div className="v" title={usd(c.costo)}>{usdC(c.costo)}</div><div className="d">{c.costoM2Total ? usd(c.costoM2Total) + ' por m² construido' : 'cargá el costo por m²'}</div></div>
      <div className="metric"><div className="lbl">Ventas</div><div className="v" title={usd(c.ventas)}>{usdC(c.ventas)}</div><div className="d">{c.m2v > 0 ? nf(c.m2v) + ' m² vendibles' : 'cargá las unidades'}</div></div>
      <div className="metric"><div className="lbl">Margen</div><div className="v" style={{ color: tone }} title={usd(c.margen)}>{usdC(c.margen)}</div><div className="d">{pct(c.margenVentas)} sobre ventas · {pct(c.margenCosto)} sobre costo</div></div>
      <div className="metric"><div className="lbl">Equilibrio</div><div className="v">{c.equilibrioM2 ? usd(c.equilibrioM2) : '—'}</div><div className="d">precio por m² con margen cero</div></div>
    </div>
    <div className="tw"><table className="t">
      <tbody>
        <tr><td>Terreno</td><td>{usd(c.terreno)}</td><td>{pct(c.costo > 0 ? c.terreno / c.costo : null)} del costo · {pct(c.incTerreno)} de las ventas</td></tr>
        <tr><td>Construcción</td><td>{usd(c.construccion)}</td><td>{nf(c.m2c)} m² × {usd(n.costoM2)}</td></tr>
        <tr><td>Indirectos</td><td>{usd(c.indirectos)}</td><td>{n.indirectosPct ? nf(n.indirectosPct, 1) + '% de la construcción' : 'sin cargar'}</td></tr>
        <tr><td>Comercialización</td><td>{usd(c.comercial)}</td><td>{n.comercialPct ? nf(n.comercialPct, 1) + '% de las ventas' : 'sin cargar'}</td></tr>
      </tbody>
      <tfoot><tr><td>Costo total</td><td>{usd(c.costo)}</td><td>Margen {usd(c.margen)} ({pct(c.margenVentas)})</td></tr></tfoot>
    </table></div>
    {!n.indirectosPct && !n.comercialPct && c.ventas > 0 && <p className="small muted" style={{ marginTop: 6 }}>Sin indirectos ni comercialización el margen queda inflado: honorarios, permisos, impuestos y venta suelen sumar bastante sobre la obra.</p>}
    <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginTop: 10 }}>
      <button className="btn pri" onClick={guardar} disabled={busy}>{busy ? 'Guardando…' : 'Guardar negocio'}</button>
      {msg && <span className="small" style={{ color: /guardado/.test(msg) ? 'var(--ok)' : 'var(--err)', fontWeight: 700 }}>{msg}</span>}
    </div>
  </div>;
}

/* ── Tarjeta de cartera dentro de la ficha del lote ── */
function CarteraCard({ M, sess, lote, onLogin, onChange, onApply, cartErr, q, marcarAplicado, empresaDestino, empresas }) {
  const [notas, setNotas] = useState(null);
  const [nota, setNota] = useState('');
  const [busy, setBusy] = useState('');
  const [err, setErr] = useState('');
  const [f, setF] = useState(null);
  const [escNom, setEscNom] = useState('');
  const [borrar, setBorrar] = useState(false);
  const [tc, setTc] = useState(null);
  useEffect(function () { tipoCambioMEP().then(setTc); }, []);
  useEffect(function () {
    setErr(''); setBorrar(false);
    if (lote) {
      setF(formDesdeLote(lote));
      setNotas(null);
      sbReq('lote_notas?lote_id=eq.' + lote.id + '&select=*&order=created_at.desc').then(setNotas).catch(function (e) { setErr(faltaTabla(e)); setNotas([]); });
    } else setF(null);
  }, [lote && lote.id, lote && lote.updated_at]);

  if (!sess) return <Card title="Cartera de lotes" src="Supabase · ECIPSA">
    <p>Guardá este análisis en la cartera para seguirlo con notas, estado, precio y escenarios desde cualquier dispositivo.</p>
    <button className="btn pri" style={{ marginTop: 10 }} onClick={onLogin}>Ingresar</button>
  </Card>;
  if (cartErr) return <Card title="Cartera de lotes" src="Supabase · ECIPSA"><div className="alert err">{cartErr}</div></Card>;

  const r = M.cabida, N = M.cabidaN, S = M.det.S;
  const cabida = r && !r.error ? r.total : (lote && lote.cabida_m2) || null;
  const vut = M.D.vt[0] ? E.num(M.D.vt[0].properties.vut_pesos) : null;

  const nuevaNota = async function (lt, texto, tipo) {
    return sbReq('lote_notas', { method: 'POST', body: { lote_id: lt.id, empresa: lt.empresa, texto: texto, tipo: tipo || 'nota' }, prefer: 'return=minimal' });
  };
  const cuerpoAnalisis = function () {
    const pp = M.pp;
    return {
      nomenclatura: pp ? String(pp.Nomenclatura) : null,
      nom_muni: pp ? nomMuni(pp.Nomenclatura) : null,
      cuenta: pp && pp.Nro_Cuenta ? String(pp.Nro_Cuenta) : null,
      lat: M.D.lat, lon: M.D.lon,
      superficie: S || null,
      zona: N ? N.etiqueta : (M.normas[0] ? M.normas[0].etiqueta : null),
      norma: N ? (N.ordModif || N.ordOriginal || null) : null,
      cabida_m2: r && !r.error ? Math.round(r.total) : null,
      unidades: r && !r.error && r.units && r.units.n ? r.units.n : null,
      analisis: Object.assign(snapshot(M), lote && lote.analisis && lote.analisis.negocio ? { negocio: lote.analisis.negocio } : {})
    };
  };
  const agregar = async function () {
    setBusy('add'); setErr('');
    try {
      const b = Object.assign(cuerpoAnalisis(), { nombre: M.pp ? 'Parcela ' + nomMuni(M.pp.Nomenclatura) : 'Lote ' + M.D.lat.toFixed(5) + ', ' + M.D.lon.toFixed(5), estado: 'en_analisis' });
      if (empresaDestino) b.empresa = empresaDestino;
      const rows = await sbReq('lotes', { method: 'POST', body: b, prefer: 'return=representation' });
      const lt = rows && rows[0];
      if (lt) await nuevaNota(lt, 'Agregado a la cartera: ' + (b.cabida_m2 != null ? nf(b.cabida_m2) + ' m² de cabida' : 'sin cabida calculada') + (b.zona ? ' · ' + b.zona : ''), 'sistema');
      marcarAplicado();
      await onChange();
    } catch (e) { setErr(e.status === 409 ? 'Este lote ya está en la cartera. Actualizá la página de la cartera.' : faltaTabla(e)); }
    setBusy('');
  };
  const actualizarAnalisis = async function () {
    setBusy('upd'); setErr('');
    try {
      const b = cuerpoAnalisis();
      await sbReq('lotes?id=eq.' + lote.id, { method: 'PATCH', body: b, prefer: 'return=minimal' });
      await nuevaNota(lote, 'Análisis actualizado: ' + (b.cabida_m2 != null ? nf(b.cabida_m2) + ' m²' : 'sin cabida') + (lote.cabida_m2 != null && b.cabida_m2 != null && Math.round(lote.cabida_m2) !== b.cabida_m2 ? ' (antes ' + nf(lote.cabida_m2) + ' m²)' : ''), 'sistema');
      marcarAplicado();
      await onChange();
    } catch (e) { setErr(faltaTabla(e)); }
    setBusy('');
  };
  const guardarDatos = async function () {
    setBusy('save'); setErr('');
    try { await guardarCambiosLote(lote, f); await onChange(); }
    catch (e) { setErr(faltaTabla(e)); }
    setBusy('');
  };
  const agregarNota = async function () {
    const t = nota.trim(); if (!t) return;
    setBusy('nota'); setErr('');
    try { await nuevaNota(lote, t.slice(0, 4000), 'nota'); setNota(''); setNotas(await sbReq('lote_notas?lote_id=eq.' + lote.id + '&select=*&order=created_at.desc')); }
    catch (e) { setErr(faltaTabla(e)); }
    setBusy('');
  };
  const borrarNota = async function (n) {
    try { await sbReq('lote_notas?id=eq.' + n.id, { method: 'DELETE' }); setNotas(notas.filter(function (x) { return x.id !== n.id; })); }
    catch (e) { setErr(faltaTabla(e)); }
  };
  const guardarEscenario = async function () {
    if (!r || r.error) { setErr('No hay cabida calculada para guardar como escenario.'); return; }
    setBusy('esc'); setErr('');
    try {
      const esc = (lote.escenarios || []).slice();
      esc.push({ id: Date.now().toString(36), nombre: escNom.trim() || ('Escenario ' + (esc.length + 1)), fecha: new Date().toISOString(), autor: sess.email, normaSel: M.normaSelIdx != null ? M.normaSelIdx : null, norma: N ? N.etiqueta : null, inputs: Object.assign({}, M.cabidaV), resultado: { total: Math.round(r.total), floors: r.floors, h: r.hReached, index: r.index, units: r.units ? r.units.label : null, limit: r.limit } });
      await sbReq('lotes?id=eq.' + lote.id, { method: 'PATCH', body: { escenarios: esc.slice(-30) }, prefer: 'return=minimal' });
      setEscNom('');
      await onChange();
    } catch (e) { setErr(faltaTabla(e)); }
    setBusy('');
  };
  const borrarEscenario = async function (id) {
    try { await sbReq('lotes?id=eq.' + lote.id, { method: 'PATCH', body: { escenarios: (lote.escenarios || []).filter(function (e) { return e.id !== id; }) }, prefer: 'return=minimal' }); await onChange(); }
    catch (e) { setErr(faltaTabla(e)); }
  };
  const guardarNegocio = async function (g, c) {
    await sbReq('lotes?id=eq.' + lote.id, { method: 'PATCH', body: { analisis: Object.assign({}, lote.analisis || {}, { negocio: g }) }, prefer: 'return=minimal' });
    await nuevaNota(lote, 'Negocio: costo ' + usd(c.costo) + ' · ventas ' + usd(c.ventas) + ' · margen ' + usd(c.margen) + (c.margenVentas != null ? ' (' + pct(c.margenVentas) + ' sobre ventas)' : ''), 'sistema');
    await onChange();
  };
  const borrarLote = async function () {
    setBusy('del');
    try { await sbReq('lotes?id=eq.' + lote.id, { method: 'PATCH', body: { eliminado: true }, prefer: 'return=minimal' }); await onChange(); }
    catch (e) { setErr(faltaTabla(e)); }
    setBusy(''); setBorrar(false);
  };

  if (!lote) return <Card title="Cartera de lotes" src="Grupo ECIPSA">
    <p>Este lote no está en la cartera. Al agregarlo se guarda una foto del análisis (zona, parámetros, datos usados y cabida) para compararla después con la norma vigente.</p>
    {err && <div className="alert err">{err}</div>}
    <button className="btn pri" style={{ marginTop: 10 }} onClick={agregar} disabled={busy === 'add'}>{busy === 'add' ? 'Guardando…' : 'Agregar a la cartera'}</button>
  </Card>;

  const snap = lote.analisis;
  const cambios = cambiosNorma(snap, N);
  const ind = f ? indicadores(camposDesdeForm(f), cabida, S, vut, tc) : null;
  const esc = lote.escenarios || [];
  const escIndic = function (e) { const pu = precioUSD(lote); return pu != null && e.resultado && e.resultado.total ? pu / e.resultado.total : null; };

  return <section className="card hero">
    <div className="card-h"><span>Cartera de lotes</span><EstadoTag k={lote.estado} /></div>
    <div className="card-b">
      <div className="small muted" style={{ marginBottom: 10 }}>Guardado por {lote.creado_por_email || '—'} el {fecha(lote.created_at)} · actualizado {fechaHora(lote.updated_at)}{lote.actualizado_por ? ' por ' + lote.actualizado_por : ''}</div>
      {cambios.length > 0 && <div className="alert">Desde el análisis del {fecha(snap.fecha)} cambió la norma: {cambios.join(' · ')}. <button className="btn" style={{ marginLeft: 6 }} onClick={actualizarAnalisis} disabled={busy === 'upd'}>Actualizar análisis</button></div>}
      {snap && snap.resultado && r && !r.error && Math.abs(snap.resultado.total - r.total) > 1 && cambios.length === 0 && <div className="alert info">Con los datos de hoy la cabida da {nf(r.total)} m²; en el análisis guardado ({fecha(snap.fecha)}) daba {nf(snap.resultado.total)} m². <button className="btn" style={{ marginLeft: 6 }} onClick={actualizarAnalisis} disabled={busy === 'upd'}>{busy === 'upd' ? 'Guardando…' : 'Guardar el análisis actual'}</button></div>}
      {f && <Fragment>
        <CamposLote f={f} setF={setF} tc={tc} />
        {ind && <div className="metrics" style={{ marginTop: 10 }}>
          <div className="metric"><div className="lbl">Incidencia</div><div className="v">{usd(ind.porConstruible)}</div><div className="d">por m² construible{cabida ? ' · ' + nf(cabida) + ' m²' : ''}</div></div>
          <div className="metric"><div className="lbl">Por m² vendible</div><div className="v">{usd(ind.porVendible)}</div><div className="d">{f.eficiencia}% de la cabida</div></div>
          <div className="metric"><div className="lbl">Por m² de terreno</div><div className="v">{usd(ind.porTerreno)}</div><div className="d">{S ? nf(S) + ' m² de lote' : ''}</div></div>
          <div className="metric"><div className="lbl">Valor tierra IDECOR</div><div className="v">{usd(ind.oficialUSD)}</div><div className="d">{ind.oficialUSD && ind.porTerreno ? 'pedido ' + nf(ind.porTerreno / ind.oficialUSD * 100) + '% del valor de referencia' : 'por m² · ' + (ind.tcRef ? 'TC ' + nf(ind.tcRef) : 'sin TC')}</div></div>
        </div>}
        {!f.tipo_cambio && tc && <p className="small muted" style={{ marginTop: 4 }}>Para pasar a dólares se usa el MEP de venta del {fecha(tc.fecha)} (US$ 1 = $ {nf(tc.v)}, dolarapi.com) salvo que cargues otro tipo de cambio.</p>}
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginTop: 10 }}>
          <button className="btn pri" onClick={guardarDatos} disabled={busy === 'save'}>{busy === 'save' ? 'Guardando…' : 'Guardar cambios'}</button>
          <button className="btn" onClick={actualizarAnalisis} disabled={busy === 'upd'}>{busy === 'upd' ? 'Guardando…' : 'Guardar el análisis actual'}</button>
          {!borrar ? <button className="btn" onClick={function () { setBorrar(true); }}>Quitar de la cartera</button>
            : <span className="small" style={{ display: 'inline-flex', gap: 6, alignItems: 'center' }}>Se borran también sus notas y escenarios. <button className="btn" onClick={borrarLote} disabled={busy === 'del'} style={{ color: 'var(--err)', borderColor: 'var(--err)' }}>Sí, quitar</button><button className="btn" onClick={function () { setBorrar(false); }}>No</button></span>}
        </div>
      </Fragment>}
      {err && <div className="alert err">{err}</div>}

      <NegocioPanel lote={lote} cabida={cabida != null ? Math.round(cabida) : null} unidadesSug={r && !r.error && r.units ? (r.units.alt ? r.units.alt.n : r.units.n) : null} onGuardar={guardarNegocio} />

      <h3 className="lbl" style={{ marginTop: 18 }}>Escenarios · {esc.length}</h3>
      <p className="small muted" style={{ margin: '2px 0 6px' }}>Guardan los datos de la calculadora tal como están ahora (superficie, frente, fondo, alturas, retiros, norma aplicada). Para un englobamiento, cargá en la calculadora la superficie y las medidas sumadas y guardalo como escenario.</p>
      {esc.length > 0 && <div className="tw"><table className="t">
        <thead><tr><th>Escenario</th><th>m²</th><th>Plantas</th><th>Altura</th><th>Unid.</th><th>US$/m²</th><th></th></tr></thead>
        <tbody>{esc.map(function (e) {
          const x = e.resultado || {};
          return <tr key={e.id}>
            <td style={{ fontFamily: 'var(--ff)' }}><b>{e.nombre}</b><div className="small muted">{(e.inputs && e.inputs.S ? nf(parseFloat(e.inputs.S)) + ' m² · ' : '') + (e.norma || '') + ' · ' + fecha(e.fecha)}</div></td>
            <td>{nf(x.total)}</td><td>{x.floors <= 1 ? 'PB' : 'PB+' + (x.floors - 1)}</td><td>{n2(x.h)}</td><td>{x.units || '—'}</td><td>{usd(escIndic(e))}</td>
            <td style={{ whiteSpace: 'nowrap' }}><button className="btn" onClick={function () { onApply(e); }}>Aplicar</button> <button className="btn" onClick={function () { borrarEscenario(e.id); }} title="Borrar escenario">✕</button></td>
          </tr>;
        })}</tbody>
      </table></div>}
      <div style={{ display: 'flex', gap: 8, marginTop: 8, flexWrap: 'wrap' }}>
        <input className="sin" style={{ minWidth: 180, maxWidth: 320 }} value={escNom} onChange={function (e) { setEscNom(e.target.value); }} placeholder={'Nombre (ej. "Englobado con 003")'} maxLength={80} />
        <button className="btn" onClick={guardarEscenario} disabled={busy === 'esc'}>{busy === 'esc' ? 'Guardando…' : 'Guardar escenario actual' + (r && !r.error ? ' (' + nf(r.total) + ' m²)' : '')}</button>
      </div>

      <h3 className="lbl" style={{ marginTop: 18 }}>Notas</h3>
      <div style={{ display: 'flex', gap: 8, alignItems: 'flex-start', marginTop: 6 }}>
        <textarea className="note" value={nota} onChange={function (e) { setNota(e.target.value); }} placeholder="Visita, charla con el dueño, dudas de norma, próximos pasos…" maxLength={4000} />
        <button className="btn pri" onClick={agregarNota} disabled={busy === 'nota' || !nota.trim()}>Agregar</button>
      </div>
      {notas === null ? <div className="ld"><div className="sp" /><span>Cargando notas…</span></div>
        : notas.length === 0 ? <p className="small muted" style={{ marginTop: 8 }}>Sin notas todavía.</p>
          : <ul className="notas">{notas.map(function (n) {
            return <li key={n.id} className={'n-' + n.tipo}>
              <div className="small muted">{fechaHora(n.created_at)} · {n.autor_email || '—'}{n.tipo !== 'nota' ? ' · ' + (n.tipo === 'estado' ? 'cambio de estado' : n.tipo === 'precio' ? 'cambio de precio' : 'sistema') : ''}
                {false && <button className="btn-i" style={{ width: 20, height: 20, fontSize: 11, marginLeft: 4 }} title="Borrar nota" onClick={function () { borrarNota(n); }}>✕</button>}</div>
              <div style={{ whiteSpace: 'pre-wrap' }}>{n.texto}</div>
            </li>;
          })}</ul>}
    </div>
  </section>;
}

/* ── Mapa de la cartera ── */
function CarteraMap({ rows, onOpen }) {
  const el = useRef(null), mapRef = useRef(null), grp = useRef(null), openRef = useRef(onOpen);
  openRef.current = onOpen;
  useEffect(function () {
    const map = L.map(el.current, { zoomControl: true }).setView([-31.4167, -64.1833], 12);
    baseLayer('gris').addTo(map);
    grp.current = L.featureGroup().addTo(map);
    mapRef.current = map;
    setTimeout(function () { map.invalidateSize(); }, 60);
    return function () { map.remove(); };
  }, []);
  useEffect(function () {
    const g = grp.current, map = mapRef.current;
    if (!g || !map) return;
    g.clearLayers();
    rows.forEach(function (l) {
      const e = estadoInfo(l.estado);
      const m = L.circleMarker([l.lat, l.lon], { radius: 7, color: '#fff', weight: 2, fillColor: e[2], fillOpacity: 0.95 });

      const s = document.createElement('div'); s.style.fontSize = '11px'; s.textContent = e[1] + (l.cabida_m2 != null ? ' · ' + nf(l.cabida_m2) + ' m²' : '') + (l.zona ? ' · ' + l.zona : ''); div.appendChild(s);
      const a = document.createElement('a'); a.href = '#'; a.textContent = 'Abrir ficha'; a.style.fontSize = '12px'; a.onclick = function (ev) { ev.preventDefault(); openRef.current(l); }; div.appendChild(a);
      m.bindPopup(div);
      m.addTo(g);
    });
    if (rows.length) map.fitBounds(g.getBounds(), { maxZoom: 16, padding: [30, 30] });
  }, [rows]);
  return <div style={{ height: 340, border: '1px solid var(--b1)', borderRadius: 3, overflow: 'hidden', marginBottom: 12 }}><div ref={el} style={{ height: '100%' }}></div></div>;
}

function cargarXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise(function (res, rej) {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload = function () { res(window.XLSX); }; s.onerror = function () { rej(new Error('No se pudo cargar el exportador de Excel.')); };
    document.head.appendChild(s);
  });
}

  const doSearch = async function (e) {
    e && e.preventDefault();
    if (!q.trim()) return;
    setBusy(true); setErr(null); setOpts(null);
    try {
      const r = await buscar(q);
      if (r.error) { setErr(r.error); setBusy(false); }
      else if (r.list) { setOpts(r.list); setBusy(false); }
      else goTo(r.go);
    } catch (e2) { setErr('La búsqueda falló: ' + (e2.message || e2)); setBusy(false); }
  };

  const flash = function (t) { setToast(t); setTimeout(function () { setToast(function (x) { return x === t ? '' : x; }); }, 2500); };
  const copy = function () {
    if (!M) return;
    const txt = resumen(M);
    const fb = function () { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); flash('Resumen copiado'); } catch (e) { flash('No se pudo copiar'); } ta.remove(); };
    try { navigator.clipboard.writeText(txt).then(function () { flash('Resumen copiado'); }, fb); } catch (e) { fb(); }
  };
  const showOnMap = async function (o) {
    let bounds = null;
    if (o.zoomLayer) {
      try { const fs = await wfs(o.zoomLayer, 'id=' + o.zoomId); if (fs.length) bounds = L.geoJSON(fs[0]).getBounds(); } catch (e) { }
    }
    setOverlay({ layer: o.layer, cql: o.cql, label: o.label, bounds: bounds });
    setTab('lote');
  };


  return <DigCtx.Provider value={dg}>
    <div className="hdr">
      <a href="./" className="logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><rect x="4" y="2" width="16" height="20" rx="2" /><path d="M9 22v-4h6v4" /><path d="M8 6h.01M16 6h.01M12 6h.01M8 10h.01M16 10h.01M12 10h.01M8 14h.01M16 14h.01M12 14h.01" /></svg>
        Análisis de Cabida
      </a>
      <span className="hdr-sep" style={{ color: 'var(--b0)' }}>|</span>
      <span className="hdr-title">Normativa y Cabida · Córdoba</span>
      <div className="seg" style={{ marginLeft: 8 }}>
        <button className={tab === 'lote' ? 'on' : ''} onClick={function () { setTab('lote'); }}>Lote</button>
        <button className={tab === 'ord' ? 'on' : ''} onClick={function () { setTab('ord'); }}>Ordenanzas</button>
        <button className={tab === 'cartera' ? 'on' : ''} onClick={function () { setTab('cartera'); }}>Cartera{carteraVis && carteraVis.length ? ' · ' + carteraVis.length : ''}</button>
      </div>
      <div className="acts">
        <UserMenu sess={sess} setSess={setSess} />
        <button className="btn-i" onClick={togTheme} title="Cambiar tema">{theme === 'light' ? '🌙' : '☀️'}</button>
      </div>
    </div>

    <div style={{ display: tab === 'lote' ? 'contents' : 'none' }}>
      <form className="sbar" onSubmit={doSearch}>
        <input className="sin" value={q} onChange={function (e) { setQ(e.target.value); }} placeholder="Dirección (Obispo Trejo 300), nomenclatura (04-02-065-002), cuenta o coordenadas" aria-label="Buscar lote" />
        <button className="btn pri" type="submit" disabled={busy}>{busy ? 'Consultando…' : 'Buscar'}</button>
        {overlay && <span className="tag tag-ac" style={{ cursor: 'pointer' }} onClick={function () { setOverlay(null); }} title="Quitar resaltado">{overlay.label} en el mapa ✕</span>}
        <span className="shint">o tocá el lote en el mapa</span>
        {opts && <div className="sres">{opts.map(function (o, i) { return <button key={i} type="button" onClick={function () { setOpts(null); goTo(o); }}>{o.label}</button>; })}</div>}
      </form>
      <div className="main">
        <MapView onPick={pick} M={M} overlay={overlay} active={tab === 'lote'} focus={focus} />
        <div className="panel">
          {err && <div className="alert" style={{ marginTop: 0, marginBottom: 10 }}>{err}</div>}
          {busy && <div className="ld"><div className="sp" /><span>Consultando 23 capas de IDECOR para este punto…</span></div>}
          {!M && !busy && <div className="card"><div className="empty">
            <h2>Normativa y cabida por lote</h2>
            <p>Datos oficiales de la Municipalidad de Córdoba publicados en IDECOR, consultados en vivo.</p>
            <div className="steps">
              <div><b>1</b><span>Buscá la dirección, la nomenclatura o la cuenta, o tocá el lote en el mapa.</span></div>
              <div><b>2</b><span>La ficha junta ocupación, uso y fraccionamiento del suelo, centro de manzana, patrimonio, loteos, convenios y valores de referencia.</span></div>
              <div><b>3</b><span>La cabida se calcula con el FOS, FOT, alturas y retiros vigentes de la zona y la geometría real del lote. Podés ajustar cada dato.</span></div>
            </div>
            <p className="small muted" style={{ marginTop: 14 }}>Probá con <a href="#-31.413500,-64.188800" onClick={function (e) { e.preventDefault(); pick(-31.4135, -64.1888); }}>un lote en Nueva Córdoba</a>.</p>
          </div></div>}
          {M && !busy && <Fragment>
            <div className="print-only" style={{ marginBottom: 10 }}><b>Análisis de Cabida · Córdoba</b> · {new Date().toLocaleDateString('es-AR')}</div>
            <div className="no-print" style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 10, alignItems: 'center' }}>
              <button className="btn pri" onClick={copy}>Copiar resumen</button>
              <button className="btn" onClick={function () { window.print(); }}>Imprimir / PDF</button>
              <a className="btn" href={MAPA311} target="_blank" rel="noopener">Ver en MapasCórdoba ↗</a>
              {toast && <span className="small" style={{ color: 'var(--ok)', fontWeight: 700 }}>{toast}</span>}
            </div>
            <AvisosNorma M={M} />
            <LoteCard M={M} lote={loteActual} />
            <CabidaCard M={M} normaSel={normaSel} setNormaSel={setNormaSel} preset={preset} />
            <div className="no-print"><CarteraCard M={M} sess={sess} lote={loteActual} cartErr={cartErr} q={q} empresaDestino={empresaDestino} empresas={empresas} onLogin={salir} onChange={loadCartera} onApply={aplicarEscenario} marcarAplicado={function () { aplicado.current = M.D.t; }} /></div>
            <NormaCard M={M} />
            <UsoCard M={M} />
            <FraccCard M={M} />
            <CMCard M={M} />
            <PatrimonioCard M={M} />
            <EntornoCard M={M} />
            <OrdLoteCard M={M} />
            <p className="small muted">Fuente: capas WFS de IDECOR (Infraestructura de Datos Espaciales de la Provincia de Córdoba) con información de la Dirección de Planeamiento Urbano municipal y Catastro provincial, consultadas el {new Date(M.D.t).toLocaleString('es-AR')}. Herramienta de consulta: no reemplaza la visación ni el certificado de uso del suelo.</p>
          </Fragment>}
        </div>
      </div>
    </div>

    {tab === 'ord' && <div className="page"><div className="page-in">
      <h1 className="title-lote" style={{ fontSize: 20 }}>Ordenanzas que impactan en la ciudad</h1>
      <p className="sub" style={{ marginBottom: 14 }}>Marco normativo vigente según el Digesto municipal, más el índice de todas las normas citadas en las capas oficiales: zonas, perfiles, modificatorias, convenios urbanísticos y loteos aprobados.</p>
      <OrdIndex onMapa={showOnMap} />
    </div></div>}

    {tab === 'cartera' && <div className="page"><div className="page-in">
      {toast && <div className="alert ok" style={{ marginTop: 0 }}>{toast}</div>}
      <CarteraTab sess={sess} cartera={carteraVis} cartErr={cartErr} empresas={empresas} empCtx={ctx} onLogin={salir} onOpen={abrirDeCartera} onReload={loadCartera} locales={saved} onImportLocales={subirLocales} />
    </div></div>}
    {!nombreValido(sess.email) && <NombreModal obligatorio actual={sess.email} onOk={function (n) { setSess(Object.assign({}, sess, { email: n })); }} />}
  </DigCtx.Provider>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
